name: 发布门户与灵犀网页端

on:
  workflow_dispatch:

concurrency:
  group: hi-veblen-production
  cancel-in-progress: false

env:
  LINGXI_SHA: 10f8f3a47d3207f4e55afab3e51b8034faf43cfd
  EXPECTED_PERSONA_SCHEMA_PHASE: compat
  EXPECTED_PERSONA_GROWTH_PHASE: compat

jobs:
  build:
    name: 构建双站发布包
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      checks: read

    steps:
      - name: 校验 main 同提交严格 CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          revision = os.environ["GITHUB_SHA"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/commits/{revision}/check-runs?per_page=100",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              runs = json.load(response).get("check_runs", [])
          conclusions = {run.get("name"): run.get("conclusion") for run in runs}
          required = ("Release gate", "Admin quality", "Portal E2E")
          failed = {name: conclusions.get(name) for name in required if conclusions.get(name) != "success"}
          if failed:
              raise SystemExit(f"同提交严格 CI 未全部成功：{failed}")
          print("同提交严格 CI 已通过")
          PY

      - name: 检出门户代码
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: 校验跨仓库只读凭据
        env:
          LINGXI_REPO_TOKEN: ${{ secrets.LINGXI_REPO_TOKEN }}
        run: test -n "$LINGXI_REPO_TOKEN"

      - name: 检出灵犀代码
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: Timking123/Lingxi
          ref: ${{ env.LINGXI_SHA }}
          path: lingxi-source
          token: ${{ secrets.LINGXI_REPO_TOKEN }}
          persist-credentials: false

      - name: 设置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            lingxi-source/ui/frontend/package-lock.json

      - name: 设置 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: lingxi-source/requirements-ci.txt

      - name: 验证 Lingxi 确定性状态
        working-directory: lingxi-source
        run: |
          test -s requirements-ci.txt
          python -m pip install -r requirements-ci.txt
          python scripts/verify_state.py
        env:
          PYTHONUTF8: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'

      - name: 构建门户
        run: |
          npm ci
          npm run type-check
          npm run test -- src/views/__tests__/Home.test.ts
          npm run build:skip-check
        env:
          VITE_SITE_URL: https://hi-veblen.com
          VITE_API_BASE_URL: /api
          VITE_LINGXI_URL: https://lingxi.hi-veblen.com/

      - name: 验证门户生产制品
        run: |
          npx playwright install --with-deps chromium
          npx playwright test e2e/art-museum-experience.spec.ts --project=chromium
        env:
          VITE_LINGXI_URL: https://lingxi.hi-veblen.com/

      - name: 构建灵犀网页端
        working-directory: lingxi-source/ui/frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_APP_BASE: /
          VITE_PORTAL_URL: https://hi-veblen.com/

      - name: 组合不可变发布包
        run: |
          mkdir -p release-package/portal release-package/lingxi release-package/backend
          cp -a dist/. release-package/portal/
          cp -a lingxi-source/ui/frontend/dist/. release-package/lingxi/
          install -m 0755 scripts/prune-production-releases.sh \
            release-package/prune-production-releases.sh
          install -m 0755 scripts/prune-production-staging.sh \
            release-package/prune-production-staging.sh
          install -m 0755 scripts/validate_release_health.py \
            release-package/validate_release_health.py
          lingxi_sha="$(git -C lingxi-source rev-parse HEAD)"
          test "$lingxi_sha" = "$LINGXI_SHA"
          git -C lingxi-source archive --format=tar "$lingxi_sha" | tar -x -C release-package/backend
          printf '%s\n' "$GITHUB_SHA" > release-package/portal/release.txt
          printf '%s\n' "$lingxi_sha" > release-package/lingxi/release.txt
          printf '%s\n' "$lingxi_sha" > release-package/backend/release.txt
          release_env="$(printf 'BRAIN_RELEASE_SHA=%s\nLINGXI_PERSONA_SCHEMA_CAPABILITY=dual-read-v1' "$lingxi_sha")"
          printf '%s\n' "$release_env" > release-package/backend/.release.env
          printf 'portal=%s\nlingxi=%s\nbackend=%s\n' \
            "$GITHUB_SHA" "$lingxi_sha" "$lingxi_sha" > release-package/release.txt
          test -s release-package/portal/index.html
          test -s release-package/lingxi/index.html
          test -s release-package/backend/brain/workspace/world_server.py
          test -s release-package/backend/ui/backend/app.py
          test -s release-package/backend/scripts/install_linux_services.sh
          grep -Fq 'LINGXI_PERSONA_SCHEMA_CAPABILITY=dual-read-v1' \
            release-package/backend/scripts/install_linux_services.sh
          if test -e release-package/backend/ops/apparmor/myagent-persona-parser || \
            test -L release-package/backend/ops/apparmor/myagent-persona-parser; then
            test ! -L release-package/backend/ops/apparmor/myagent-persona-parser
            test -f release-package/backend/ops/apparmor/myagent-persona-parser
            test -s release-package/backend/ops/apparmor/myagent-persona-parser
          fi
          python3 scripts/validate_release_nginx.py \
            release-package/backend/ops/nginx/hi-veblen.com.http.conf
          test -x release-package/prune-production-releases.sh
          test -x release-package/prune-production-staging.sh
          test -x release-package/validate_release_health.py
          test "$(cat release-package/portal/release.txt)" = "$GITHUB_SHA"
          test "$(cat release-package/lingxi/release.txt)" = "$lingxi_sha"
          test "$(cat release-package/backend/release.txt)" = "$lingxi_sha"
          printf '%s\n' "$release_env" | cmp -s - release-package/backend/.release.env
          grep -R -q 'https://lingxi.hi-veblen.com/' release-package/portal/assets
          for site in portal lingxi; do
            assets="$(grep -oE '/assets/[^" ]+\.(js|css)' "release-package/$site/index.html" | sort -u)"
            test -n "$assets"
            for asset in $assets; do
              test -s "release-package/$site/${asset#/}"
            done
          done
          test -z "$(find release-package -type l -print -quit)"
          (
            cd release-package/backend
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > release-package/backend-files.sha256
          test -s release-package/backend-files.sha256
          tar -C release-package -czf portal-dist.tar.gz .
          sha256sum portal-dist.tar.gz > portal-dist.tar.gz.sha256

      - name: 保存发布制品
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-release-${{ github.sha }}
          path: |
            portal-dist.tar.gz
            portal-dist.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: 部署双站发布包
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
    permissions:
      contents: read

    steps:
      - name: 下载发布制品
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-release-${{ github.sha }}

      - name: 校验发布制品
        id: release
        run: |
          sha256sum --check portal-dist.tar.gz.sha256
          package_sha256="$(cut -d ' ' -f 1 portal-dist.tar.gz.sha256)"
          test "${#package_sha256}" -eq 64
          printf 'package_sha256=%s\n' "$package_sha256" >> "$GITHUB_OUTPUT"

      - name: 配置受信 SSH
        id: configure-ssh
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -eu
          case "$SERVER_HOST" in
            ''|*[!A-Za-z0-9.:-]*) echo "SERVER_HOST 格式无效" >&2; exit 1 ;;
          esac
          case "$SERVER_USER" in
            ''|*[!A-Za-z0-9._-]*) echo "SERVER_USER 格式无效" >&2; exit 1 ;;
          esac
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/hi-veblen-deploy"
          chmod 0600 "$HOME/.ssh/hi-veblen-deploy"
          printf '%s\n' \
            'hi-veblen-production ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM4IhOSWQcIioXavkJYcZ1WbE682kGvQF+rTAgnBRNif' \
            > "$HOME/.ssh/known_hosts"
          printf '%s\n' \
            'Host hi-veblen-production' \
            "  HostName $SERVER_HOST" \
            "  User $SERVER_USER" \
            '  HostKeyAlias hi-veblen-production' \
            '  IdentityFile ~/.ssh/hi-veblen-deploy' \
            '  IdentitiesOnly yes' \
            '  BatchMode yes' \
            '  StrictHostKeyChecking yes' \
            '  ConnectTimeout 10' \
            > "$HOME/.ssh/config"
          chmod 0600 "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"
          ssh hi-veblen-production true

      - name: 拒绝未纳管的 systemd 覆盖
        run: |
          ssh hi-veblen-production 'bash -se --' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'REMOTE'
          set -eu
          run_id="$1"
          run_attempt="$2"
          case "$run_id" in
            ''|*[!0-9]*) echo "GitHub run id 格式无效：$run_id" >&2; exit 1 ;;
          esac
          case "$run_attempt" in
            ''|*[!0-9]*) echo "GitHub run attempt 格式无效：$run_attempt" >&2; exit 1 ;;
          esac
          release_lock=/run/hi-veblen-release.lock
          lease_dir=/run/hi-veblen-release-lease
          lease_owner="$run_id-$run_attempt"
          command -v flock >/dev/null
          exec 9>"$release_lock"
          if ! flock -n 9; then
            echo "另一个服务器发布事务仍在运行，拒绝 preflight。" >&2
            exit 1
          fi
          maintenance_marker=/run/myagent-release-maintenance
          preserve_marker=/run/hi-veblen-release-preserve
          preserved_staging=""
          if test -d /opt/hi-veblen/staging; then
            preserved_staging="$(find /opt/hi-veblen/staging -mindepth 2 -maxdepth 2 \
              -name PRESERVE -print -quit)"
          fi
          if test -e "$maintenance_marker" || test -L "$maintenance_marker" || \
            test -e "$preserve_marker" || test -L "$preserve_marker" || \
            test -n "$preserved_staging"; then
            echo "检测到遗留发布保护现场，拒绝创建新发布。" >&2
            exit 1
          fi
          for unit in myagent-world.service myagent-gateway.service; do
            dropins="$(systemctl show "$unit" -p DropInPaths --value)"
            if test -n "$dropins"; then
              echo "检测到未纳管的 systemd drop-in，拒绝发布：$unit" >&2
              exit 1
            fi
          done
          if ! mkdir -m 0700 "$lease_dir"; then
            current_owner="$(cat "$lease_dir/owner" 2>/dev/null || true)"
            echo "服务器发布生命周期已被占用：${current_owner:-unknown}" >&2
            exit 1
          fi
          printf '%s\n' "$lease_owner" > "$lease_dir/owner"
          chmod 0600 "$lease_dir/owner"
          REMOTE

      - name: 创建私有暂存目录
        run: |
          ssh hi-veblen-production 'bash -se --' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'REMOTE'
          set -eu
          run_id="$1"
          run_attempt="$2"
          case "$run_id" in
            ''|*[!0-9]*) echo "GitHub run id 格式无效：$run_id" >&2; exit 1 ;;
          esac
          case "$run_attempt" in
            ''|*[!0-9]*) echo "GitHub run attempt 格式无效：$run_attempt" >&2; exit 1 ;;
          esac
          release_lock=/run/hi-veblen-release.lock
          lease_dir=/run/hi-veblen-release-lease
          lease_owner="$run_id-$run_attempt"
          command -v flock >/dev/null
          exec 9>"$release_lock"
          if ! flock -n 9; then
            echo "另一个服务器发布事务仍在运行，拒绝创建暂存目录。" >&2
            exit 1
          fi
          test "$(cat "$lease_dir/owner" 2>/dev/null || true)" = "$lease_owner"
          maintenance_marker=/run/myagent-release-maintenance
          preserve_marker=/run/hi-veblen-release-preserve
          preserved_staging=""
          if test -d /opt/hi-veblen/staging; then
            preserved_staging="$(find /opt/hi-veblen/staging -mindepth 2 -maxdepth 2 \
              -name PRESERVE -print -quit)"
          fi
          if test -e "$maintenance_marker" || test -L "$maintenance_marker" || \
            test -e "$preserve_marker" || test -L "$preserve_marker" || \
            test -n "$preserved_staging"; then
            echo "检测到发布保护现场，拒绝创建暂存目录。" >&2
            exit 1
          fi
          umask 077
          staging_root=/opt/hi-veblen/staging
          upload_dir="$staging_root/run-$run_id-$run_attempt"
          install -d -m 0700 "$staging_root"
          if test -e "$upload_dir"; then
            echo "发布暂存目录已存在，拒绝覆盖：$upload_dir" >&2
            exit 1
          fi
          mkdir -m 0700 "$upload_dir"
          install -m 0600 /dev/null "$upload_dir/PRESERVE"
          REMOTE

      - name: 上传发布包
        run: |
          scp -q portal-dist.tar.gz \
            hi-veblen-production:/opt/hi-veblen/staging/run-${{ github.run_id }}-${{ github.run_attempt }}/

      - name: 维护窗口内协调切换并验证
        env:
          EXPECTED_ARCHIVE_SHA: ${{ steps.release.outputs.package_sha256 }}
          PERSONA_GROWTH_CANARY_HASHES: ${{ vars.LINGXI_PERSONA_GROWTH_CANARY_HASHES }}
        run: |
          persona_growth_canary_arg="${PERSONA_GROWTH_CANARY_HASHES:--}"
          ssh hi-veblen-production 'bash -se --' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" \
            "$EXPECTED_ARCHIVE_SHA" "$EXPECTED_PERSONA_SCHEMA_PHASE" \
            "$EXPECTED_PERSONA_GROWTH_PHASE" \
            "$persona_growth_canary_arg" <<'REMOTE'
          set -eu

          release_lock=/run/hi-veblen-release.lock
          command -v flock >/dev/null
          exec 9>"$release_lock"
          if ! flock -n 9; then
            echo "另一个服务器发布事务仍在运行，拒绝进入主事务。" >&2
            exit 1
          fi

          run_id="$1"
          run_attempt="$2"
          portal_revision="$3"
          expected_archive_sha="$4"
          expected_persona_schema_phase="$5"
          expected_persona_growth_phase="$6"
          persona_growth_canary_hashes="$7"
          if test "$persona_growth_canary_hashes" = "-"; then
            persona_growth_canary_hashes=""
          fi
          case "$run_id" in
            ''|*[!0-9]*) echo "GitHub run id 格式无效：$run_id" >&2; exit 1 ;;
          esac
          case "$run_attempt" in
            ''|*[!0-9]*) echo "GitHub run attempt 格式无效：$run_attempt" >&2; exit 1 ;;
          esac
          case "$expected_persona_schema_phase" in
            compat|active) ;;
            *) echo "Persona schema phase 无效：$expected_persona_schema_phase" >&2; exit 1 ;;
          esac
          case "$expected_persona_growth_phase" in
            compat|shadow|canary|active) ;;
            *) echo "Persona growth phase 无效：$expected_persona_growth_phase" >&2; exit 1 ;;
          esac
          if test -n "$persona_growth_canary_hashes" && \
            ! printf '%s' "$persona_growth_canary_hashes" | \
              grep -Eq '^[0-9a-f]{64}(,[0-9a-f]{64})*$'; then
            echo "Persona growth canary 摘要格式无效。" >&2
            exit 1
          fi
          upload_dir="/opt/hi-veblen/staging/run-$run_id-$run_attempt"
          archive="$upload_dir/portal-dist.tar.gz"
          release_root="/opt/hi-veblen/releases"
          release="$release_root/release-$portal_revision-$run_id-$run_attempt"
          project_root="/opt/myagent"
          portal_current="/opt/hi-veblen/portal-current"
          lingxi_current="/opt/hi-veblen/lingxi-current"
          backend_current="$project_root/backend-current"
          maintenance_marker=/run/myagent-release-maintenance
          preserve_marker=/run/hi-veblen-release-preserve
          lease_dir=/run/hi-veblen-release-lease
          lease_owner="$run_id-$run_attempt"
          apparmor_profile_name=myagent-persona-parser
          apparmor_profile_path="/etc/apparmor.d/$apparmor_profile_name"
          userns_restriction=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          legacy_apparmor_sha=55255df61ae6aef89ce5d8e4d46ba637ca3cd632

          if test "$(cat "$lease_dir/owner" 2>/dev/null || true)" != "$lease_owner"; then
            echo "发布生命周期租约不属于本次运行，拒绝进入主事务。" >&2
            exit 1
          fi
          test -f "$upload_dir/PRESERVE"
          test ! -L "$upload_dir/PRESERVE"

          assert_no_global_protection() {
            if test -e "$maintenance_marker" || test -L "$maintenance_marker" || \
              test -e "$preserve_marker" || test -L "$preserve_marker"; then
              echo "检测到全局发布保护标记，拒绝回收发布现场。" >&2
              return 1
            fi
          }

          case "$expected_archive_sha" in
            ''|*[!0-9a-f]*) echo "发布包摘要格式无效" >&2; exit 1 ;;
          esac
          test "${#expected_archive_sha}" -eq 64
          test "$(sha256sum "$archive" | cut -d ' ' -f 1)" = "$expected_archive_sha"
          python3 - "$archive" <<'PY'
          import sys
          import tarfile
          from pathlib import PurePosixPath

          with tarfile.open(sys.argv[1], "r:gz") as archive_file:
              for member in archive_file.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"不安全的归档路径：{member.name}")
                  if not (member.isfile() or member.isdir()):
                      raise SystemExit(f"不允许的归档成员类型：{member.name}")
          PY

          preserved_staging=""
          if test -d /opt/hi-veblen/staging; then
            preserved_staging="$(find /opt/hi-veblen/staging -mindepth 2 -maxdepth 2 \
              -name PRESERVE ! -path "$upload_dir/PRESERVE" -print -quit)"
          fi
          if test -e "$maintenance_marker" || test -L "$maintenance_marker" || \
            test -e "$preserve_marker" || test -L "$preserve_marker" || \
            test -n "$preserved_staging"; then
            echo "检测到遗留发布保护现场，拒绝创建或回收 release。" >&2
            exit 1
          fi
          mkdir -p "$release_root"
          mkdir "$release"
          tar --no-same-owner --no-same-permissions -xzf "$archive" -C "$release"
          chown -R root:root "$release"
          chmod -R go-w "$release"
          test -s "$release/portal/index.html"
          test -s "$release/lingxi/index.html"
          test -s "$release/release.txt"

          expected_portal="$(sed -n 's/^portal=//p' "$release/release.txt")"
          expected_lingxi="$(sed -n 's/^lingxi=//p' "$release/release.txt")"
          expected_backend="$(sed -n 's/^backend=//p' "$release/release.txt")"
          test -n "$expected_portal"
          test -n "$expected_lingxi"
          test "$expected_backend" = "$expected_lingxi"
          test "$(cat "$release/portal/release.txt")" = "$expected_portal"
          test "$(cat "$release/lingxi/release.txt")" = "$expected_lingxi"
          test "$(cat "$release/backend/release.txt")" = "$expected_backend"
          expected_release_env="$(printf 'BRAIN_RELEASE_SHA=%s\nLINGXI_PERSONA_SCHEMA_CAPABILITY=dual-read-v1' "$expected_backend")"
          printf '%s\n' "$expected_release_env" | cmp -s - "$release/backend/.release.env"
          test -s "$release/backend-files.sha256"
          (
            cd "$release/backend"
            sha256sum --check "$release/backend-files.sha256"
          )

          for required in requirements-ci.txt brain/workspace/world_server.py ui/backend/app.py \
            scripts/install_linux_services.sh ops/systemd/myagent-world.service \
            ops/systemd/myagent-gateway.service ops/nginx/hi-veblen.com.http.conf; do
            test -s "$release/backend/$required"
          done
          apparmor_profile_source="$release/backend/ops/apparmor/$apparmor_profile_name"
          apparmor_profile_mode=legacy
          if test -e "$apparmor_profile_source" || test -L "$apparmor_profile_source"; then
            if test -L "$apparmor_profile_source" || \
              ! test -f "$apparmor_profile_source" || ! test -s "$apparmor_profile_source"; then
              echo "候选 AppArmor profile 必须是非空普通文件。" >&2
              exit 1
            fi
            apparmor_profile_mode=managed
          elif test "$expected_backend" != "$legacy_apparmor_sha"; then
            echo "候选后端缺少受管 AppArmor profile，拒绝发布。" >&2
            exit 1
          fi
          command -v apparmor_parser >/dev/null
          test -r /sys/kernel/security/apparmor/profiles
          test -r "$userns_restriction"
          test "$(cat "$userns_restriction")" = "1"
          if test "$apparmor_profile_mode" = "managed"; then
            command -v setpriv >/dev/null
            test -x /usr/bin/aa-exec
            apparmor_parser --skip-kernel-load --skip-cache --base /etc/apparmor.d \
              "$apparmor_profile_source"
          fi
          if test -L "$apparmor_profile_path"; then
            echo "AppArmor profile 不能是符号链接。" >&2
            exit 1
          fi
          if test -e "$apparmor_profile_path" && ! test -f "$apparmor_profile_path"; then
            echo "AppArmor profile 必须是普通文件。" >&2
            exit 1
          fi
          previous_apparmor_present=0
          if test -e "$apparmor_profile_path"; then
            previous_apparmor_present=1
            test "$(stat -c '%U:%G:%a' "$apparmor_profile_path")" = "root:root:644"
          fi
          previous_apparmor_loaded=0
          if grep -Fq "$apparmor_profile_name (" /sys/kernel/security/apparmor/profiles; then
            if ! grep -Fxq "$apparmor_profile_name (enforce)" \
              /sys/kernel/security/apparmor/profiles; then
              echo "AppArmor profile 未处于 enforce 模式，拒绝发布。" >&2
              exit 1
            fi
            previous_apparmor_loaded=1
          fi
          if test "$previous_apparmor_present" -ne "$previous_apparmor_loaded"; then
            echo "AppArmor profile 文件与内核加载状态不一致，拒绝发布。" >&2
            exit 1
          fi
          test -d "$project_root/data"
          test ! -e "$release/backend/data"
          ln -s "$project_root/data" "$release/backend/data"
          if test -d "$project_root/snapshots"; then
            test ! -e "$release/backend/snapshots"
            ln -s "$project_root/snapshots" "$release/backend/snapshots"
          fi

          certificate=/etc/letsencrypt/live/hi-veblen.com/fullchain.pem
          test -s "$certificate"
          openssl x509 -in "$certificate" -noout -checkend 0 >/dev/null
          certificate_host_check="$(
            openssl x509 -in "$certificate" -noout -checkhost lingxi.hi-veblen.com 2>&1
          )"
          printf '%s\n' "$certificate_host_check" | \
            grep -Fqx 'Hostname lingxi.hi-veblen.com does match certificate'

          for current in "$portal_current" "$lingxi_current" "$backend_current"; do
            if { test -e "$current" || test -L "$current"; } && ! test -L "$current"; then
              echo "current 路径不是符号链接，拒绝覆盖：$current" >&2
              exit 1
            fi
          done

          for current in "$portal_current" "$lingxi_current" "$backend_current"; do
            if ! test -L "$current" || ! test -d "$current"; then
              echo "current 指针缺失或目标无效，拒绝自动复制运行目录：$current" >&2
              exit 1
            fi
          done

          previous_portal="$(readlink -f "$portal_current")"
          previous_lingxi="$(readlink -f "$lingxi_current")"
          previous_backend="$(readlink -f "$backend_current")"
          previous_backend_revision="$(cat "$previous_backend/release.txt" 2>/dev/null || true)"
          if [[ ! "$previous_backend_revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "旧后端 release revision 不是完整提交 SHA，拒绝进入可变更阶段。" >&2
            exit 1
          fi
          previous_backend_rollback_floor=0
          previous_release_env="$(printf 'BRAIN_RELEASE_SHA=%s\nLINGXI_PERSONA_SCHEMA_CAPABILITY=dual-read-v1' "$previous_backend_revision")"
          if test -f "$previous_backend/.release.env" && \
            ! test -L "$previous_backend/.release.env" && \
            printf '%s\n' "$previous_release_env" | \
              cmp -s - "$previous_backend/.release.env"; then
            previous_backend_rollback_floor=1
          fi

          bash "$release/prune-production-staging.sh" \
            /opt/hi-veblen/staging "$upload_dir"
          bash "$release/prune-production-releases.sh" \
            "$release_root" 5 "$release" \
            "$(dirname -- "$previous_portal")" \
            "$(dirname -- "$previous_lingxi")" \
            "$(dirname -- "$previous_backend")"

          release_venv="$release/backend/.venv"
          release_python="$release_venv/bin/python"
          test ! -e "$release_venv"
          test -x /usr/bin/python3
          test "$(/usr/bin/python3 -c \
            'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" = "3.12"
          umask 022
          /usr/bin/python3 -m venv "$release_venv"
          "$release_python" -m pip install --disable-pip-version-check --no-input \
            --no-cache-dir -r "$release/backend/requirements-ci.txt"
          "$release_python" -m pip check
          "$release_python" -m pip install --disable-pip-version-check --no-input \
            --dry-run --no-index --no-deps -r "$release/backend/requirements-ci.txt"
          test "$("$release_python" -c \
            'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" = "3.12"
          "$release_python" -c \
            'import pathlib,sys; raise SystemExit(pathlib.Path(sys.prefix).resolve() != pathlib.Path(sys.argv[1]).resolve())' \
            "$release_venv"
          chown -R root:root "$release_venv"
          chmod -R go-w "$release_venv"
          test -z "$(find "$release_venv" ! -type l -perm /022 -print -quit)"
          umask 077

          rollback_root="$upload_dir/rollback"
          mkdir -m 0700 "$rollback_root"
          mkdir "$rollback_root/apparmor" "$rollback_root/systemd" \
            "$rollback_root/nginx-available" "$rollback_root/nginx-enabled"
          if test "$previous_apparmor_present" -eq 1; then
            cp -a "$apparmor_profile_path" "$rollback_root/apparmor/"
          fi
          for unit in myagent-world.service myagent-gateway.service; do
            if test -e "/etc/systemd/system/$unit"; then
              cp -a "/etc/systemd/system/$unit" "$rollback_root/systemd/"
            fi
          done
          for name in hi-veblen.com.conf lingxi.hi-veblen.com.conf; do
            if test -e "/etc/nginx/sites-available/$name" || test -L "/etc/nginx/sites-available/$name"; then
              cp -a "/etc/nginx/sites-available/$name" "$rollback_root/nginx-available/"
            fi
            if test -e "/etc/nginx/sites-enabled/$name" || test -L "/etc/nginx/sites-enabled/$name"; then
              cp -a "/etc/nginx/sites-enabled/$name" "$rollback_root/nginx-enabled/"
            fi
          done

          restore_link() {
            target="$1"
            destination="$2"
            ln -sfn "$target" "${destination}.rollback"
            mv -Tf "${destination}.rollback" "$destination"
          }

          restore_file() {
            target="$1"
            backup="$2"
            rm -f "$target"
            if test -e "$backup" || test -L "$backup"; then
              cp -a "$backup" "$target"
            fi
          }

          apparmor_profile_is_present() {
            grep -Fq "$apparmor_profile_name (" /sys/kernel/security/apparmor/profiles
          }

          apparmor_profile_is_enforced() {
            grep -Fxq "$apparmor_profile_name (enforce)" \
              /sys/kernel/security/apparmor/profiles
          }

          remove_apparmor_profile() {
            if apparmor_profile_is_present; then
              removal_source="$apparmor_profile_path"
              if ! test -s "$removal_source"; then
                removal_source="$rollback_root/apparmor/$apparmor_profile_name"
              fi
              if ! test -s "$removal_source"; then
                removal_source="$apparmor_profile_source"
              fi
              test -s "$removal_source" || return 1
              apparmor_parser --remove --base /etc/apparmor.d \
                "$removal_source" || return 1
            fi
            rm -f "$apparmor_profile_path" || return 1
            if test -e "$apparmor_profile_path" || test -L "$apparmor_profile_path"; then
              return 1
            fi
            ! apparmor_profile_is_present
          }

          restore_apparmor_profile() {
            if test "$previous_apparmor_present" -eq 0; then
              remove_apparmor_profile
              return
            fi

            restore_file "$apparmor_profile_path" \
              "$rollback_root/apparmor/$apparmor_profile_name" || return 1
            apparmor_parser --replace --skip-cache --base /etc/apparmor.d \
              "$apparmor_profile_path" || return 1
            test "$(stat -c '%U:%G:%a' "$apparmor_profile_path")" = "root:root:644" || return 1
            apparmor_profile_is_enforced
          }

          verify_apparmor_profile_state() {
            test "$(cat "$userns_restriction")" = "1" || return 1
            if test "$apparmor_profile_mode" = "managed"; then
              cmp -s "$apparmor_profile_source" "$apparmor_profile_path" || return 1
              test "$(stat -c '%U:%G:%a' "$apparmor_profile_path")" = "root:root:644" || return 1
              apparmor_profile_is_enforced
              return
            fi

            if test -e "$apparmor_profile_path" || test -L "$apparmor_profile_path"; then
              return 1
            fi
            ! apparmor_profile_is_present
          }

          restore_nginx_backup() {
            for name in hi-veblen.com.conf lingxi.hi-veblen.com.conf; do
              restore_file "/etc/nginx/sites-available/$name" \
                "$rollback_root/nginx-available/$name" || return 1
              restore_file "/etc/nginx/sites-enabled/$name" \
                "$rollback_root/nginx-enabled/$name" || return 1
            done
          }

          activate_maintenance() {
            marker_tmp="${maintenance_marker}.new.$$"
            rm -f "$marker_tmp"
            if ! install -m 0644 /dev/null "$marker_tmp"; then
              rm -f "$marker_tmp"
              return 1
            fi
            if ! mv -Tf "$marker_tmp" "$maintenance_marker"; then
              rm -f "$marker_tmp"
              return 1
            fi
          }

          previous_backend_healthy() {
            rollback_deadline=$((SECONDS + 300))
            while (( SECONDS < rollback_deadline )); do
              rollback_curl_timeout=$((rollback_deadline - SECONDS))
              if (( rollback_curl_timeout > 5 )); then
                rollback_curl_timeout=5
              fi
              if (( rollback_curl_timeout < 1 )); then
                break
              fi
              if rollback_health="$(curl --connect-timeout 2 \
                --max-time "$rollback_curl_timeout" \
                --fail --silent --show-error http://127.0.0.1:8000/api/health 2>/dev/null)" && \
                printf '%s' "$rollback_health" | python3 \
                  "$release/validate_release_health.py" rollback \
                  "$previous_backend_revision"; then
                return 0
              fi
              if (( SECONDS < rollback_deadline )); then
                sleep 1
              fi
            done
            return 1
          }

          nginx_has_maintenance_guards() {
            guard='if (-f /run/myagent-release-maintenance) { return 503; }'
            active_nginx="$(nginx -T 2>&1)" || return 1
            guard_count="$(printf '%s\n' "$active_nginx" | grep -Fc "$guard" || true)"
            test "$guard_count" -ge 3
          }

          backup_nginx_has_maintenance_guards() {
            guard='if (-f /run/myagent-release-maintenance) { return 503; }'
            backup_primary="$rollback_root/nginx-available/hi-veblen.com.conf"
            test -f "$backup_primary" || return 1
            guard_count="$(grep -Fc "$guard" "$backup_primary" || true)"
            test "$guard_count" -ge 3
          }

          maintenance_public_blocked() {
            invalid_status="$(curl --connect-timeout 10 --max-time 30 \
              --silent --output /dev/null --write-out '%{http_code}' \
              --request POST --header 'Content-Type: application/json' \
              --data '{"token":"release-preflight-invalid"}' \
              https://lingxi.hi-veblen.com/api/session)"
            default_status="$(curl --connect-timeout 10 --max-time 30 \
              --silent --output /dev/null --write-out '%{http_code}' \
              --request POST --header 'Content-Type: application/json' \
              --data '{"token":"local-dev-token"}' \
              https://lingxi.hi-veblen.com/api/session)"
            ws_status="$(curl --connect-timeout 10 --max-time 30 \
              --silent --output /dev/null --write-out '%{http_code}' \
              https://lingxi.hi-veblen.com/ws/release-maintenance-probe)"
            test "$invalid_status" = "503"
            test "$default_status" = "503"
            test "$ws_status" = "503"
          }

          stop_services_for_manual_recovery() {
            systemctl stop myagent-gateway.service myagent-world.service || true
            ! systemctl is-active --quiet myagent-gateway.service && \
              ! systemctl is-active --quiet myagent-world.service
          }

          switched=0
          services_stopped=0
          maintenance_active=0
          nginx_mutated=0
          apparmor_mutated=0
          rollback() {
            status=$?
            trap - EXIT
            if test "$status" -ne 0 && test "$nginx_mutated" -eq 1 && \
              test "$switched" -eq 0 && test "$services_stopped" -eq 0 && \
              test "$maintenance_active" -eq 0; then
              set +e
              nginx_restore_safe=1
              restore_nginx_backup || nginx_restore_safe=0
              if test "$nginx_restore_safe" -eq 1; then
                nginx -t || nginx_restore_safe=0
              fi
              if test "$nginx_restore_safe" -eq 1; then
                systemctl reload nginx || nginx_restore_safe=0
              fi
              if test "$nginx_restore_safe" -ne 1; then
                preserve_tmp="${preserve_marker}.new.$$"
                if ! install -m 0600 /dev/null "$preserve_tmp" || \
                  ! mv -Tf "$preserve_tmp" "$preserve_marker"; then
                  rm -f "$preserve_tmp"
                fi
                echo "Nginx 前置变更恢复失败；服务仍保持原运行态，请立即人工核验活动配置。" >&2
              else
                rm -f "$upload_dir/PRESERVE" || true
              fi
              exit "$status"
            fi
            if test "$status" -ne 0 && \
              { test "$switched" -eq 1 || test "$services_stopped" -eq 1 || \
                test "$maintenance_active" -eq 1; }; then
              set +e
              if ! activate_maintenance; then
                echo "无法重建发布维护标记，停止服务并保留现场供人工恢复。" >&2
                if ! stop_services_for_manual_recovery; then
                  echo "无法确认 world/gateway 已停止，必须立即人工隔离流量。" >&2
                fi
                exit "$status"
              fi
              maintenance_active=1
              rollback_safe=1
              systemctl stop myagent-gateway.service myagent-world.service || rollback_safe=0
              if systemctl is-active --quiet myagent-gateway.service || \
                systemctl is-active --quiet myagent-world.service; then
                rollback_safe=0
              fi
              services_stopped=1
              if test "$previous_backend_rollback_floor" -ne 1; then
                echo "旧后端不满足 dual-read-v1 回滚下限；保留维护态、PRESERVE 与停止服务现场。" >&2
                if ! stop_services_for_manual_recovery; then
                  echo "无法确认 world/gateway 已停止，必须立即人工隔离流量。" >&2
                fi
                exit "$status"
              fi
              if test "$switched" -eq 1; then
                restore_link "$previous_portal" "$portal_current" || rollback_safe=0
                restore_link "$previous_lingxi" "$lingxi_current" || rollback_safe=0
                restore_link "$previous_backend" "$backend_current" || rollback_safe=0
                for unit in myagent-world.service myagent-gateway.service; do
                  restore_file "/etc/systemd/system/$unit" "$rollback_root/systemd/$unit" || rollback_safe=0
                done
              fi
              if test "$rollback_safe" -eq 1 && test "$apparmor_mutated" -eq 1; then
                restore_apparmor_profile || rollback_safe=0
              fi
              if test "$rollback_safe" -eq 1 && \
                test "$(cat "$userns_restriction")" != "1"; then
                rollback_safe=0
              fi
              if test "$rollback_safe" -eq 1 && ! nginx_has_maintenance_guards; then
                rollback_safe=0
              fi
              if test "$rollback_safe" -eq 1 && \
                { test "$switched" -eq 1 || test "$services_stopped" -eq 1; }; then
                systemctl daemon-reload || rollback_safe=0
                systemctl restart myagent-world.service myagent-gateway.service || rollback_safe=0
              fi
              if test "$rollback_safe" -eq 1; then
                systemctl is-active --quiet myagent-world.service || rollback_safe=0
                systemctl is-active --quiet myagent-gateway.service || rollback_safe=0
              fi
              if test "$rollback_safe" -eq 1 && ! previous_backend_healthy; then
                rollback_safe=0
              fi
              if test "$rollback_safe" -eq 1 && test "$switched" -eq 1; then
                if backup_nginx_has_maintenance_guards; then
                  restore_nginx_backup || rollback_safe=0
                else
                  echo "旧 Nginx 配置不识别维护标记，保留当前 503 加固配置。" >&2
                fi
              fi
              if test "$rollback_safe" -eq 1; then
                nginx -t || rollback_safe=0
              fi
              if test "$rollback_safe" -eq 1 && ! nginx_has_maintenance_guards; then
                rollback_safe=0
              fi
              if test "$rollback_safe" -eq 1; then
                systemctl reload nginx || rollback_safe=0
              fi
              if test "$rollback_safe" -eq 1 && ! nginx_has_maintenance_guards; then
                rollback_safe=0
              fi
              if test "$rollback_safe" -eq 1 && ! maintenance_public_blocked; then
                rollback_safe=0
              fi
              if test "$rollback_safe" -eq 1; then
                systemctl is-active --quiet myagent-world.service || rollback_safe=0
                systemctl is-active --quiet myagent-gateway.service || rollback_safe=0
              fi
              if test "$rollback_safe" -eq 1 && ! previous_backend_healthy; then
                rollback_safe=0
              fi
              if test "$rollback_safe" -eq 1 && ! maintenance_public_blocked; then
                rollback_safe=0
              fi
              if test "$rollback_safe" -eq 1; then
                rm -f "$upload_dir/PRESERVE" || rollback_safe=0
              fi
              if test "$rollback_safe" -eq 1; then
                rm -f "$maintenance_marker" || rollback_safe=0
              fi
              if test "$rollback_safe" -ne 1; then
                echo "自动回滚未通过旧服务、Nginx 与 revision 健康门；维护标记保留，请人工恢复。" >&2
                if ! stop_services_for_manual_recovery; then
                  echo "无法确认 world/gateway 已停止，必须立即人工隔离流量。" >&2
                fi
              fi
            fi
            exit "$status"
          }
          if ! previous_backend_healthy; then
            echo "旧后端未通过 revision、连续性与心跳回滚下限，拒绝进入可变更阶段。" >&2
            exit 1
          fi
          trap rollback EXIT

          primary_conf=/etc/nginx/sites-available/hi-veblen.com.conf
          primary_enabled=/etc/nginx/sites-enabled/hi-veblen.com.conf
          bootstrap_enabled=/etc/nginx/sites-enabled/lingxi.hi-veblen.com.conf
          test -d /etc/nginx/sites-available
          test -d /etc/nginx/sites-enabled
          test -f "$upload_dir/PRESERVE"
          test ! -L "$upload_dir/PRESERVE"
          nginx_mutated=1
          install -m 0644 "$release/backend/ops/nginx/hi-veblen.com.http.conf" "$primary_conf"
          ln -sfn "$primary_conf" "$primary_enabled"
          rm -f "$bootstrap_enabled"
          nginx -t
          nginx_has_maintenance_guards
          systemctl reload nginx
          nginx_has_maintenance_guards

          activate_maintenance
          maintenance_active=1
          maintenance_public_blocked

          services_stopped=1
          systemctl stop myagent-gateway.service myagent-world.service
          ! systemctl is-active --quiet myagent-gateway.service
          ! systemctl is-active --quiet myagent-world.service

          if test "$apparmor_profile_mode" = "legacy"; then
            apparmor_mutated=1
            remove_apparmor_profile
          fi

          switched=1
          restore_link "$release/portal" "$portal_current"
          restore_link "$release/lingxi" "$lingxi_current"
          restore_link "$release/backend" "$backend_current"

          if test "$apparmor_profile_mode" = "managed"; then
            apparmor_mutated=1
          fi
          RELEASE_TRANSACTION=1 REVISION="$expected_backend" PROJECT_DIR="$project_root" \
            BACKEND_DIR="$release/backend" \
            LINGXI_PERSONA_SCHEMA_PHASE="$expected_persona_schema_phase" \
            LINGXI_PERSONA_GROWTH_PHASE="$expected_persona_growth_phase" \
            LINGXI_PERSONA_GROWTH_CANARY_HASHES="$persona_growth_canary_hashes" \
            bash "$release/backend/scripts/install_linux_services.sh"
          services_stopped=0
          systemctl is-active --quiet myagent-world.service
          systemctl is-active --quiet myagent-gateway.service
          test -z "$(systemctl show myagent-world.service -p DropInPaths --value)"
          test -z "$(systemctl show myagent-gateway.service -p DropInPaths --value)"
          verify_apparmor_profile_state

          nginx_dump="$(nginx -T 2>&1)"
          for expected in \
            'root /opt/hi-veblen/portal-current;' \
            'root /opt/hi-veblen/lingxi-current;' \
            'proxy_pass http://127.0.0.1:3001;' \
            'proxy_pass http://127.0.0.1:8000;'; do
            printf '%s' "$nginx_dump" | grep -Fq "$expected"
          done
          test "$(printf '%s' "$nginx_dump" | grep -Fc 'location ^~ /assets/')" -ge 2
          test "$(printf '%s' "$nginx_dump" | grep -Fc 'location = /release.txt')" -ge 2

          maintenance_public_blocked

          verify_site_assets() {
            site_url="$1"
            site_html="$2"
            site_root="$3"
            missing_id="$4"
            site_assets="$(printf '%s' "$site_html" | grep -oE '/assets/[^" ]+\.(js|css)' | sort -u)"
            test -n "$site_assets"
            for asset in $site_assets; do
              test -s "$site_root/${asset#/}"
              headers="$(curl --connect-timeout 10 --max-time 30 \
                --fail --silent --show-error --head "$site_url$asset")"
              case "$asset" in
                *.js) printf '%s' "$headers" | grep -qiE '^content-type: *(application|text)/(javascript|x-javascript)' ;;
                *.css) printf '%s' "$headers" | grep -qiE '^content-type: *text/css' ;;
              esac
            done
            missing_status="$(curl --connect-timeout 10 --max-time 30 \
              --silent --output /dev/null --write-out '%{http_code}' \
              "$site_url/assets/release-missing-$missing_id.js")"
            test "$missing_status" = "404"
          }

          verify_security_headers() {
            site_url="$1"
            require_lingxi_csp="$2"
            response_headers="$(curl --connect-timeout 10 --max-time 30 \
              --fail --silent --show-error --head "$site_url/")"
            clean_headers="$(printf '%s\n' "$response_headers" | tr -d '\r')"
            lower_headers="$(printf '%s\n' "$clean_headers" | tr '[:upper:]' '[:lower:]')"
            x_frame_options="$(printf '%s\n' "$lower_headers" | sed -n \
              's/^x-frame-options:[[:space:]]*//p')"
            test -n "$x_frame_options"
            test -z "$(printf '%s\n' "$x_frame_options" | grep -vx 'deny')"

            server_header="$(printf '%s\n' "$lower_headers" | sed -n \
              's/^server:[[:space:]]*//p')"
            if printf '%s\n' "$server_header" | grep -Eq '[0-9]+([.][0-9]+)+'; then
              echo "Server 响应头泄露版本：$site_url" >&2
              return 1
            fi

            if test "$require_lingxi_csp" = "1"; then
              content_security_policy="$(printf '%s\n' "$lower_headers" | sed -n \
                's/^content-security-policy:[[:space:]]*//p')"
              printf '%s\n' "$content_security_policy" | grep -Eq \
                "(^|;)[[:space:]]*frame-ancestors[[:space:]]+'none'([[:space:]]*;|[[:space:]]*$)"
              printf '%s\n' "$content_security_policy" | grep -Eq \
                "(^|;)[[:space:]]*script-src[[:space:]]+'self'([[:space:]]|;|$)"
            fi
          }

          portal_html="$(curl --connect-timeout 10 --max-time 30 \
            --fail --silent --show-error https://hi-veblen.com/)"
          printf '%s' "$portal_html" | grep -q 'id="app"'
          grep -R -q 'https://lingxi.hi-veblen.com/' "$release/portal/assets"
          verify_site_assets "https://hi-veblen.com" "$portal_html" "$release/portal" "$expected_portal"
          verify_security_headers "https://hi-veblen.com" 0

          lingxi_html="$(curl --connect-timeout 10 --max-time 30 \
            --fail --silent --show-error https://lingxi.hi-veblen.com/)"
          printf '%s' "$lingxi_html" | grep -q 'id="root"'
          verify_site_assets "https://lingxi.hi-veblen.com" "$lingxi_html" "$release/lingxi" "$expected_lingxi"
          verify_security_headers "https://lingxi.hi-veblen.com" 1

          test "$(curl --connect-timeout 10 --max-time 30 --fail --silent --show-error \
            https://hi-veblen.com/release.txt)" = "$expected_portal"
          test "$(curl --connect-timeout 10 --max-time 30 --fail --silent --show-error \
            https://lingxi.hi-veblen.com/release.txt)" = "$expected_lingxi"

          portal_health="$(curl --connect-timeout 10 --max-time 30 \
            --fail --silent --show-error https://hi-veblen.com/api/health)"
          printf '%s' "$portal_health" | python3 -c '
          import json, sys
          assert json.load(sys.stdin).get("status") == "ok"
          '

          portal_auth_probe="$(curl --connect-timeout 10 --max-time 30 \
            --silent --show-error --write-out '\n%{http_code}' \
            --header 'Authorization: Bearer nginx-forwarding-probe' \
            https://hi-veblen.com/api/auth/profile)"
          printf '%s' "$portal_auth_probe" | python3 -c '
          import json, sys
          body, separator, status = sys.stdin.read().rpartition("\n")
          assert separator and status == "401"
          data = json.loads(body)
          assert data.get("code") == 401
          assert (data.get("details") or {}).get("reason") == "token_malformed"
          '

          invalid_status="$(curl --connect-timeout 10 --max-time 30 \
            --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' \
            --data '{"token":"release-preflight-invalid"}' \
            http://127.0.0.1:8000/api/session)"
          default_status="$(curl --connect-timeout 10 --max-time 30 \
            --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' \
            --data '{"token":"local-dev-token"}' \
            http://127.0.0.1:8000/api/session)"
          test "$invalid_status" = "401"
          test "$default_status" = "401"

          api_health="$(curl --connect-timeout 10 --max-time 30 \
            --fail --silent --show-error http://127.0.0.1:8000/api/health)"
          printf '%s' "$api_health" | python3 \
            "$release/validate_release_health.py" current "$expected_lingxi" \
            "$expected_persona_schema_phase" "$expected_persona_growth_phase"

          verify_apparmor_profile_state
          rm -f "$upload_dir/PRESERVE"
          install -m 0600 /dev/null "$upload_dir/DEPLOYED"
          rm -f "$maintenance_marker"
          maintenance_active=0
          switched=0
          trap - EXIT
          REMOTE

      - name: 清理本次远端暂存与未引用发布
        if: ${{ always() && steps.configure-ssh.outcome == 'success' }}
        run: |
          ssh hi-veblen-production 'bash -se --' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          release_lock=/run/hi-veblen-release.lock
          command -v flock >/dev/null
          exec 9>"$release_lock"
          if ! flock -n 9; then
            echo "另一个服务器发布事务仍在运行，保留本次清理现场。" >&2
            exit 1
          fi
          run_id="$1"
          run_attempt="$2"
          portal_revision="$3"
          case "$run_id" in
            ''|*[!0-9]*) echo "GitHub run id 格式无效：$run_id" >&2; exit 1 ;;
          esac
          case "$run_attempt" in
            ''|*[!0-9]*) echo "GitHub run attempt 格式无效：$run_attempt" >&2; exit 1 ;;
          esac
          lease_dir=/run/hi-veblen-release-lease
          lease_owner="$run_id-$run_attempt"
          current_owner="$(cat "$lease_dir/owner" 2>/dev/null || true)"
          if test "$current_owner" != "$lease_owner"; then
            echo "本次运行不持有发布生命周期租约，跳过远端清理。"
            exit 0
          fi
          maintenance_marker=/run/myagent-release-maintenance
          preserve_marker=/run/hi-veblen-release-preserve
          upload_dir="/opt/hi-veblen/staging/run-$run_id-$run_attempt"
          assert_no_global_protection() {
            if test -e "$maintenance_marker" || test -L "$maintenance_marker" || \
              test -e "$preserve_marker" || test -L "$preserve_marker"; then
              echo "发布保护标记仍存在，拒绝删除本次清理现场。" >&2
              return 1
            fi
          }
          if test -e "$maintenance_marker" || test -L "$maintenance_marker" || \
            test -e "$preserve_marker" || test -L "$preserve_marker"; then
            echo "发布保护标记仍存在，保留本次 release 与回滚现场。"
            exit 0
          fi

          deployed=0
          if test -L "$upload_dir/DEPLOYED"; then
            echo "DEPLOYED 标记不能是符号链接。" >&2
            exit 1
          fi
          if test -f "$upload_dir/DEPLOYED"; then
            deployed=1
          fi
          rm -f "$upload_dir/PRESERVE"
          assert_no_global_protection

          release="/opt/hi-veblen/releases/release-$portal_revision-$run_id-$run_attempt"
          referenced=0
          for current in \
            /opt/hi-veblen/portal-current \
            /opt/hi-veblen/lingxi-current \
            /opt/myagent/backend-current; do
            if test -L "$current"; then
              target="$(readlink -f -- "$current" 2>/dev/null || true)"
              if test -n "$target" && test "$(dirname -- "$target")" = "$release"; then
                referenced=1
              fi
            fi
          done

          if test -d "$release" && test "$referenced" -eq 0 && test "$deployed" -eq 0; then
            assert_no_global_protection
            case "$release" in
              /opt/hi-veblen/releases/release-[0-9a-f]*-[0-9]*-[0-9]*)
                rm -rf --one-file-system -- "$release"
                ;;
              *) echo "拒绝清理异常发布路径：$release" >&2; exit 1 ;;
            esac
          fi
          assert_no_global_protection
          case "$upload_dir" in
            /opt/hi-veblen/staging/run-[0-9]*-[0-9]*) rm -rf -- "$upload_dir" ;;
            *) echo "拒绝清理异常暂存路径：$upload_dir" >&2; exit 1 ;;
          esac
          assert_no_global_protection
          test "$(cat "$lease_dir/owner" 2>/dev/null || true)" = "$lease_owner"
          rm -f "$lease_dir/owner"
          rmdir "$lease_dir"
          REMOTE
