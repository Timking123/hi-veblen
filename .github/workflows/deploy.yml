name: 发布门户与灵犀网页端

on:
  workflow_dispatch:

concurrency:
  group: hi-veblen-production
  cancel-in-progress: false

env:
  LINGXI_SHA: 1fef3c2bd434a5d6bee36d7a14752998bf490bce
  EXPECTED_PERSONA_SCHEMA_PHASE: active
  EXPECTED_PERSONA_GROWTH_PHASE: active
  EXPECTED_WORLD_LEDGER_SCHEMA_PHASE: compat

jobs:
  build:
    name: 构建双站发布包
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      checks: read

    steps:
      - name: 校验 main 同提交严格 CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          revision = os.environ["GITHUB_SHA"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/commits/{revision}/check-runs?per_page=100",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              runs = json.load(response).get("check_runs", [])
          conclusions = {run.get("name"): run.get("conclusion") for run in runs}
          required = ("Release gate", "Admin quality", "Portal E2E")
          failed = {name: conclusions.get(name) for name in required if conclusions.get(name) != "success"}
          if failed:
              raise SystemExit(f"同提交严格 CI 未全部成功：{failed}")
          print("同提交严格 CI 已通过")
          PY

      - name: 检出门户代码
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: 拒绝尚未冻结的发布观察策略
        run: python3 scripts/release_transaction.py policy

      - name: 校验跨仓库只读凭据
        env:
          LINGXI_REPO_TOKEN: ${{ secrets.LINGXI_REPO_TOKEN }}
        run: test -n "$LINGXI_REPO_TOKEN"

      - name: 检出灵犀代码
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: Timking123/Lingxi
          ref: ${{ env.LINGXI_SHA }}
          path: lingxi-source
          token: ${{ secrets.LINGXI_REPO_TOKEN }}
          persist-credentials: false

      - name: 设置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            lingxi-source/ui/frontend/package-lock.json

      - name: 设置 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: lingxi-source/requirements-ci.txt

      - name: 验证 Lingxi 确定性状态
        working-directory: lingxi-source
        run: |
          test -s requirements-ci.txt
          python -m pip install -r requirements-ci.txt
          python scripts/verify_state.py
        env:
          PYTHONUTF8: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'

      - name: 构建门户
        run: |
          npm ci
          npm run type-check
          npm run test -- src/views/__tests__/Home.test.ts
          npm run build:skip-check
        env:
          VITE_SITE_URL: https://hi-veblen.com
          VITE_API_BASE_URL: /api
          VITE_LINGXI_URL: https://lingxi.hi-veblen.com/

      - name: 验证门户生产制品
        run: |
          npx playwright install --with-deps chromium
          npx playwright test e2e/art-museum-experience.spec.ts --project=chromium
        env:
          VITE_LINGXI_URL: https://lingxi.hi-veblen.com/

      - name: 构建灵犀网页端
        working-directory: lingxi-source/ui/frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_APP_BASE: /
          VITE_PORTAL_URL: https://hi-veblen.com/

      - name: 组合不可变发布包
        run: |
          mkdir -p release-package/portal release-package/lingxi release-package/backend
          cp -a dist/. release-package/portal/
          cp -a lingxi-source/ui/frontend/dist/. release-package/lingxi/
          install -m 0755 scripts/prune-production-releases.sh \
            release-package/prune-production-releases.sh
          install -m 0755 scripts/prune-production-staging.sh \
            release-package/prune-production-staging.sh
          install -m 0755 scripts/validate_release_health.py \
            release-package/validate_release_health.py
          install -m 0755 scripts/release_transaction.py release-package/release_transaction.py
          install -m 0755 scripts/production-release-transaction.sh release-package/production-release-transaction.sh
          lingxi_sha="$(git -C lingxi-source rev-parse HEAD)"
          test "$lingxi_sha" = "$LINGXI_SHA"
          git -C lingxi-source archive --format=tar "$lingxi_sha" | tar -x -C release-package/backend
          printf '%s\n' "$GITHUB_SHA" > release-package/portal/release.txt
          printf '%s\n' "$lingxi_sha" > release-package/lingxi/release.txt
          printf '%s\n' "$lingxi_sha" > release-package/backend/release.txt
          release_env="$(printf 'BRAIN_RELEASE_SHA=%s\nLINGXI_PERSONA_SCHEMA_CAPABILITY=dual-read-v1\nLINGXI_WORLD_LEDGER_SCHEMA_CAPABILITY=dual-read-v2-preserve' "$lingxi_sha")"
          printf '%s\n' "$release_env" > release-package/backend/.release.env
          printf 'portal=%s\nlingxi=%s\nbackend=%s\n' \
            "$GITHUB_SHA" "$lingxi_sha" "$lingxi_sha" > release-package/release.txt
          test -s release-package/portal/index.html
          test -s release-package/lingxi/index.html
          test -s release-package/backend/brain/workspace/world_server.py
          test -s release-package/backend/ui/backend/app.py
          test -s release-package/backend/scripts/install_linux_services.sh
          grep -Fq 'LINGXI_PERSONA_SCHEMA_CAPABILITY=dual-read-v1' \
            release-package/backend/scripts/install_linux_services.sh
          if test -e release-package/backend/ops/apparmor/myagent-persona-parser || \
            test -L release-package/backend/ops/apparmor/myagent-persona-parser; then
            test ! -L release-package/backend/ops/apparmor/myagent-persona-parser
            test -f release-package/backend/ops/apparmor/myagent-persona-parser
            test -s release-package/backend/ops/apparmor/myagent-persona-parser
          fi
          python3 scripts/validate_release_nginx.py \
            release-package/backend/ops/nginx/hi-veblen.com.http.conf
          test -x release-package/prune-production-releases.sh
          test -x release-package/prune-production-staging.sh
          test -x release-package/validate_release_health.py
          test "$(cat release-package/portal/release.txt)" = "$GITHUB_SHA"
          test "$(cat release-package/lingxi/release.txt)" = "$lingxi_sha"
          test "$(cat release-package/backend/release.txt)" = "$lingxi_sha"
          printf '%s\n' "$release_env" | cmp -s - release-package/backend/.release.env
          grep -R -q 'https://lingxi.hi-veblen.com/' release-package/portal/assets
          for site in portal lingxi; do
            assets="$(grep -oE '/assets/[^" ]+\.(js|css)' "release-package/$site/index.html" | sort -u)"
            test -n "$assets"
            for asset in $assets; do
              test -s "release-package/$site/${asset#/}"
            done
          done
          test -z "$(find release-package -type l -print -quit)"
          (
            cd release-package/backend
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > release-package/backend-files.sha256
          test -s release-package/backend-files.sha256
          tar -C release-package -czf portal-dist.tar.gz .
          sha256sum portal-dist.tar.gz > portal-dist.tar.gz.sha256

      - name: 保存发布制品
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-release-${{ github.sha }}
          path: |
            portal-dist.tar.gz
            portal-dist.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: 部署双站发布包
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
    permissions:
      contents: read

    steps:
      - name: 下载发布制品
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-release-${{ github.sha }}

      - name: 校验发布制品
        id: release
        run: |
          sha256sum --check portal-dist.tar.gz.sha256
          package_sha256="$(cut -d ' ' -f 1 portal-dist.tar.gz.sha256)"
          test "${#package_sha256}" -eq 64
          printf 'package_sha256=%s\n' "$package_sha256" >> "$GITHUB_OUTPUT"

      - name: 配置受信 SSH
        id: configure-ssh
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -eu
          case "$SERVER_HOST" in
            ''|*[!A-Za-z0-9.:-]*) echo "SERVER_HOST 格式无效" >&2; exit 1 ;;
          esac
          case "$SERVER_USER" in
            ''|*[!A-Za-z0-9._-]*) echo "SERVER_USER 格式无效" >&2; exit 1 ;;
          esac
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/hi-veblen-deploy"
          chmod 0600 "$HOME/.ssh/hi-veblen-deploy"
          printf '%s\n' \
            'hi-veblen-production ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM4IhOSWQcIioXavkJYcZ1WbE682kGvQF+rTAgnBRNif' \
            > "$HOME/.ssh/known_hosts"
          printf '%s\n' \
            'Host hi-veblen-production' \
            "  HostName $SERVER_HOST" \
            "  User $SERVER_USER" \
            '  HostKeyAlias hi-veblen-production' \
            '  IdentityFile ~/.ssh/hi-veblen-deploy' \
            '  IdentitiesOnly yes' \
            '  BatchMode yes' \
            '  StrictHostKeyChecking yes' \
            '  ConnectTimeout 10' \
            > "$HOME/.ssh/config"
          chmod 0600 "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"
          ssh hi-veblen-production true

      - name: 从独立受信制品验证全部历史事务
        run: |
          set -euo pipefail
          tar -xOf portal-dist.tar.gz ./release_transaction.py | \
            ssh hi-veblen-production sudo /usr/bin/python3 -I -B - history

      - name: 拒绝未纳管的 systemd 覆盖
        run: |
          ssh hi-veblen-production 'bash -se --' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          run_id="$1"
          run_attempt="$2"
          portal_revision="$3"
          case "$run_id" in
            ''|*[!0-9]*) echo "GitHub run id 格式无效：$run_id" >&2; exit 1 ;;
          esac
          case "$run_attempt" in
            ''|*[!0-9]*) echo "GitHub run attempt 格式无效：$run_attempt" >&2; exit 1 ;;
          esac
          case "$portal_revision" in
            ''|*[!0-9a-f]*) echo "Portal revision 格式无效" >&2; exit 1 ;;
          esac
          test "${#portal_revision}" -eq 40
          release_lock=/run/hi-veblen-release.lock
          lease_dir=/run/hi-veblen-release-lease
          lease_owner="$run_id-$run_attempt"
          command -v flock >/dev/null
          exec 9>"$release_lock"
          if ! flock -n 9; then
            echo "另一个服务器发布事务仍在运行，拒绝 preflight。" >&2
            exit 1
          fi
          maintenance_marker=/run/myagent-release-maintenance
          preserve_marker=/run/hi-veblen-release-preserve
          preserved_staging=""
          if test -d /opt/hi-veblen/staging; then
            preserved_staging="$(find /opt/hi-veblen/staging -mindepth 2 -maxdepth 2 \
              -name PRESERVE -print -quit)"
          fi
          if test -e "$maintenance_marker" || test -L "$maintenance_marker" || \
            test -e "$preserve_marker" || test -L "$preserve_marker" || \
            test -n "$preserved_staging"; then
            echo "检测到遗留发布保护现场，拒绝创建新发布。" >&2
            exit 1
          fi
          for unit in myagent-world.service myagent-gateway.service; do
            dropins="$(systemctl show "$unit" -p DropInPaths --value)"
            if test -n "$dropins"; then
              echo "检测到未纳管的 systemd drop-in，拒绝发布：$unit" >&2
              exit 1
            fi
          done
          if test -e "$lease_dir" || test -L "$lease_dir"; then
            current_owner=unknown
            if test -d "$lease_dir" && test ! -L "$lease_dir" && \
              test -f "$lease_dir/owner" && test ! -L "$lease_dir/owner"; then
              current_owner="$(cat "$lease_dir/owner" 2>/dev/null || true)"
            fi
            echo "服务器发布生命周期已被占用：${current_owner:-unknown}" >&2
            exit 1
          fi
          lease_tmp=""
          cleanup_lease_tmp() {
            cleanup_status=$?
            if test -n "${lease_tmp:-}" && test -d "$lease_tmp" && \
              test ! -L "$lease_tmp"; then
              rm -f -- "$lease_tmp/owner" || cleanup_status=$?
              rmdir -- "$lease_tmp" || cleanup_status=$?
            fi
            return "$cleanup_status"
          }
          trap cleanup_lease_tmp EXIT
          lease_tmp="$(mktemp -d "/run/.hi-veblen-release-lease.$lease_owner.XXXXXX")"
          printf '%s\n' "$lease_owner" > "$lease_tmp/owner"
          chmod 0600 "$lease_tmp/owner"
          test "$(stat -c '%U:%G:%a' "$lease_tmp")" = "root:root:700"
          test "$(stat -c '%U:%G:%a' "$lease_tmp/owner")" = "root:root:600"
          mv -T -- "$lease_tmp" "$lease_dir"
          lease_tmp=""
          trap - EXIT

          # 在任何 release、服务或系统配置变更前持久化生产配置快照。
          if test "$(id -u)" -ne 0; then
            echo "生产配置备份只能由 root 创建。" >&2
            exit 1
          fi
          config_backup_root=/var/backups/myagent-production-config
          config_backup_dir="$config_backup_root/run-$run_id-$run_attempt-$portal_revision"
          umask 077
          if test -e /var/backups || test -L /var/backups; then
            test -d /var/backups && test ! -L /var/backups
            test "$(stat -c '%U:%G' /var/backups)" = "root:root"
            backups_parent_mode="$(stat -c '%a' /var/backups)"
            if (( (8#$backups_parent_mode & 0022) != 0 )); then
              echo "持久备份父目录允许非 root 写入：/var/backups" >&2
              exit 1
            fi
          else
            echo "持久备份父目录不存在：/var/backups" >&2
            exit 1
          fi
          if test -e "$config_backup_root" || test -L "$config_backup_root"; then
            test -d "$config_backup_root" && test ! -L "$config_backup_root"
            test "$(stat -c '%U:%G:%a' "$config_backup_root")" = "root:root:700"
          else
            install -d -o root -g root -m 0700 "$config_backup_root"
          fi
          if test -e "$config_backup_dir" || test -L "$config_backup_dir"; then
            echo "生产配置备份已存在，拒绝覆盖：$config_backup_dir" >&2
            exit 1
          fi
          config_backup_tmp=""
          cleanup_config_backup_tmp() {
            cleanup_status=$?
            if test -n "${config_backup_tmp:-}" && \
              { test -e "$config_backup_tmp" || test -L "$config_backup_tmp"; }; then
              case "$config_backup_tmp" in
                "$config_backup_root"/.run-"$run_id"-"$run_attempt"-"$portal_revision".tmp.*)
                  rm -rf --one-file-system -- "$config_backup_tmp" || cleanup_status=$?
                  ;;
                *)
                  echo "拒绝清理非预期生产配置临时路径：$config_backup_tmp" >&2
                  cleanup_status=1
                  ;;
              esac
            fi
            return "$cleanup_status"
          }
          trap cleanup_config_backup_tmp EXIT
          config_backup_tmp="$(mktemp -d \
            "$config_backup_root/.run-$run_id-$run_attempt-$portal_revision.tmp.XXXXXX")"
          test "$(stat -c '%U:%G:%a' "$config_backup_tmp")" = "root:root:700"
          config_backup_snapshot="$config_backup_tmp/snapshot"
          install -d -o root -g root -m 0700 "$config_backup_snapshot"

          required_config_paths=(
            /opt/myagent/.env
            /etc/systemd/system/myagent-world.service
            /etc/systemd/system/myagent-gateway.service
          )
          archive_paths=()
          stage_regular_config() {
            local path="$1"
            local archive_path="${path#/}"
            local staged_path="$config_backup_snapshot/$archive_path"
            if test -L "$path" || ! test -f "$path" || ! test -r "$path"; then
              echo "生产配置不可安全读取：$path" >&2
              exit 1
            fi
            install -d -o root -g root -m 0700 "$(dirname "$staged_path")"
            cp --archive --no-dereference -- "$path" "$staged_path"
            if test -L "$path" || ! test -f "$path" || test -L "$staged_path" || \
              ! test -f "$staged_path" || ! cmp -s -- "$path" "$staged_path"; then
              echo "生产配置复制期间发生变化：$path" >&2
              exit 1
            fi
            archive_paths+=("$archive_path")
          }
          validate_nginx_config_tree() {
            local path="$1"
            local unexpected=""
            local hardlinked=""
            if test "$path" = /etc/nginx/sites-available; then
              unexpected="$(find "$path" -mindepth 1 -maxdepth 1 \
                ! -type f -print -quit)"
            else
              unexpected="$(find "$path" -mindepth 1 -maxdepth 1 \
                ! -type f ! -type l -print -quit)"
            fi
            if test -n "$unexpected"; then
              echo "Nginx 配置包含目录或特殊文件：$unexpected" >&2
              exit 1
            fi
            hardlinked="$(find "$path" -mindepth 1 -maxdepth 1 \
              -type f -links +1 -print -quit)"
            if test -n "$hardlinked"; then
              echo "Nginx 配置包含硬链接文件：$hardlinked" >&2
              exit 1
            fi
            if test "$path" = /etc/nginx/sites-enabled; then
              while IFS= read -r -d '' member; do
                if test -L "$member"; then
                  target="$(readlink -f -- "$member")"
                  if test "$(dirname -- "$target")" != \
                    /etc/nginx/sites-available || ! test -f "$target" || \
                    test "$(stat -c '%h' "$target")" -ne 1; then
                    echo "sites-enabled 链接未指向受管普通配置：$member" >&2
                    exit 1
                  fi
                fi
              done < <(find "$path" -mindepth 1 -maxdepth 1 -print0)
            fi
          }
          validate_config_backup_payload() {
            local backup_path="$1"
            local backup_name="$2"
            python3 -B - "$backup_path" "$backup_name" <<'PY'
          import hashlib
          import posixpath
          import re
          import sys
          import tarfile
          from pathlib import Path, PurePosixPath


          def require(condition: bool, message: str) -> None:
              if not condition:
                  raise ValueError(message)


          def file_sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()


          try:
              backup_path = Path(sys.argv[1])
              backup_name = sys.argv[2]
              name_match = re.fullmatch(
                  r"run-([0-9]+)-([0-9]+)-([0-9a-f]{40})", backup_name
              )
              require(name_match is not None, "目录名格式无效")
              run_id, run_attempt, revision = name_match.groups()

              archive_path = backup_path / "config.tar.gz"
              metadata_path = backup_path / "metadata.txt"
              manifest_path = backup_path / "SHA256SUMS"
              manifest_entries: dict[str, str] = {}
              for line in manifest_path.read_text(encoding="ascii").splitlines():
                  match = re.fullmatch(
                      r"([0-9a-f]{64})  (config\.tar\.gz|metadata\.txt)", line
                  )
                  require(match is not None, "摘要清单格式无效")
                  digest, filename = match.groups()
                  require(filename not in manifest_entries, "摘要清单包含重复项")
                  manifest_entries[filename] = digest
              require(
                  set(manifest_entries) == {"config.tar.gz", "metadata.txt"},
                  "摘要清单成员不完整",
              )
              require(
                  file_sha256(archive_path) == manifest_entries["config.tar.gz"]
                  and file_sha256(metadata_path) == manifest_entries["metadata.txt"],
                  "归档摘要不匹配",
              )

              metadata: dict[str, list[str]] = {}
              for line in metadata_path.read_text(encoding="utf-8").splitlines():
                  require("=" in line, "metadata 行格式无效")
                  key, value = line.split("=", 1)
                  metadata.setdefault(key, []).append(value)
              allowed_keys = {
                  "schema",
                  "created_at_utc",
                  "github_run_id",
                  "github_run_attempt",
                  "portal_revision",
                  "apparmor_profile",
                  "ops_env",
                  "path",
              }
              require(set(metadata) == allowed_keys, "metadata 字段集合无效")

              def single(key: str) -> str:
                  values = metadata[key]
                  require(len(values) == 1, f"metadata {key} 重复")
                  return values[0]

              require(
                  single("schema") == "myagent-production-config-backup-v1",
                  "schema 无效",
              )
              require(
                  re.fullmatch(
                      r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z",
                      single("created_at_utc"),
                  )
                  is not None,
                  "创建时间格式无效",
              )
              require(single("github_run_id") == run_id, "run id 与目录名不一致")
              require(
                  single("github_run_attempt") == run_attempt,
                  "run attempt 与目录名不一致",
              )
              require(
                  single("portal_revision") == revision,
                  "revision 与目录名不一致",
              )
              apparmor_state = single("apparmor_profile")
              ops_env_state = single("ops_env")
              require(apparmor_state in {"present", "absent"}, "AppArmor 状态无效")
              require(ops_env_state in {"present", "absent"}, "ops.env 状态无效")

              required_files = {
                  "opt/myagent/.env",
                  "etc/systemd/system/myagent-world.service",
                  "etc/systemd/system/myagent-gateway.service",
              }
              required_directories = {
                  "etc/nginx/sites-available",
                  "etc/nginx/sites-enabled",
              }
              optional_paths = {
                  "etc/apparmor.d/myagent-persona-parser": apparmor_state,
                  "etc/lingxi-ops/ops.env": ops_env_state,
              }
              expected_paths = required_files | required_directories | {
                  path for path, state in optional_paths.items() if state == "present"
              }
              require(
                  len(metadata["path"]) == len(set(metadata["path"]))
                  and set(metadata["path"]) == expected_paths,
                  "metadata 路径集合无效",
              )

              with tarfile.open(archive_path, mode="r:gz") as archive:
                  members = archive.getmembers()
              normalized_members: dict[str, tarfile.TarInfo] = {}
              for member in members:
                  pure_name = PurePosixPath(member.name)
                  require(
                      not pure_name.is_absolute() and ".." not in pure_name.parts,
                      "归档包含越界路径",
                  )
                  normalized_name = member.name.rstrip("/")
                  require(
                      normalized_name and normalized_name not in normalized_members,
                      "归档包含空路径或重复成员",
                  )
                  normalized_members[normalized_name] = member

              for path in required_files:
                  require(
                      path in normalized_members and normalized_members[path].isreg(),
                      "归档缺少必需普通文件",
                  )
              for path in required_directories:
                  require(
                      path in normalized_members and normalized_members[path].isdir(),
                      "归档缺少必需目录",
                  )
              for path, state in optional_paths.items():
                  present = path in normalized_members
                  require(present == (state == "present"), "可选成员状态不一致")
                  if present:
                      require(normalized_members[path].isreg(), "可选成员不是普通文件")

              fixed_members = required_files | required_directories | set(optional_paths)
              available_prefix = "etc/nginx/sites-available/"
              enabled_prefix = "etc/nginx/sites-enabled/"
              for name, member in normalized_members.items():
                  if name in fixed_members:
                      continue
                  if name.startswith(available_prefix):
                      relative = name[len(available_prefix) :]
                      require("/" not in relative and member.isreg(), "sites-available 成员无效")
                      continue
                  if name.startswith(enabled_prefix):
                      relative = name[len(enabled_prefix) :]
                      require(
                          "/" not in relative and (member.isreg() or member.issym()),
                          "sites-enabled 成员无效",
                      )
                      if member.issym():
                          live_name = f"/etc/nginx/sites-enabled/{relative}"
                          target = member.linkname
                          if not target.startswith("/"):
                              target = posixpath.join(posixpath.dirname(live_name), target)
                          resolved = posixpath.normpath(target)
                          require(
                              posixpath.dirname(resolved) == "/etc/nginx/sites-available",
                              "sites-enabled 链接越界",
                          )
                          available_name = resolved.removeprefix("/")
                          require(
                              available_name in normalized_members
                              and normalized_members[available_name].isreg(),
                              "sites-enabled 链接目标无效",
                          )
                      continue
                  raise ValueError("归档包含未声明成员")
          except (OSError, UnicodeError, ValueError, tarfile.TarError) as exc:
              print(f"生产配置归档校验失败：{exc}", file=sys.stderr)
              raise SystemExit(1)
          PY
          }
          for path in "${required_config_paths[@]}"; do
            stage_regular_config "$path"
          done
          for path in /etc/nginx/sites-available /etc/nginx/sites-enabled; do
            if test -L "$path" || ! test -d "$path" || ! test -r "$path"; then
              echo "必需 Nginx 配置目录不可安全读取：$path" >&2
              exit 1
            fi
            validate_nginx_config_tree "$path"
            archive_path="${path#/}"
            staged_path="$config_backup_snapshot/$archive_path"
            install -d -o root -g root -m 0700 "$(dirname "$staged_path")"
            cp --archive --no-dereference -- "$path" "$staged_path"
            if test -L "$path" || ! test -d "$path" || test -L "$staged_path" || \
              ! test -d "$staged_path" || \
              ! diff --brief --recursive --no-dereference -- "$path" "$staged_path"; then
              echo "Nginx 配置复制期间路径类型发生变化：$path" >&2
              exit 1
            fi
            validate_nginx_config_tree "$path"
            archive_paths+=("$archive_path")
          done

          apparmor_profile_path=/etc/apparmor.d/myagent-persona-parser
          apparmor_profile_state=absent
          if test -e "$apparmor_profile_path" || test -L "$apparmor_profile_path"; then
            stage_regular_config "$apparmor_profile_path"
            apparmor_profile_state=present
          fi

          ops_env_path=/etc/lingxi-ops/ops.env
          ops_env_state=absent
          if test -e "$ops_env_path" || test -L "$ops_env_path"; then
            stage_regular_config "$ops_env_path"
            ops_env_state=present
          fi

          tar --create --gzip --file "$config_backup_tmp/config.tar.gz" \
            --directory "$config_backup_snapshot" -- "${archive_paths[@]}"
          rm -rf --one-file-system -- "$config_backup_snapshot"
          {
            printf 'schema=myagent-production-config-backup-v1\n'
            printf 'created_at_utc=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            printf 'github_run_id=%s\ngithub_run_attempt=%s\n' \
              "$run_id" "$run_attempt"
            printf 'portal_revision=%s\napparmor_profile=%s\nops_env=%s\n' \
              "$portal_revision" "$apparmor_profile_state" "$ops_env_state"
            printf 'path=%s\n' "${archive_paths[@]}"
          } > "$config_backup_tmp/metadata.txt"
          (
            cd "$config_backup_tmp"
            sha256sum config.tar.gz metadata.txt > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          chmod 0600 "$config_backup_tmp/config.tar.gz" \
            "$config_backup_tmp/metadata.txt" "$config_backup_tmp/SHA256SUMS"
          mv -T -- "$config_backup_tmp" "$config_backup_dir"
          config_backup_tmp=""
          trap - EXIT
          test "$(stat -c '%U:%G:%a' "$config_backup_dir")" = "root:root:700"
          for backup_file in config.tar.gz metadata.txt SHA256SUMS; do
            test ! -L "$config_backup_dir/$backup_file"
            test -f "$config_backup_dir/$backup_file"
            test "$(stat -c '%U:%G:%a' "$config_backup_dir/$backup_file")" = \
              "root:root:600"
          done
          (
            cd "$config_backup_dir"
            sha256sum --check SHA256SUMS
          )
          config_backup_name="${config_backup_dir##*/}"
          validate_config_backup_payload "$config_backup_dir" "$config_backup_name"
          sync -f "$config_backup_dir/config.tar.gz"
          config_archive_sha="$(awk '$2 == "config.tar.gz" { print $1 }' \
            "$config_backup_dir/SHA256SUMS")"
          case "$config_archive_sha" in
            ''|*[!0-9a-f]*) echo "生产配置备份摘要格式无效" >&2; exit 1 ;;
          esac
          test "${#config_archive_sha}" -eq 64

          config_backup_retention=30
          find "$config_backup_root" -mindepth 1 -maxdepth 1 -type d \
            -name 'run-*' -printf '%T@ %f\0' |
            sort -z -nr |
            (
              valid_backup_rank=0
              latest_backup_name=""
              while IFS= read -r -d '' backup_entry; do
                backup_name="${backup_entry#* }"
                if [[ ! "$backup_name" =~ ^run-[0-9]+-[0-9]+-[0-9a-f]{40}$ ]]; then
                  continue
                fi
                if test -z "$latest_backup_name"; then
                  latest_backup_name="$backup_name"
                fi
                backup_path="$config_backup_root/$backup_name"
                if test -L "$backup_path" || ! test -d "$backup_path" || \
                  ! test "$(stat -c '%U:%G:%a' "$backup_path")" = "root:root:700"; then
                  echo "跳过路径或权限异常的生产配置备份：$backup_path" >&2
                  continue
                fi
                valid_backup=1
                for backup_file in config.tar.gz metadata.txt SHA256SUMS; do
                  if test -L "$backup_path/$backup_file" || \
                    ! test -f "$backup_path/$backup_file" || \
                    ! test "$(stat -c '%U:%G:%a' "$backup_path/$backup_file")" = \
                      "root:root:600"; then
                    valid_backup=0
                    break
                  fi
                done
                backup_member_count="$(find "$backup_path" -mindepth 1 -maxdepth 1 \
                  -printf '.' | wc -c)"
                if test "$backup_member_count" -ne 3; then
                  valid_backup=0
                fi
                if test "$valid_backup" -ne 1 || \
                  ! validate_config_backup_payload "$backup_path" "$backup_name"; then
                  echo "跳过不完整或摘要异常的生产配置备份：$backup_path" >&2
                  continue
                fi
                valid_backup_rank=$((valid_backup_rank + 1))
                if test "$backup_name" = "$config_backup_name" || \
                  test "$backup_name" = "$latest_backup_name" || \
                  test "$valid_backup_rank" -le "$config_backup_retention"; then
                  continue
                fi
                printf '删除超出保留上限的生产配置备份：%s\n' "$backup_path"
                rm -f -- "$backup_path/config.tar.gz" \
                  "$backup_path/metadata.txt" "$backup_path/SHA256SUMS"
                rmdir -- "$backup_path"
              done
            )
          printf '持久生产配置备份已创建：%s；sha256=%s\n' \
            "$config_backup_dir" "$config_archive_sha"
          REMOTE

      - name: 创建私有暂存目录
        run: |
          ssh hi-veblen-production 'bash -se --' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'REMOTE'
          set -eu
          run_id="$1"
          run_attempt="$2"
          case "$run_id" in
            ''|*[!0-9]*) echo "GitHub run id 格式无效：$run_id" >&2; exit 1 ;;
          esac
          case "$run_attempt" in
            ''|*[!0-9]*) echo "GitHub run attempt 格式无效：$run_attempt" >&2; exit 1 ;;
          esac
          release_lock=/run/hi-veblen-release.lock
          lease_dir=/run/hi-veblen-release-lease
          lease_owner="$run_id-$run_attempt"
          command -v flock >/dev/null
          exec 9>"$release_lock"
          if ! flock -n 9; then
            echo "另一个服务器发布事务仍在运行，拒绝创建暂存目录。" >&2
            exit 1
          fi
          test "$(cat "$lease_dir/owner" 2>/dev/null || true)" = "$lease_owner"
          maintenance_marker=/run/myagent-release-maintenance
          preserve_marker=/run/hi-veblen-release-preserve
          preserved_staging=""
          if test -d /opt/hi-veblen/staging; then
            preserved_staging="$(find /opt/hi-veblen/staging -mindepth 2 -maxdepth 2 \
              -name PRESERVE -print -quit)"
          fi
          if test -e "$maintenance_marker" || test -L "$maintenance_marker" || \
            test -e "$preserve_marker" || test -L "$preserve_marker" || \
            test -n "$preserved_staging"; then
            echo "检测到发布保护现场，拒绝创建暂存目录。" >&2
            exit 1
          fi
          umask 077
          staging_root=/opt/hi-veblen/staging
          upload_dir="$staging_root/run-$run_id-$run_attempt"
          install -d -m 0700 "$staging_root"
          if test -e "$upload_dir"; then
            echo "发布暂存目录已存在，拒绝覆盖：$upload_dir" >&2
            exit 1
          fi
          mkdir -m 0700 "$upload_dir"
          install -m 0600 /dev/null "$upload_dir/PRESERVE"
          sync -f /opt/hi-veblen/staging
          sync -f "$upload_dir/PRESERVE"
          sync -f "$upload_dir"
          REMOTE

      - name: 上传发布包
        run: |
          scp -q portal-dist.tar.gz \
            hi-veblen-production:/opt/hi-veblen/staging/run-${{ github.run_id }}-${{ github.run_attempt }}/

      - name: 维护窗口内协调切换并验证
        env:
          EXPECTED_ARCHIVE_SHA: ${{ steps.release.outputs.package_sha256 }}
          PERSONA_GROWTH_CANARY_HASHES: ${{ vars.LINGXI_PERSONA_GROWTH_CANARY_HASHES }}
        run: |
          set -euo pipefail
          # SSH 会拼接 argv 并由远端 shell 重解析；必须先校验整个原始字符串。
          persona_growth_canary_arg="${PERSONA_GROWTH_CANARY_HASHES-}"
          if [[ -n "$persona_growth_canary_arg" && ! "$persona_growth_canary_arg" =~ ^[0-9a-f]{64}(,[0-9a-f]{64})*$ ]]; then
            echo "Persona growth canary 摘要格式无效。" >&2
            exit 1
          fi
          persona_growth_canary_arg="${persona_growth_canary_arg:--}"
          ssh hi-veblen-production 'bash -se --' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" \
            "$EXPECTED_ARCHIVE_SHA" "$EXPECTED_PERSONA_SCHEMA_PHASE" \
            "$EXPECTED_PERSONA_GROWTH_PHASE" \
            "$persona_growth_canary_arg" "$EXPECTED_WORLD_LEDGER_SCHEMA_PHASE" <<'REMOTE'
          set -eu

          release_lock=/run/hi-veblen-release.lock
          command -v flock >/dev/null
          exec 9>"$release_lock"
          if ! flock -n 9; then
            echo "另一个服务器发布事务仍在运行，拒绝进入主事务。" >&2
            exit 1
          fi

          run_id="$1"
          run_attempt="$2"
          portal_revision="$3"
          expected_archive_sha="$4"
          expected_persona_schema_phase="$5"
          expected_persona_growth_phase="$6"
          persona_growth_canary_hashes="$7"
          expected_world_ledger_phase="$8"
          case "$expected_world_ledger_phase" in
            compat|active) ;;
            *) echo "WorldLedger phase 无效" >&2; exit 1 ;;
          esac
          if test "$persona_growth_canary_hashes" = "-"; then
            persona_growth_canary_hashes=""
          fi
          case "$run_id" in
            ''|*[!0-9]*) echo "GitHub run id 格式无效：$run_id" >&2; exit 1 ;;
          esac
          case "$run_attempt" in
            ''|*[!0-9]*) echo "GitHub run attempt 格式无效：$run_attempt" >&2; exit 1 ;;
          esac
          case "$expected_persona_schema_phase" in
            compat|active) ;;
            *) echo "Persona schema phase 无效：$expected_persona_schema_phase" >&2; exit 1 ;;
          esac
          case "$expected_persona_growth_phase" in
            compat|shadow|canary|active) ;;
            *) echo "Persona growth phase 无效：$expected_persona_growth_phase" >&2; exit 1 ;;
          esac
          if test -n "$persona_growth_canary_hashes" && \
            ! printf '%s' "$persona_growth_canary_hashes" | \
              grep -Eq '^[0-9a-f]{64}(,[0-9a-f]{64})*$'; then
            echo "Persona growth canary 摘要格式无效。" >&2
            exit 1
          fi
          upload_dir="/opt/hi-veblen/staging/run-$run_id-$run_attempt"
          archive="$upload_dir/portal-dist.tar.gz"
          release_root="/opt/hi-veblen/releases"
          release="$release_root/release-$portal_revision-$run_id-$run_attempt"
          project_root="/opt/myagent"
          portal_current="/opt/hi-veblen/portal-current"
          lingxi_current="/opt/hi-veblen/lingxi-current"
          backend_current="$project_root/backend-current"
          maintenance_marker=/run/myagent-release-maintenance
          preserve_marker=/run/hi-veblen-release-preserve
          lease_dir=/run/hi-veblen-release-lease
          lease_owner="$run_id-$run_attempt"
          apparmor_profile_name=myagent-persona-parser
          apparmor_profile_path="/etc/apparmor.d/$apparmor_profile_name"
          userns_restriction=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          legacy_apparmor_sha=55255df61ae6aef89ce5d8e4d46ba637ca3cd632

          if test "$(cat "$lease_dir/owner" 2>/dev/null || true)" != "$lease_owner"; then
            echo "发布生命周期租约不属于本次运行，拒绝进入主事务。" >&2
            exit 1
          fi
          test -f "$upload_dir/PRESERVE"
          test ! -L "$upload_dir/PRESERVE"

          assert_no_global_protection() {
            if test -e "$maintenance_marker" || test -L "$maintenance_marker" || \
              test -e "$preserve_marker" || test -L "$preserve_marker"; then
              echo "检测到全局发布保护标记，拒绝回收发布现场。" >&2
              return 1
            fi
          }

          case "$expected_archive_sha" in
            ''|*[!0-9a-f]*) echo "发布包摘要格式无效" >&2; exit 1 ;;
          esac
          test "${#expected_archive_sha}" -eq 64
          test "$(sha256sum "$archive" | cut -d ' ' -f 1)" = "$expected_archive_sha"
          python3 - "$archive" <<'PY'
          import sys
          import tarfile
          from pathlib import PurePosixPath

          with tarfile.open(sys.argv[1], "r:gz") as archive_file:
              for member in archive_file.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"不安全的归档路径：{member.name}")
                  if not (member.isfile() or member.isdir()):
                      raise SystemExit(f"不允许的归档成员类型：{member.name}")
          PY

          preserved_staging=""
          if test -d /opt/hi-veblen/staging; then
            preserved_staging="$(find /opt/hi-veblen/staging -mindepth 2 -maxdepth 2 \
              -name PRESERVE ! -path "$upload_dir/PRESERVE" -print -quit)"
          fi
          if test -e "$maintenance_marker" || test -L "$maintenance_marker" || \
            test -e "$preserve_marker" || test -L "$preserve_marker" || \
            test -n "$preserved_staging"; then
            echo "检测到遗留发布保护现场，拒绝创建或回收 release。" >&2
            exit 1
          fi
          mkdir -p "$release_root"
          mkdir "$release"
          tar --no-same-owner --no-same-permissions -xzf "$archive" -C "$release"
          chown -R root:root "$release"
          chmod -R go-w "$release"
          test -s "$release/portal/index.html"
          test -s "$release/lingxi/index.html"
          test -s "$release/release.txt"

          expected_portal="$(sed -n 's/^portal=//p' "$release/release.txt")"
          expected_lingxi="$(sed -n 's/^lingxi=//p' "$release/release.txt")"
          expected_backend="$(sed -n 's/^backend=//p' "$release/release.txt")"
          test -n "$expected_portal"
          test -n "$expected_lingxi"
          test "$expected_backend" = "$expected_lingxi"
          test "$(cat "$release/portal/release.txt")" = "$expected_portal"
          test "$(cat "$release/lingxi/release.txt")" = "$expected_lingxi"
          test "$(cat "$release/backend/release.txt")" = "$expected_backend"
          expected_release_env="$(printf 'BRAIN_RELEASE_SHA=%s\nLINGXI_PERSONA_SCHEMA_CAPABILITY=dual-read-v1\nLINGXI_WORLD_LEDGER_SCHEMA_CAPABILITY=dual-read-v2-preserve' "$expected_backend")"
          printf '%s\n' "$expected_release_env" | cmp -s - "$release/backend/.release.env"
          test -s "$release/backend-files.sha256"
          (
            cd "$release/backend"
            sha256sum --check "$release/backend-files.sha256"
          )

          for required in requirements-ci.txt brain/workspace/world_server.py ui/backend/app.py \
            scripts/install_linux_services.sh ops/systemd/myagent-world.service \
            ops/systemd/myagent-gateway.service ops/nginx/hi-veblen.com.http.conf; do
            test -s "$release/backend/$required"
          done
          apparmor_profile_source="$release/backend/ops/apparmor/$apparmor_profile_name"
          apparmor_profile_mode=legacy
          if test -e "$apparmor_profile_source" || test -L "$apparmor_profile_source"; then
            if test -L "$apparmor_profile_source" || \
              ! test -f "$apparmor_profile_source" || ! test -s "$apparmor_profile_source"; then
              echo "候选 AppArmor profile 必须是非空普通文件。" >&2
              exit 1
            fi
            apparmor_profile_mode=managed
          elif test "$expected_backend" != "$legacy_apparmor_sha"; then
            echo "候选后端缺少受管 AppArmor profile，拒绝发布。" >&2
            exit 1
          fi
          command -v apparmor_parser >/dev/null
          test -r /sys/kernel/security/apparmor/profiles
          test -r "$userns_restriction"
          test "$(cat "$userns_restriction")" = "1"
          if test "$apparmor_profile_mode" = "managed"; then
            command -v setpriv >/dev/null
            test -x /usr/bin/aa-exec
            apparmor_parser --skip-kernel-load --skip-cache --base /etc/apparmor.d \
              "$apparmor_profile_source"
          fi
          if test -L "$apparmor_profile_path"; then
            echo "AppArmor profile 不能是符号链接。" >&2
            exit 1
          fi
          if test -e "$apparmor_profile_path" && ! test -f "$apparmor_profile_path"; then
            echo "AppArmor profile 必须是普通文件。" >&2
            exit 1
          fi
          previous_apparmor_present=0
          if test -e "$apparmor_profile_path"; then
            previous_apparmor_present=1
            test "$(stat -c '%U:%G:%a' "$apparmor_profile_path")" = "root:root:644"
          fi
          previous_apparmor_loaded=0
          if grep -Fq "$apparmor_profile_name (" /sys/kernel/security/apparmor/profiles; then
            if ! grep -Fxq "$apparmor_profile_name (enforce)" \
              /sys/kernel/security/apparmor/profiles; then
              echo "AppArmor profile 未处于 enforce 模式，拒绝发布。" >&2
              exit 1
            fi
            previous_apparmor_loaded=1
          fi
          if test "$previous_apparmor_present" -ne "$previous_apparmor_loaded"; then
            echo "AppArmor profile 文件与内核加载状态不一致，拒绝发布。" >&2
            exit 1
          fi
          test -d "$project_root/data"
          test ! -e "$release/backend/data"
          ln -s "$project_root/data" "$release/backend/data"
          if test -d "$project_root/snapshots"; then
            test ! -e "$release/backend/snapshots"
            ln -s "$project_root/snapshots" "$release/backend/snapshots"
          fi

          certificate=/etc/letsencrypt/live/hi-veblen.com/fullchain.pem
          test -s "$certificate"
          openssl x509 -in "$certificate" -noout -checkend 0 >/dev/null
          certificate_host_check="$(
            openssl x509 -in "$certificate" -noout -checkhost lingxi.hi-veblen.com 2>&1
          )"
          printf '%s\n' "$certificate_host_check" | \
            grep -Fqx 'Hostname lingxi.hi-veblen.com does match certificate'

          for current in "$portal_current" "$lingxi_current" "$backend_current"; do
            if { test -e "$current" || test -L "$current"; } && ! test -L "$current"; then
              echo "current 路径不是符号链接，拒绝覆盖：$current" >&2
              exit 1
            fi
          done

          for current in "$portal_current" "$lingxi_current" "$backend_current"; do
            if ! test -L "$current" || ! test -d "$current"; then
              echo "current 指针缺失或目标无效，拒绝自动复制运行目录：$current" >&2
              exit 1
            fi
          done

          release_venv="$release/backend/.venv"
          release_python="$release_venv/bin/python"
          test ! -e "$release_venv"
          test -x /usr/bin/python3
          test "$(/usr/bin/python3 -c \
            'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" = "3.12"
          umask 022
          /usr/bin/python3 -m venv "$release_venv"
          "$release_python" -m pip install --disable-pip-version-check --no-input \
            --no-cache-dir -r "$release/backend/requirements-ci.txt"
          "$release_python" -m pip check
          "$release_python" -m pip install --disable-pip-version-check --no-input \
            --dry-run --no-index --no-deps -r "$release/backend/requirements-ci.txt"
          test "$("$release_python" -c \
            'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" = "3.12"
          "$release_python" -c \
            'import pathlib,sys; raise SystemExit(pathlib.Path(sys.prefix).resolve() != pathlib.Path(sys.argv[1]).resolve())' \
            "$release_venv"
          chown -R root:root "$release_venv"
          chmod -R go-w "$release_venv"
          test -z "$(find "$release_venv" ! -type l -perm /022 -print -quit)"
          umask 077

          # 独立入口重新取得唯一 flock；lease 持续绑定本事务，间隙不能创建另一发布。
          flock -u 9
          exec 9>&-
          exec bash "$release/production-release-transaction.sh" deploy \
            "run-$run_id-$run_attempt-$portal_revision" "$expected_backend" "$expected_archive_sha" \
            "$expected_persona_schema_phase" "$expected_persona_growth_phase" \
            "$expected_world_ledger_phase" "${persona_growth_canary_hashes:--}"
          REMOTE

      - name: 保留失败事务并提示共享恢复入口
        if: always()
        run: |
          echo '事务清理由持锁 finalize 完成；失败时保留 run、control、回执与恢复证据。'
          echo '重试须从独立核验的原 MyWeb 制品执行 production-release-transaction.sh recover <txn_id>。'
