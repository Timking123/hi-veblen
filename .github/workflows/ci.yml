      - name: Test remote argument mapping
        shell: bash
        run: |
          set -euo pipefail
          mapped="$(printf '%s' 'printf "%s|%s|%s|%s|%s|%s|%s" "$1" "$2" "$3" "$4" "$5" "$6" "$7"' | \
            "$BASH" -se -- 29160903633 1 \
              aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
              bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
              active canary \
              cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc)"
          test "$mapped" = \
            "29160903633|1|aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa|bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb|active|canary|cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"
          empty_mapped="$(printf '%s' 'value="$7"; test "$value" = "-" && value=""; printf "%s|%s" "$6" "$value"' | \
            "$BASH" -se -- 29160903633 1 \
              aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
              bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
              compat compat -)"
          test "$empty_mapped" = "compat|"

      - name: Test release retention guard
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/prune-production-releases.sh
          tmp="$(mktemp -d)"
          trap 'rm -rf -- "$tmp"' EXIT
          root="$tmp/releases"
          mkdir -p "$root"
          for n in 1 2 3 4 5 6 7; do
            mkdir -p "$root/release-$n"
            touch -d "@$n" "$root/release-$n"
          done
          mkdir -p "$root/release-unsafe name"
          bash scripts/prune-production-releases.sh \
            "$root" 3 "$root/release-7" "$root/release-2"
          for n in 2 5 6 7; do test -d "$root/release-$n"; done
          for n in 1 3 4; do test ! -e "$root/release-$n"; done
          test -d "$root/release-unsafe name"
          if bash scripts/prune-production-releases.sh "$tmp/not-releases" 3 "$root/release-7"; then
            echo "异常 release 根目录未被拒绝" >&2
            exit 1
          fi
          mkdir -p "$root/release-0"
          global_marker="$tmp/release-preserve"
          touch "$global_marker"
          if MYAGENT_MAINTENANCE_MARKER="$global_marker" \
            bash scripts/prune-production-releases.sh "$root" 3 "$root/release-7"; then
            echo "全局保护标记未阻止 release 回收" >&2
            exit 1
          fi
          test -d "$root/release-0"

      - name: Test staging retention guard
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/prune-production-staging.sh
          tmp="$(mktemp -d)"
          trap 'rm -rf -- "$tmp"' EXIT
          root="$tmp/staging"
          outside="$tmp/outside"
          mkdir -p "$root/run-9-1" "$root/run-8-1" "$root/run-invalid-1" "$outside"
          touch "$root/run-9-1/PRESERVE"
          ln -s "$outside" "$root/run-7-1"
          bash scripts/prune-production-staging.sh "$root" "$root/run-9-1"
          test -d "$root/run-9-1"
          test ! -e "$root/run-8-1"
          test -d "$root/run-invalid-1"
          test -L "$root/run-7-1"
          test -d "$outside"
          mkdir -p "$root/run-6-1" "$root/run-5-1"
          touch "$root/run-6-1/PRESERVE"
          if bash scripts/prune-production-staging.sh "$root" "$root/run-9-1"; then
            echo "staging 保护标记未阻止回收" >&2
            exit 1
          fi
          test -d "$root/run-6-1"
          test -d "$root/run-5-1"
          rm -f "$root/run-6-1/PRESERVE"
          global_marker="$tmp/staging-preserve"
          touch "$global_marker"
          if HI_VEBLEN_PRESERVE_MARKER="$global_marker" \
            bash scripts/prune-production-staging.sh "$root" "$root/run-9-1"; then
            echo "全局保护标记未阻止 staging 回收" >&2
            exit 1
          fi
          test -d "$root/run-5-1"

