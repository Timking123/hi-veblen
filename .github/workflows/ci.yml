name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Validate production transaction ordering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflow = Path(".github/workflows/deploy.yml").read_text(encoding="utf-8")
          acceptance = Path(
              ".github/workflows/d050-production-acceptance.yml"
          ).read_text(encoding="utf-8")
          acceptance_spec = Path(
              "e2e/d050-production-acceptance.spec.ts"
          ).read_text(encoding="utf-8")
          synthetic_helper = Path(
              "scripts/d050_prepare_synthetic.py"
          ).read_text(encoding="utf-8")
          assert "group: hi-veblen-production" in workflow
          assert "group: hi-veblen-production" in acceptance
          assert "github.triggering_actor == 'Timking123'" in acceptance
          assert "    timeout-minutes: 130" in acceptance
          assert "        default: auto" in acceptance
          assert "        default: prepare_review" in acceptance
          assert "recover_delete" in acceptance
          assert 'revoked != recovery' in acceptance
          assert acceptance.count("auto|p6_load_a") >= 2
          assert 'candidate = "p6_load_a"' in acceptance
          assert acceptance.count('test "$persist_id" = "p6_load_a"') >= 2
          assert "p6_load_b" not in acceptance
          assert "p6_load_c" not in acceptance
          assert "p6_e2e_current" not in acceptance
          assert 'D050_PRIMARY_TOKEN_B64' in synthetic_helper
          assert 'p6_load_a' in synthetic_helper
          assert 'p6_load_b' not in synthetic_helper
          assert 'p6_load_c' not in synthetic_helper
          assert 'unrevoke' not in synthetic_helper.lower()
          assert 'BRAIN_GATEWAY_USER_TOKENS' not in synthetic_helper
          assert '"/compare"' not in synthetic_helper
          assert 'presets[0]["id"] == "linxi"' in synthetic_helper
          assert 'role.get("mode") == "wizard"' in synthetic_helper
          assert 'not str(current.get("revoked_at") or "")' in synthetic_helper
          assert 'not str(consent.get("withdrawn_at") or "")' in synthetic_helper
          assert 'review_phase == "prepare_review"' in synthetic_helper
          assert 'review_phase == "confirm_review"' in synthetic_helper
          assert 'isinstance(accepted, bool)' in synthetic_helper
          assert 'review_set_sha256' in synthetic_helper
          assert 'D050_REVIEW_DECISION_B64' in synthetic_helper
          assert 'D050_AUDITION_KEY' in synthetic_helper
          assert 'test "$EXPECTED_PORTAL_REVISION" = "$EXPECTED_HEAD_SHA"' in acceptance
          assert (
              'test "$EXPECTED_BACKEND_REVISION" = "$locked_backend_revision"'
              in acceptance
          )
          prewrite_revision = acceptance.index(
              "      - name: 首次生产写前复核三处 backend revision"
          )
          backup_step = acceptance.index("      - name: 在首次生产写前创建并验证备份")
          helper_step = acceptance.index("      - name: 通过产品 API 准备 p6_load_a")
          review_artifact = acceptance.index("      - name: 保存待人工审核材料")
          review_encryption = acceptance.index("      - name: 加密待人工审核材料")
          review_gate = acceptance.index("      - name: 等待人工留出审核")
          binding_check = acceptance.index("      - name: 复核 p6_load_a 私有身份绑定")
          budget_step = acceptance.index("      - name: 提高活跃灰测额度")
          browser_step = acceptance.index("      - name: 运行生产真实 Chromium 全链")
          first_ssh_cleanup = acceptance.index(
              "      - name: 在浏览器执行前清除生产 SSH 凭据"
          )
          post_ssh_config = acceptance.index(
              "      - name: 为后置复核重新配置受信 SSH"
          )
          deletion_state = acceptance.index("      - name: 复核并续做整用户删除")
          final_ssh_cleanup = acceptance.index(
              "      - name: 清除后置生产 SSH 凭据"
          )
          artifact_upload = acceptance.index("      - name: 保存非敏感验收证据")
          failure_artifact = acceptance.index("      - name: 保存失败诊断证据")
          assert prewrite_revision < backup_step < helper_step
          assert helper_step < review_encryption < review_artifact < review_gate
          assert review_gate < binding_check < budget_step
          assert budget_step < first_ssh_cleanup < browser_step
          assert browser_step < post_ssh_config < deletion_state
          assert deletion_state < final_ssh_cleanup < artifact_upload
          assert acceptance.count('rm -f "$HOME/.ssh/hi-veblen-deploy"') == 2
          artifact = acceptance[artifact_upload:failure_artifact]
          assert "inputs.review_phase == 'confirm_review' && success()" in artifact
          assert "d050-growth-lock-diagnostic.json" not in artifact
          assert "d050-prewrite-revision-evidence.json" in artifact
          assert "d050-production-backup-evidence.json" in artifact
          assert "d050-gray-budget-evidence.json" in artifact
          assert "d050-synthetic-preparation-evidence.json" in artifact
          assert "d050-holdout-review-confirmation.json" in artifact
          assert "d050-delete-state-evidence.json" in artifact
          assert "d050-holdout-review.tar.gz.gpg" in acceptance[review_encryption:review_gate]
          assert "D050_REVIEW_ARTIFACT_KEY" in acceptance[review_encryption:review_artifact]
          assert "github.run_id" in acceptance[helper_step:review_encryption]
          assert "github.run_attempt" not in acceptance[helper_step:review_encryption]
          assert "exit 78" not in acceptance
          assert acceptance.count("inputs.review_phase == 'confirm_review'") >= 5
          assert "inputs.review_phase != 'recover_delete'" in acceptance
          post_ssh = acceptance[post_ssh_config:deletion_state]
          assert "inputs.review_phase == 'confirm_review'" in post_ssh
          assert "inputs.review_phase == 'recover_delete' && success()" in post_ssh
          failed_artifact = acceptance[failure_artifact:]
          assert "d050-holdout-review-request.json" not in failed_artifact
          assert "d050-holdout-review-decision.json" not in failed_artifact
          assert "if: $" + "{{ failure() }}" in failed_artifact
          assert "d050-growth-lock-diagnostic.json" in failed_artifact
          assert "d050-prewrite-revision-evidence.json" in failed_artifact
          assert "d050-holdout-review.tar.gz.gpg" in failed_artifact
          assert "d050-delete-state-evidence.json" in failed_artifact
          backup = acceptance[backup_step:helper_step]
          budget = acceptance[budget_step:first_ssh_cleanup]
          assert "systemctl start lingxi-backup.service" in backup
          assert "timeout 20m sudo systemctl start" in backup
          assert "backup_data.py" in backup and 'verify "/opt/myagent/backups/$latest"' in backup
          assert "100_000_000" in budget
          assert '{"budget": {"daily_token_limit": limit}}' in budget
          assert "save_user_config" in budget
          assert "rollback_restored" in budget
          assert "gray_user_state_changed_while_locking" in budget
          assert '"backup_created"' not in budget
          assert '"BAD": bad' in budget
          assert "parse_user_token_map" in acceptance[prewrite_revision:helper_step]
          deletion = acceptance[deletion_state:final_ssh_cleanup]
          assert "is_gateway_token_revoked" in deletion
          assert "/api/users/" in deletion
          assert 'state = "retryable_ready"' in deletion
          assert '"ready_cleanup_blocked"' in deletion
          assert '"delete_recovery" if recovery else "private_resumed"' in acceptance
          assert "d050-delete-recovery-" in acceptance
          assert 'test "$primary_token" = -' in acceptance
          assert 'test "$delete_token" = -' in acceptance
          assert "if revoked:" in deletion
          assert "if revoked and (user_dir.exists()" not in deletion
          assert 'gateway_report.get("deleted") is True' in deletion
          assert 'gateway_report.get("audit_retained") is True' in deletion
          for stage in ("initial", "before_delete", "after_delete"):
              assert f"recordRevisionCheck(evidence, '{stage}')" in acceptance_spec
          assert "expect(lingxiRevision).toBe(expectedBackendRevision)" in acceptance_spec
          assert "expect(observerBeforeDelete.status()).toBe(200)" in acceptance_spec
          assert "expect(priorSessionStatus.status()).toBe(401)" in acceptance_spec
          assert "await observerContext.addCookies(await context.cookies())" in acceptance_spec
          assert "const BOOTSTRAP_HTTP_ERRORS = [{ status: 401, path: '/api/me' }]" in acceptance_spec
          assert "{ status: 410, path: '/api/persona/calibration' }" in acceptance_spec
          assert "expect(consoleErrors.unexpected).toEqual([])" in acceptance_spec
          assert "expected_http_console_error_count" in acceptance_spec
          deploy_header = workflow[
              workflow.index("  deploy:"):
              workflow.index("    steps:", workflow.index("  deploy:"))
          ]
          deploy_timeout = re.search(r"^    timeout-minutes: ([0-9]+)$", deploy_header, re.MULTILINE)
          assert deploy_timeout is not None
          # continuity 最长 1800 秒，自动回滚最长 300 秒，另留 15 分钟给安装与验收。
          assert int(deploy_timeout.group(1)) * 60 >= 1800 + 300 + 15 * 60
          nginx_guard = (
              "          python3 scripts/validate_release_nginx.py \\\n"
              "            release-package/backend/ops/nginx/hi-veblen.com.http.conf"
          )
          nginx_guard_start = workflow.index(nginx_guard)
          assert workflow.index('git -C lingxi-source archive --format=tar') < nginx_guard_start
          assert nginx_guard_start < workflow.index('tar -C release-package -czf portal-dist.tar.gz')
          assert 'test -L release-package/backend/ops/apparmor/myagent-persona-parser; then' in workflow
          assert 'test ! -L release-package/backend/ops/apparmor/myagent-persona-parser' in workflow
          assert 'test -f release-package/backend/ops/apparmor/myagent-persona-parser' in workflow
          assert 'test -s release-package/backend/ops/apparmor/myagent-persona-parser' in workflow
          health_validator_install = (
              "          install -m 0755 scripts/validate_release_health.py \\\n"
              "            release-package/validate_release_health.py"
          )
          assert workflow.index(health_validator_install) < workflow.index('tar -C release-package -czf portal-dist.tar.gz')
          assert 'test -x release-package/validate_release_health.py' in workflow
          release_env_contract = (
              "BRAIN_RELEASE_SHA=%s\\n"
              "LINGXI_PERSONA_SCHEMA_CAPABILITY=dual-read-v1"
          )
          build_package = workflow[
              workflow.index("      - name: 组合不可变发布包"):
              workflow.index("      - name: 保存发布制品")
          ]
          build_release_env = (
              f'          release_env="$(printf \'{release_env_contract}\' "$lingxi_sha")"'
          )
          assert build_release_env in build_package
          assert 'printf \'%s\\n\' "$release_env" > release-package/backend/.release.env' in build_package
          assert 'printf \'%s\\n\' "$release_env" | cmp -s - release-package/backend/.release.env' in build_package
          installer_capability_guard = (
              "          grep -Fq 'LINGXI_PERSONA_SCHEMA_CAPABILITY=dual-read-v1' \\\n"
              "            release-package/backend/scripts/install_linux_services.sh"
          )
          assert installer_capability_guard in build_package
          assert build_package.index(build_release_env) < build_package.index(
              'tar -C release-package -czf portal-dist.tar.gz'
          )
          assert build_package.index(installer_capability_guard) < build_package.index(
              'tar -C release-package -czf portal-dist.tar.gz'
          )
          assert "EXPECTED_PERSONA_SCHEMA_PHASE: active" in workflow
          assert "EXPECTED_PERSONA_GROWTH_PHASE: active" in workflow
          assert "vars.LINGXI_PERSONA_GROWTH_CANARY_HASHES" in workflow
          assert "systemctl is-enabled --quiet myagent-world.service" in workflow
          assert "systemctl is-enabled --quiet myagent-gateway.service" in workflow
          assert 'Environment=LINGXI_PERSONA_GROWTH_PHASE=$expected_persona_growth_phase' in workflow
          assert 'Environment=LINGXI_PERSONA_GROWTH_CANARY_HASHES=$persona_growth_canary_hashes' in workflow
          assert 'assert hashes == {expected}' in workflow
          assert 'assert not persona_growth_applies_for("p6_e2e_control")' in workflow
          assert 'assert persona_growth_applies_for("p6_e2e_control")' in workflow
          assert 'synthetic_db="$project_root/data/users/p6_e2e_cn/conversation.sqlite3"' in workflow
          assert 'closing(sqlite3.connect(f"file:{path}?mode=ro", uri=True))' in workflow
          assert '{"persona_evidence", "persona_growth_state"} <= tables' in workflow
          auth_probe_token = workflow.index("Authorization: Bearer nginx-forwarding-probe")
          auth_probe = workflow[workflow.rfind('          portal_auth_probe="', 0, auth_probe_token):workflow.index('          invalid_status="', auth_probe_token)]
          assert "https://hi-veblen.com/api/auth/profile" in auth_probe
          assert 'status == "401"' in auth_probe
          assert 'data.get("code") == 401' in auth_probe
          assert 'get("reason") == "token_malformed"' in auth_probe
          assert workflow.count("release_lock=/run/hi-veblen-release.lock") >= 4
          assert workflow.count('exec 9>"$release_lock"') >= 4
          assert workflow.count("flock -n 9") >= 4
          assert workflow.count("lease_dir=/run/hi-veblen-release-lease") >= 4
          assert workflow.count('lease_owner="$run_id-$run_attempt"') >= 4
          assert 'lease_tmp="$(mktemp -d ' in workflow
          assert 'mv -T -- "$lease_tmp" "$lease_dir"' in workflow
          assert 'rmdir "$lease_dir"' in workflow
          rollback = workflow[workflow.index("          rollback() {"):workflow.index("          trap rollback EXIT")]
          assert 'test "$nginx_mutated" -eq 1' in rollback
          assert rollback.index("preserve_marker") < rollback.index('exit "$status"')
          assert rollback.index("restore_nginx_backup") < rollback.index("activate_maintenance")
          assert rollback.index("activate_maintenance") < rollback.index("restore_link")
          rollback_remove = rollback.index('rm -f "$maintenance_marker"')
          assert rollback.index("systemctl is-active --quiet myagent-world.service") < rollback_remove
          assert rollback.index("previous_backend_healthy") < rollback_remove
          assert rollback.index("nginx -t") < rollback_remove
          assert rollback.index("nginx_has_maintenance_guards") < rollback_remove
          assert rollback.index("systemctl reload nginx") < rollback_remove
          assert rollback.rindex("stop_services_for_manual_recovery") > rollback_remove
          assert "backup_nginx_has_maintenance_guards" in rollback
          rollback_floor_guard = rollback.index(
              'if test "$previous_backend_rollback_floor" -ne 1; then'
          )
          first_pointer_restore = rollback.index('restore_link "$previous_portal"')
          first_service_restart = rollback.index(
              "systemctl restart myagent-world.service myagent-gateway.service"
          )
          assert rollback_floor_guard < first_pointer_restore < first_service_restart
          rollback_floor_failure = rollback[rollback_floor_guard:first_pointer_restore]
          assert "dual-read-v1 回滚下限" in rollback_floor_failure
          assert "stop_services_for_manual_recovery" in rollback_floor_failure
          assert 'exit "$status"' in rollback_floor_failure
          assert 'rm -f "$upload_dir/PRESERVE"' not in rollback_floor_failure
          assert 'rm -f "$maintenance_marker"' not in rollback_floor_failure
          previous_health = workflow[
              workflow.index("          previous_backend_healthy() {"):
              workflow.index("          nginx_has_maintenance_guards() {")
          ]
          assert 'rollback_deadline=$((SECONDS + 300))' in previous_health
          assert '"$release/validate_release_health.py" rollback' in previous_health
          assert '"$previous_backend_revision"' in previous_health
          assert '"$release/validate_release_health.py" current' not in previous_health
          previous_health_guard = workflow.index(
              "          if ! previous_backend_healthy; then"
          )
          rollback_trap = workflow.index("          trap rollback EXIT")
          first_nginx_mutation = workflow.index(
              '          install -m 0644 "$release/backend/ops/nginx/hi-veblen.com.http.conf"'
          )
          assert (
              workflow.index("          previous_backend_healthy() {")
              < previous_health_guard
              < rollback_trap
              < first_nginx_mutation
          )
          assert "拒绝进入可变更阶段" in workflow[
              previous_health_guard:rollback_trap
          ]
          assert 'previous_revision_reliable' not in workflow
          assert '旧后端 release revision 不是完整提交 SHA' in workflow
          assert "ops/apparmor/myagent-persona-parser" in workflow
          assert 'apparmor_profile_mode=legacy' in workflow
          assert 'apparmor_profile_mode=managed' in workflow
          assert 'legacy_apparmor_sha=55255df61ae6aef89ce5d8e4d46ba637ca3cd632' in workflow
          assert 'test "$expected_backend" != "$legacy_apparmor_sha"' in workflow
          assert '候选后端缺少受管 AppArmor profile' in workflow
          assert 'test "$(cat "$userns_restriction")" = "1"' in workflow
          profile_preflight = workflow.index(
              'apparmor_parser --skip-kernel-load --skip-cache --base /etc/apparmor.d'
          )
          rollback_snapshot = workflow.index('rollback_root="$upload_dir/rollback"')
          assert profile_preflight < rollback_snapshot
          assert 'previous_apparmor_present' in workflow[:rollback_snapshot]
          assert 'previous_apparmor_loaded' in workflow[:rollback_snapshot]
          assert 'AppArmor profile 文件与内核加载状态不一致' in workflow
          assert 'AppArmor profile 未处于 enforce 模式' in workflow
          assert 'mkdir "$rollback_root/apparmor"' in workflow
          assert 'remove_apparmor_profile() {' in workflow
          assert 'restore_apparmor_profile() {' in workflow
          assert 'apparmor_parser --remove --base /etc/apparmor.d' in workflow
          assert rollback.index("systemctl stop myagent-gateway.service") < rollback.index("restore_apparmor_profile")
          assert 'if test "$services_stopped" -eq 0' not in rollback
          assert rollback.index("systemctl stop myagent-gateway.service") < rollback.index("systemctl is-active --quiet myagent-gateway.service")
          assert 'test "$apparmor_mutated" -eq 1' in rollback
          assert rollback.index("restore_apparmor_profile") < rollback.index("systemctl restart myagent-world.service")
          rollback_userns_check = rollback.index(
              'test "$(cat "$userns_restriction")" != "1"'
          )
          assert rollback.index("restore_apparmor_profile") < rollback_userns_check
          assert rollback_userns_check < rollback.index("systemctl restart myagent-world.service")
          assert rollback.index("nginx_has_maintenance_guards") < rollback.index("systemctl restart myagent-world.service")
          assert rollback.index("previous_backend_healthy") < rollback.rindex("systemctl reload nginx")
          assert rollback.rindex("systemctl reload nginx") < rollback.index("maintenance_public_blocked")
          assert rollback.rindex("maintenance_public_blocked") < rollback_remove
          assert rollback.count("maintenance_public_blocked") >= 2
          prelude_start = workflow.index("          primary_conf=/etc/nginx/sites-available/hi-veblen.com.conf", workflow.index("          trap rollback EXIT"))
          services_stop = workflow.index("          services_stopped=1", prelude_start)
          maintenance_prelude = workflow[prelude_start:services_stop]
          assert maintenance_prelude.index('test -f "$upload_dir/PRESERVE"') < maintenance_prelude.index("nginx_mutated=1")
          assert maintenance_prelude.index("nginx_mutated=1") < maintenance_prelude.index("install -m 0644")
          assert maintenance_prelude.index("systemctl reload nginx") < maintenance_prelude.index("activate_maintenance")
          assert maintenance_prelude.index("activate_maintenance") < maintenance_prelude.index("maintenance_public_blocked")
          assert "nginx_has_maintenance_guards" in maintenance_prelude
          main_stop = workflow.index('          systemctl stop myagent-gateway.service myagent-world.service', services_stop)
          gateway_inactive = workflow.index('          ! systemctl is-active --quiet myagent-gateway.service', main_stop)
          world_inactive = workflow.index('          ! systemctl is-active --quiet myagent-world.service', main_stop)
          legacy_remove = workflow.index('            remove_apparmor_profile', services_stop)
          switch_start = workflow.index("          switched=1", services_stop)
          assert services_stop < main_stop < gateway_inactive < legacy_remove < switch_start
          assert main_stop < world_inactive < legacy_remove
          final_remove = workflow.rindex('          rm -f "$maintenance_marker"')
          assert workflow.rindex("http://127.0.0.1:8000/api/session") < final_remove
          assert workflow.rindex("http://127.0.0.1:8000/api/health") < final_remove
          final_health = workflow[workflow.rindex('          api_health="'):final_remove]
          assert '"$release/validate_release_health.py" current "$expected_lingxi"' in final_health
          assert (
              '"$expected_persona_schema_phase" "$expected_persona_growth_phase"'
              in final_health
          )
          assert '"$release/validate_release_health.py" rollback' not in final_health
          assert '"$expected_lingxi"' in final_health
          profile_state = workflow[
              workflow.index("          verify_apparmor_profile_state() {"):
              workflow.index("          restore_nginx_backup() {")
          ]
          assert 'test "$apparmor_profile_mode" = "managed"' in profile_state
          assert 'cmp -s "$apparmor_profile_source" "$apparmor_profile_path"' in profile_state
          assert "stat -c '%U:%G:%a'" in profile_state
          assert 'test -e "$apparmor_profile_path" || test -L "$apparmor_profile_path"' in profile_state
          assert "apparmor_profile_is_present" in profile_state
          assert profile_state.count("apparmor_profile_is_enforced") == 1
          restore_profile = workflow[
              workflow.index("          restore_apparmor_profile() {"):
              workflow.index("          verify_apparmor_profile_state() {")
          ]
          assert "apparmor_profile_is_enforced" in restore_profile
          final_profile_check = workflow.rindex('          verify_apparmor_profile_state')
          assert final_profile_check < final_remove
          deployed_marker = workflow.rindex(
              '          install -m 0600 /dev/null "$upload_dir/DEPLOYED"'
          )
          assert final_profile_check < deployed_marker < final_remove
          assert "curl " not in workflow[final_remove:workflow.index("          trap - EXIT", final_remove)]
          assert "RELEASE_TRANSACTION=1" in workflow
          assert "拒绝未纳管的 systemd 覆盖" in workflow
          assert workflow.count("-p DropInPaths --value") >= 3
          prune_call = workflow.index('          bash "$release/prune-production-releases.sh"')
          assert workflow.index('          previous_backend="$(readlink -f "$backend_current")"') < prune_call
          previous_floor = workflow.index('          previous_backend_rollback_floor=0')
          previous_env = (
              f'          previous_release_env="$(printf \'{release_env_contract}\' '
