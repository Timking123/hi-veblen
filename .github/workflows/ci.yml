          )
          assert previous_floor < workflow.index(previous_env) < prune_call
          assert 'test -f "$previous_backend/.release.env"' in workflow[previous_floor:prune_call]
          assert '! test -L "$previous_backend/.release.env"' in workflow[previous_floor:prune_call]
          assert 'cmp -s - "$previous_backend/.release.env"' in workflow[previous_floor:prune_call]
          assert prune_call < workflow.index('          release_venv="$release/backend/.venv"')
          main_remote = workflow[workflow.index('          upload_dir="/opt/hi-veblen/staging/run-', workflow.index("      - name: 维护窗口内协调切换并验证")):prune_call]
          expected_release_env = (
              f'          expected_release_env="$(printf \'{release_env_contract}\' '
              '"$expected_backend")"'
          )
          assert expected_release_env in main_remote
          assert 'printf \'%s\\n\' "$expected_release_env" | cmp -s - "$release/backend/.release.env"' in main_remote
          assert main_remote.index('test -e "$maintenance_marker"') < main_remote.index('mkdir -p "$release_root"')
          deploy_step_start = workflow.index("      - name: 维护窗口内协调切换并验证")
          deploy_step_end = workflow.index("      - name: 清理本次远端暂存与未引用发布")
          deploy_run = workflow[workflow.index("        run: |", deploy_step_start):deploy_step_end]
          assert "$" + "{{" not in deploy_run
          assert (
              '          persona_growth_canary_arg="${PERSONA_GROWTH_CANARY_HASHES:--}"'
              in deploy_run
          )
          deploy_invocation = (
              "          ssh hi-veblen-production 'bash -se --' \\\n"
              '            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" \\\n'
              '            "$EXPECTED_ARCHIVE_SHA" "$EXPECTED_PERSONA_SCHEMA_PHASE" \\\n'
              '            "$EXPECTED_PERSONA_GROWTH_PHASE" \\\n'
              '            "$persona_growth_canary_arg" <<\'REMOTE\''
          )
          assert deploy_invocation in deploy_run
