name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Validate production transaction ordering
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/deploy.yml").read_text(encoding="utf-8")
          rollback = workflow[workflow.index("          rollback() {"):workflow.index("          trap rollback EXIT")]
          assert 'test "$nginx_mutated" -eq 1' in rollback
          assert rollback.index("preserve_marker") < rollback.index('exit "$status"')
          assert rollback.index("restore_nginx_backup") < rollback.index("activate_maintenance")
          assert rollback.index("activate_maintenance") < rollback.index("restore_link")
          rollback_remove = rollback.index('rm -f "$maintenance_marker"')
          assert rollback.index("systemctl is-active --quiet myagent-world.service") < rollback_remove
          assert rollback.index("previous_backend_healthy") < rollback_remove
          assert rollback.index("nginx -t") < rollback_remove
          assert rollback.index("nginx_has_maintenance_guards") < rollback_remove
          assert rollback.index("systemctl reload nginx") < rollback_remove
          assert rollback.rindex("stop_services_for_manual_recovery") > rollback_remove
          assert "backup_nginx_has_maintenance_guards" in rollback
          assert rollback.index("nginx_has_maintenance_guards") < rollback.index("systemctl restart myagent-world.service")
          assert rollback.index("previous_backend_healthy") < rollback.rindex("systemctl reload nginx")
          assert rollback.rindex("systemctl reload nginx") < rollback.index("maintenance_public_blocked")
          assert rollback.rindex("maintenance_public_blocked") < rollback_remove
          assert rollback.count("maintenance_public_blocked") >= 2
          prelude_start = workflow.index("          primary_conf=/etc/nginx/sites-available/hi-veblen.com.conf", workflow.index("          trap rollback EXIT"))
          services_stop = workflow.index("          services_stopped=1", prelude_start)
          maintenance_prelude = workflow[prelude_start:services_stop]
          assert maintenance_prelude.index('install -m 0600 /dev/null "$upload_dir/PRESERVE"') < maintenance_prelude.index("nginx_mutated=1")
          assert maintenance_prelude.index("nginx_mutated=1") < maintenance_prelude.index("install -m 0644")
          assert maintenance_prelude.index("systemctl reload nginx") < maintenance_prelude.index("activate_maintenance")
          assert maintenance_prelude.index("activate_maintenance") < maintenance_prelude.index("maintenance_public_blocked")
          assert "nginx_has_maintenance_guards" in maintenance_prelude
          final_remove = workflow.rindex('          rm -f "$maintenance_marker"')
          assert workflow.rindex("http://127.0.0.1:8000/api/session") < final_remove
          assert workflow.rindex("http://127.0.0.1:8000/api/health") < final_remove
          assert "curl " not in workflow[final_remove:workflow.index("          trap - EXIT", final_remove)]
          assert "RELEASE_TRANSACTION=1" in workflow
          assert "拒绝未纳管的 systemd 覆盖" in workflow
          assert workflow.count("-p DropInPaths --value") >= 3
          prune_call = workflow.index('          bash "$release/prune-production-releases.sh"')
          assert workflow.index('          previous_backend="$(readlink -f "$backend_current")"') < prune_call
          assert prune_call < workflow.index('          release_venv="$release/backend/.venv"')
          main_remote = workflow[workflow.index('          upload_dir="/opt/hi-veblen/staging/run-', workflow.index("      - name: 维护窗口内协调切换并验证")):prune_call]
          assert main_remote.index('test -e "$maintenance_marker"') < main_remote.index('mkdir -p "$release_root"')
          deploy_step_start = workflow.index("      - name: 维护窗口内协调切换并验证")
          deploy_step_end = workflow.index("      - name: 清理本次远端暂存与未引用发布")
          deploy_run = workflow[workflow.index("        run: |", deploy_step_start):deploy_step_end]
          assert "$" + "{{" not in deploy_run
          deploy_invocation = (
              "          ssh hi-veblen-production 'bash -se --' \\\n"
              '            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" \\\n'
              '            "$EXPECTED_ARCHIVE_SHA" <<\'REMOTE\''
          )
          assert deploy_invocation in deploy_run
          assert (
              '          run_id="$1"\n'
              '          run_attempt="$2"\n'
              '          portal_revision="$3"\n'
              '          expected_archive_sha="$4"'
          ) in deploy_run
          assert "bash -se -- deploy" not in deploy_run
          preflight = workflow[workflow.index("      - name: 拒绝未纳管的 systemd 覆盖"):workflow.index("      - name: 创建私有暂存目录")]
          assert "myagent-world.service myagent-gateway.service" in preflight
          assert "test -n \"$dropins\"" in preflight
          assert 'test -e "$maintenance_marker"' in preflight
          assert 'test -e "$preserve_marker"' in preflight and "preserved_staging" in preflight
          cleanup = workflow[workflow.index("      - name: 清理本次远端暂存与未引用发布"):]
          assert "if:" in cleanup and "always()" in cleanup and "configure-ssh.outcome" in cleanup
          cleanup_invocation = (
              "          ssh hi-veblen-production 'bash -se --' \\\n"
              '            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" <<\'REMOTE\''
          )
          assert cleanup_invocation in cleanup
          assert (
              '          run_id="$1"\n'
              '          run_attempt="$2"\n'
              '          portal_revision="$3"'
          ) in cleanup
          assert "bash -se -- cleanup" not in cleanup
          assert cleanup.index('test -e "$maintenance_marker"') < cleanup.index('rm -rf --one-file-system -- "$release"')
          assert cleanup.index('test -e "$preserve_marker"') < cleanup.index('rm -rf --one-file-system -- "$release"')
          assert 'test -L "$upload_dir/PRESERVE"' in cleanup
          assert 'test "$(dirname -- "$target")" = "$release"' in cleanup
          staging_prune = main_remote.index('          bash "$release/prune-production-staging.sh"')
          assert main_remote.index('test -e "$maintenance_marker"') < staging_prune
          print("production transaction ordering OK")
          PY

      - name: Test remote argument mapping
        shell: bash
        run: |
          set -euo pipefail
          mapped="$(printf '%s' 'printf "%s|%s|%s|%s" "$1" "$2" "$3" "$4"' | \
            "$BASH" -se -- 29160903633 1 \
              aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
              bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb)"
          test "$mapped" = \
            "29160903633|1|aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa|bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"

      - name: Test release retention guard
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/prune-production-releases.sh
          tmp="$(mktemp -d)"
          trap 'rm -rf -- "$tmp"' EXIT
          root="$tmp/releases"
          mkdir -p "$root"
          for n in 1 2 3 4 5 6 7; do
            mkdir -p "$root/release-$n"
            touch -d "@$n" "$root/release-$n"
          done
          mkdir -p "$root/release-unsafe name"
          bash scripts/prune-production-releases.sh \
            "$root" 3 "$root/release-7" "$root/release-2"
          for n in 2 5 6 7; do test -d "$root/release-$n"; done
          for n in 1 3 4; do test ! -e "$root/release-$n"; done
          test -d "$root/release-unsafe name"
          if bash scripts/prune-production-releases.sh "$tmp/not-releases" 3 "$root/release-7"; then
            echo "异常 release 根目录未被拒绝" >&2
            exit 1
          fi

      - name: Test staging retention guard
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/prune-production-staging.sh
          tmp="$(mktemp -d)"
          trap 'rm -rf -- "$tmp"' EXIT
          root="$tmp/staging"
          outside="$tmp/outside"
          mkdir -p "$root/run-9-1" "$root/run-8-1" "$root/run-invalid-1" "$outside"
          ln -s "$outside" "$root/run-7-1"
          bash scripts/prune-production-staging.sh "$root" "$root/run-9-1"
          test -d "$root/run-9-1"
          test ! -e "$root/run-8-1"
          test -d "$root/run-invalid-1"
          test -L "$root/run-7-1"
          test -d "$outside"
          mkdir -p "$root/run-6-1" "$root/run-5-1"
          touch "$root/run-6-1/PRESERVE"
          if bash scripts/prune-production-staging.sh "$root" "$root/run-9-1"; then
            echo "staging 保护标记未阻止回收" >&2
            exit 1
          fi
          test -d "$root/run-6-1"
          test -d "$root/run-5-1"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Test portal contract
        run: npm run test -- src/views/__tests__/Home.test.ts

      - name: Build portal
        run: npm run build:skip-check
        env:
          VITE_LINGXI_URL: https://lingxi.hi-veblen.com/

      - name: Upload portal artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portal-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  admin-quality:
    name: Admin quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            src/admin/frontend/package-lock.json
            src/admin/backend/package-lock.json

      - name: Install admin dependencies
        run: |
          npm ci --prefix src/admin/frontend
          npm ci --prefix src/admin/backend

      - name: Check admin frontend
        run: |
          npm run type-check --prefix src/admin/frontend
          npm run test:run --prefix src/admin/frontend
          npm run build --prefix src/admin/frontend

      - name: Build admin backend
        shell: bash
        run: |
          npm run build --prefix src/admin/backend
          test -s src/admin/backend/dist/app.js
          test -z "$(find src/admin/backend/dist -type f -path '*__tests__*' -print -quit)"
          node -e "const c=require('./src/admin/backend/ecosystem.config.js'); const a=c.apps?.[0]; if (!a?.node_args?.includes('--env-file=.env') || c.deploy) process.exit(1)"
          node -e "const p=require('./src/admin/backend/package.json'); if (!p.scripts?.['db:init']?.includes('--env-file=.env')) process.exit(1)"
          grep -Fq 'node --env-file=.env dist/database/init.js' src/admin/deploy.sh
          if NODE_ENV=production JWT_SECRET=replace-with-a-secret \
            node -e "require('./src/admin/backend/dist/config/jwt.js')"; then
            echo '生产 JWT 占位值未被拒绝' >&2
            exit 1
          fi
          NODE_ENV=production JWT_SECRET=ci-only-7Fq2mN9xR4vK8pL3sT6wY1zC5dH0jB node \
            -e "require('./src/admin/backend/dist/config/jwt.js')"
          if NODE_ENV=production ADMIN_USERNAME=replace-with-admin \
            ADMIN_PASSWORD=replace-with-password node -e \
            "require('./src/admin/backend/dist/database/init.js').getInitialAdminCredentials()"; then
            echo '生产管理员占位凭据未被拒绝' >&2
            exit 1
          fi
          NODE_ENV=production ADMIN_USERNAME=ci-admin \
            ADMIN_PASSWORD=ci-only-8Gv3nR0yP5wM2tK7sX4dQ9hL node -e \
            "require('./src/admin/backend/dist/database/init.js').getInitialAdminCredentials()"

  portal-e2e:
    name: Portal E2E
    runs-on: ubuntu-latest
    needs: release-gate
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download portal artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: portal-dist
          path: dist

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run portal smoke
        run: npx playwright test e2e/art-museum-experience.spec.ts --project=chromium
        env:
          VITE_LINGXI_URL: https://lingxi.hi-veblen.com/

      - name: Upload failed test report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 3

  legacy-diagnostics:
    name: Legacy diagnostics (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/admin/backend/package-lock.json

      - name: Install diagnostic dependencies
        run: |
          npm ci
          npm ci --prefix src/admin/backend

      - name: Run inherited full-suite diagnostics
        shell: bash
        run: |
          set +e
          npx eslint . --ext .vue,.js,.jsx,.cjs,.mjs,.ts,.tsx,.cts,.mts
          lint_status=$?
          npm run test
          root_test_status=$?
          npm test --prefix src/admin/backend -- --runInBand
          backend_test_status=$?
          printf 'lint=%s root_tests=%s backend_tests=%s\n' \
            "$lint_status" "$root_test_status" "$backend_test_status"
          if test "$lint_status" -ne 0 || \
            test "$root_test_status" -ne 0 || \
            test "$backend_test_status" -ne 0; then
            echo "::warning::Legacy diagnostics remain non-blocking: lint=$lint_status root_tests=$root_test_status backend_tests=$backend_test_status"
          fi
