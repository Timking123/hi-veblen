name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Validate production transaction ordering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflow = Path(".github/workflows/deploy.yml").read_text(encoding="utf-8")
          acceptance = Path(
              ".github/workflows/d050-production-acceptance.yml"
          ).read_text(encoding="utf-8")
          acceptance_spec = Path(
              "e2e/d050-production-acceptance.spec.ts"
          ).read_text(encoding="utf-8")
          synthetic_helper = Path(
              "scripts/d050_prepare_synthetic.py"
          ).read_text(encoding="utf-8")
          rotation_helper = Path(
              "scripts/d050_rotate_synthetic_token.py"
          ).read_text(encoding="utf-8")
          assert "group: hi-veblen-production" in workflow
          assert "group: hi-veblen-production" in acceptance
          assert "github.triggering_actor == 'Timking123'" in acceptance
          assert "    timeout-minutes: 130" in acceptance
          assert "        default: auto" in acceptance
          assert "        default: prepare_review" in acceptance
          assert "recover_delete" in acceptance
          assert "rotate_token" in acceptance
          assert acceptance.count("auto|p6_load_a") >= 2
          assert 'candidate = "p6_load_a"' in acceptance
          assert acceptance.count('test "$persist_id" = "p6_load_a"') >= 2
          assert "p6_load_b" not in acceptance
          assert "p6_load_c" not in acceptance
          assert "p6_e2e_current" not in acceptance
          assert 'D050_PRIMARY_TOKEN_B64' in synthetic_helper
          assert 'p6_load_a' in synthetic_helper
          assert 'p6_load_b' not in synthetic_helper
          assert 'p6_load_c' not in synthetic_helper
          assert 'unrevoke' not in synthetic_helper.lower()
          assert 'BRAIN_GATEWAY_USER_TOKENS' not in synthetic_helper
          assert 'unrevoke' not in rotation_helper.lower()
          assert 'BRAIN_GATEWAY_USER_TOKENS' in rotation_helper
          assert 'secrets.token_urlsafe(48)' in rotation_helper
          assert 'old_revocation_retained' in rotation_helper
          assert 'old_token_rejected' in rotation_helper
          assert 'rollback_restored' in rotation_helper
          assert 'config_backup_created' in rotation_helper
          assert 'other_token_bindings_preserved' in rotation_helper
          assert 'RECEIPT_SCHEMA = "d050-token-rotation-v1"' in rotation_helper
          assert '"new_env_sha256"' in rotation_helper
          assert '"state": "prepared"' in rotation_helper
          assert '"rollback_pending"' in rotation_helper
          assert '"receipt_state": "verified"' in rotation_helper
          assert 'strict_environment=False' in rotation_helper
          assert 'MAX_BACKUPS = 7' in rotation_helper
          assert '["systemctl", "stop", "myagent-gateway.service"]' in rotation_helper
          assert '"gateway_stopped_for_manual_recovery"' in rotation_helper
          assert rotation_helper.count('_verify_login_rejected(base_url, old_token)') >= 2
          assert '"locked_prewrite_revision_ok"' in rotation_helper
          assert rotation_helper.index(
              'release_file = Path("/opt/myagent/backend-current/release.txt")'
          ) < rotation_helper.index(
              'if receipt is not None and receipt["state"] == "rollback_pending":'
          )
          assert 'SESSION_COOKIE_NAME = "__Host-lingxi_session"' in rotation_helper
          assert 'session["path"] == "/"' in rotation_helper
          assert 'not session["domain"]' in rotation_helper
          assert 'session["samesite"]' in rotation_helper
          assert '"/compare"' not in synthetic_helper
          assert 'presets[0]["id"] == "linxi"' in synthetic_helper
          assert 'role.get("mode") == "wizard"' in synthetic_helper
          assert 'not str(current.get("revoked_at") or "")' in synthetic_helper
          assert 'not str(consent.get("withdrawn_at") or "")' in synthetic_helper
          assert 'review_phase == "prepare_review"' in synthetic_helper
          assert 'review_phase == "confirm_review"' in synthetic_helper
          assert 'isinstance(accepted, bool)' in synthetic_helper
          assert 'review_set_sha256' in synthetic_helper
          assert 'D050_REVIEW_DECISION_B64' in synthetic_helper
          assert 'D050_AUDITION_KEY' in synthetic_helper
          assert 'test "$EXPECTED_PORTAL_REVISION" = "$EXPECTED_HEAD_SHA"' in acceptance
          assert (
              'test "$EXPECTED_BACKEND_REVISION" = "$locked_backend_revision"'
              in acceptance
          )
          prewrite_revision = acceptance.index(
              "      - name: 首次生产写前复核三处 backend revision"
          )
          backup_step = acceptance.index("      - name: 在首次生产写前创建并验证备份")
          rotation_step = acceptance.index("      - name: 轮换撤销后的 p6_load_a 凭证")
          helper_step = acceptance.index("      - name: 通过产品 API 准备 p6_load_a")
          review_artifact = acceptance.index("      - name: 保存待人工审核材料")
          review_encryption = acceptance.index("      - name: 加密待人工审核材料")
          review_gate = acceptance.index("      - name: 等待人工留出审核")
          binding_check = acceptance.index("      - name: 复核 p6_load_a 私有身份绑定")
          budget_step = acceptance.index("      - name: 提高活跃灰测额度")
          browser_step = acceptance.index("      - name: 运行生产真实 Chromium 全链")
          first_ssh_cleanup = acceptance.index(
              "      - name: 在浏览器执行前清除生产 SSH 凭据"
          )
          post_ssh_config = acceptance.index(
              "      - name: 为后置复核重新配置受信 SSH"
          )
          deletion_state = acceptance.index("      - name: 复核并续做整用户删除")
          final_ssh_cleanup = acceptance.index(
              "      - name: 清除后置生产 SSH 凭据"
          )
          artifact_upload = acceptance.index("      - name: 保存非敏感验收证据")
          failure_artifact = acceptance.index("      - name: 保存失败诊断证据")
          assert prewrite_revision < backup_step < rotation_step < helper_step
          assert helper_step < review_encryption < review_artifact < review_gate
          assert review_gate < binding_check < budget_step
          assert budget_step < first_ssh_cleanup < browser_step
          assert browser_step < post_ssh_config < deletion_state
          assert deletion_state < final_ssh_cleanup < artifact_upload
          assert acceptance.count('rm -f "$HOME/.ssh/hi-veblen-deploy"') == 2
          artifact = acceptance[artifact_upload:failure_artifact]
          assert "inputs.review_phase == 'confirm_review' && success()" in artifact
          assert "d050-growth-lock-diagnostic.json" not in artifact
          assert "d050-prewrite-revision-evidence.json" in artifact
          assert "d050-production-backup-evidence.json" in artifact
          assert "d050-gray-budget-evidence.json" in artifact
          assert "d050-synthetic-preparation-evidence.json" in artifact
          assert "d050-holdout-review-confirmation.json" in artifact
          assert "d050-delete-state-evidence.json" in artifact
          assert "d050-holdout-review.tar.gz.gpg" in acceptance[review_encryption:review_gate]
          assert "D050_REVIEW_ARTIFACT_KEY" in acceptance[review_encryption:review_artifact]
          assert "github.run_id" in acceptance[helper_step:review_encryption]
          assert "github.run_attempt" not in acceptance[helper_step:review_encryption]
          assert "exit 78" not in acceptance
          assert acceptance.count("inputs.review_phase == 'confirm_review'") >= 5
          browser_dependencies = acceptance[
              acceptance.index("      - name: 设置 Node.js"):prewrite_revision
          ]
          assert browser_dependencies.count(
              "inputs.review_phase == 'prepare_review' || inputs.review_phase == 'confirm_review'"
          ) == 2
          post_ssh = acceptance[post_ssh_config:deletion_state]
          assert "inputs.review_phase == 'confirm_review'" in post_ssh
          assert "inputs.review_phase == 'recover_delete' && success()" in post_ssh
          failed_artifact = acceptance[failure_artifact:]
          assert "d050-holdout-review-request.json" not in failed_artifact
          assert "d050-holdout-review-decision.json" not in failed_artifact
          assert "if: $" + "{{ failure() }}" in failed_artifact
          assert "d050-growth-lock-diagnostic.json" in failed_artifact
          assert "d050-prewrite-revision-evidence.json" in failed_artifact
          assert "d050-holdout-review.tar.gz.gpg" in failed_artifact
          assert "d050-delete-state-evidence.json" in failed_artifact
          assert "d050-token-rotation-evidence.json" in failed_artifact
          backup = acceptance[backup_step:rotation_step]
          rotation = acceptance[rotation_step:helper_step]
          budget = acceptance[budget_step:first_ssh_cleanup]
          assert "systemctl start lingxi-backup.service" in backup
          assert "timeout 20m sudo systemctl start" in backup
          assert "backup_data.py" in backup and 'verify "/opt/myagent/backups/$latest"' in backup
          assert "inputs.review_phase == 'rotate_token'" in rotation
          assert "d050-production-backup-evidence.json" in rotation
          assert "scripts/d050_rotate_synthetic_token.py" in rotation
          assert "EXPECTED_CURRENT_HASH" in rotation
          assert "d050-token-rotation-public-evidence.json" in rotation
          assert "::add-mask::" not in rotation
          assert "exec 9>/run/hi-veblen-release.lock" in rotation
          assert "flock -n 9" in rotation
          assert "/run/myagent-release-maintenance" in rotation
          assert "/run/hi-veblen-release-lease" in rotation
          assert "DropInPaths" in rotation
          assert "/var/backups/myagent-d050-token-rotation" in rotation
          assert "validate_release_health.py current" in rotation
          assert './.venv/bin/python -P -B "$remote_script"' in rotation
          assert rotation.count(
              r"^/tmp/d050-rotate-token\.[A-Za-z0-9]{8}\.py$"
          ) >= 3
          assert 'ssh hi-veblen-production "sudo rm -f' not in rotation
          assert 'remove_remote_script "$remote_script"' in rotation
          assert 'evidence.get("old_token_rejected") is True' in rotation
          assert 'evidence.get("receipt_persisted") is True' in rotation
          assert 'evidence.get("receipt_state") == "verified"' in rotation
          assert 'evidence.get("locked_prewrite_revision_ok") is True' in rotation
          assert rotation.index("flock -n 9") < rotation.index(
              'test "$(cat /opt/myagent/backend-current/release.txt)"'
          ) < rotation.index(
              './.venv/bin/python -P -B "$remote_script"'
          )
          assert '"rollback_recovery_pending": recovery_pending' in acceptance
          assert 'receipt.get("state") == "rollback_pending"' in acceptance
          assert "100_000_000" in budget
          assert '{"budget": {"daily_token_limit": limit}}' in budget
          assert "save_user_config" in budget
          assert "rollback_restored" in budget
          assert "gray_user_state_changed_while_locking" in budget
          assert '"backup_created"' not in budget
          assert '"BAD": bad' in budget
          assert "parse_user_token_map" in acceptance[prewrite_revision:helper_step]
          deletion = acceptance[deletion_state:final_ssh_cleanup]
          assert "is_gateway_token_revoked" in deletion
          assert "/api/users/" in deletion
          assert 'state = "retryable_ready"' in deletion
          assert '"ready_cleanup_blocked"' in deletion
          assert '"delete_recovery"' in acceptance
          assert '"token_rotation_ready"' in acceptance
          assert '"token_rotation"' in acceptance
          assert '"private_resumed"' in acceptance
          assert "d050-delete-recovery-" in acceptance
          assert 'test "$primary_token" = -' in acceptance
          assert 'test "$delete_token" = -' in acceptance
          assert "if revoked:" in deletion
          assert "if revoked and (user_dir.exists()" not in deletion
          assert 'gateway_report.get("deleted") is True' in deletion
          assert 'gateway_report.get("audit_retained") is True' in deletion
          rotation_artifact = acceptance.index("      - name: 保存合成用户凭证轮换证据")
          assert rotation_artifact < failure_artifact
          rotation_upload = acceptance[rotation_artifact:failure_artifact]
          assert "inputs.review_phase == 'rotate_token' && success()" in rotation_upload
          assert "d050-token-rotation-evidence.json" in rotation_upload
          assert "d050-token-rotation-public-evidence.json" in rotation_upload
          for stage in ("initial", "before_delete", "after_delete"):
              assert f"recordRevisionCheck(evidence, '{stage}')" in acceptance_spec
          assert "expect(lingxiRevision).toBe(expectedBackendRevision)" in acceptance_spec
          assert "expect(observerBeforeDelete.status()).toBe(200)" in acceptance_spec
          assert "expect(priorSessionStatus.status()).toBe(401)" in acceptance_spec
          assert "await observerContext.addCookies(await context.cookies())" in acceptance_spec
          assert "const BOOTSTRAP_HTTP_ERRORS = [{ status: 401, path: '/api/me' }]" in acceptance_spec
          assert "{ status: 410, path: '/api/persona/calibration' }" in acceptance_spec
          assert "expect(consoleErrors.unexpected).toEqual([])" in acceptance_spec
          assert "expected_http_console_error_count" in acceptance_spec
          deploy_header = workflow[
              workflow.index("  deploy:"):
              workflow.index("    steps:", workflow.index("  deploy:"))
          ]
          deploy_timeout = re.search(r"^    timeout-minutes: ([0-9]+)$", deploy_header, re.MULTILINE)
          assert deploy_timeout is not None
          # continuity 最长 1800 秒，自动回滚最长 300 秒，另留 15 分钟给安装与验收。
          assert int(deploy_timeout.group(1)) * 60 >= 1800 + 300 + 15 * 60
          nginx_guard = (
              "          python3 scripts/validate_release_nginx.py \\\n"
              "            release-package/backend/ops/nginx/hi-veblen.com.http.conf"
          )
          nginx_guard_start = workflow.index(nginx_guard)
          assert workflow.index('git -C lingxi-source archive --format=tar') < nginx_guard_start
          assert nginx_guard_start < workflow.index('tar -C release-package -czf portal-dist.tar.gz')
          assert 'test -L release-package/backend/ops/apparmor/myagent-persona-parser; then' in workflow
          assert 'test ! -L release-package/backend/ops/apparmor/myagent-persona-parser' in workflow
          assert 'test -f release-package/backend/ops/apparmor/myagent-persona-parser' in workflow
          assert 'test -s release-package/backend/ops/apparmor/myagent-persona-parser' in workflow
          health_validator_install = (
              "          install -m 0755 scripts/validate_release_health.py \\\n"
              "            release-package/validate_release_health.py"
          )
          assert workflow.index(health_validator_install) < workflow.index('tar -C release-package -czf portal-dist.tar.gz')
          assert 'test -x release-package/validate_release_health.py' in workflow
          core = Path("scripts/release_transaction.py").read_text(encoding="utf-8")
          driver = Path("scripts/production-release-transaction.sh").read_text(encoding="utf-8")
          assert "LINGXI_WORLD_LEDGER_SCHEMA_CAPABILITY=dual-read-v2-preserve" in workflow
          assert "EXPECTED_WORLD_LEDGER_SCHEMA_PHASE: compat" in workflow
          for name in ("release_transaction.py", "production-release-transaction.sh"):
              assert "install -m 0755 scripts/" + name in workflow
          assert "scripts/release_transaction.py policy" in workflow
          assert "从独立受信制品验证全部历史事务" in workflow
          assert "python3 -I -B - history" in workflow
          assert 'exec bash "$release/production-release-transaction.sh" deploy' in workflow
          assert "trap rollback EXIT" not in workflow
          assert 'previous_portal="$(readlink -f' not in workflow
          assert "prune-production-releases.sh\" \\" not in workflow
          assert 'expected_world_ledger_phase="$8"' in workflow
          assert '"$persona_growth_canary_arg" "$EXPECTED_WORLD_LEDGER_SCHEMA_PHASE"' in workflow
          assert "RELEASE_TRANSACTION" in core and "LINGXI_WORLD_LEDGER_SCHEMA_PHASE" in core
          assert "persona_growth_applies_for" in core and "PRAGMA table_info(conversation_events)" in core
          assert "EnvironmentFiles" in core and "后加载环境文件定义了发布保留键" in core
          assert 'exec /usr/bin/python3 -I -B "$control_dir/release_transaction.py"' in driver
          for helper in ("capture_previous", "verify_previous", "restore_previous", "finalize_transaction"):
              assert "def " + helper + "(*," in core
          # 状态、fd、故障及清理资格由下一步真实 Linux 测试验证，避免绑定旧 shell 内存标志。
          preflight = workflow[workflow.index("      - name: 拒绝未纳管的 systemd 覆盖"):workflow.index("      - name: 创建私有暂存目录")]
          assert "myagent-world.service myagent-gateway.service" in preflight
          assert "test -n \"$dropins\"" in preflight
          assert 'test -e "$maintenance_marker"' in preflight
          assert 'test -e "$preserve_marker"' in preflight and "preserved_staging" in preflight
          assert 'lease_tmp="$(mktemp -d ' in preflight
          assert 'printf \'%s\\n\' "$lease_owner" > "$lease_tmp/owner"' in preflight
          assert 'mv -T -- "$lease_tmp" "$lease_dir"' in preflight
          assert "trap cleanup_lease_tmp EXIT" in preflight
          assert (
              '"$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" <<\'REMOTE\''
              in preflight
          )
          assert 'portal_revision="$3"' in preflight
          backup_start = preflight.index("config_backup_root=")
          backup = preflight[backup_start:]
          assert 'config_backup_dir="$config_backup_root/run-$run_id-$run_attempt-$portal_revision"' in backup
          for required in (
              "/opt/myagent/.env",
              "/etc/systemd/system/myagent-world.service",
              "/etc/systemd/system/myagent-gateway.service",
              "/etc/apparmor.d/myagent-persona-parser",
              "/etc/nginx/sites-available",
              "/etc/nginx/sites-enabled",
              "/etc/lingxi-ops/ops.env",
          ):
              assert required in backup
          required_configs = backup[
              backup.index("required_config_paths=("):backup.index("archive_paths=()")
          ]
          assert "/etc/apparmor.d/myagent-persona-parser" not in required_configs
          assert "apparmor_profile_state=absent" in backup
          assert "apparmor_profile_state=present" in backup
          assert "ops_env_state=absent" in backup
          assert "ops_env_state=present" in backup
          assert (
              backup.index("apparmor_profile_state=absent")
              < backup.index('if test -e "$apparmor_profile_path"')
              < backup.index('stage_regular_config "$apparmor_profile_path"')
              < backup.index("apparmor_profile_state=present")
          )
          assert (
              backup.index("ops_env_state=absent")
              < backup.index('if test -e "$ops_env_path"')
              < backup.index('stage_regular_config "$ops_env_path"')
              < backup.index("ops_env_state=present")
          )
          assert 'test "$(id -u)" -ne 0' in preflight
          assert 'root:root:700' in backup and 'root:root:600' in backup
          assert "backups_parent_mode=" in backup
          assert "8#$backups_parent_mode & 0022" in backup
          trap_registration = backup.index("trap cleanup_config_backup_tmp EXIT")
          temporary_directory = backup.index('config_backup_tmp="$(mktemp -d')
          assert trap_registration < temporary_directory
          snapshot_copy = backup.index("cp --archive --no-dereference")
          archive_creation = backup.index("tar --create --gzip --file")
          assert temporary_directory < snapshot_copy < archive_creation
          assert 'cmp -s -- "$path" "$staged_path"' in backup
          assert "validate_nginx_config_tree" in backup
          assert "diff --brief --recursive --no-dereference" in backup
          assert 'test "$(dirname -- "$target")" != \\' in backup
          assert '--directory "$config_backup_snapshot"' in backup
          assert "--directory /" not in backup
          assert 'rm -rf --one-file-system -- "$config_backup_snapshot"' in backup
          assert 'tar --create --gzip --file' in backup
          assert 'sha256sum config.tar.gz metadata.txt > SHA256SUMS' in backup
          assert 'sha256sum --check SHA256SUMS' in backup
          assert "apparmor_profile=%s\\nops_env=%s" in backup
          validator = backup[
              backup.index("validate_config_backup_payload() {"):
              backup.index('          for path in "${required_config_paths[@]}"; do')
          ]
          for required in (
              "tarfile.open",
              "manifest_entries",
              "metadata 路径集合无效",
              "归档包含越界路径",
              "sites-enabled 链接越界",
          ):
              assert required in validator
          published_validation = backup.index(
              'validate_config_backup_payload "$config_backup_dir" "$config_backup_name"'
          )
          atomic_publish = backup.index(
              'mv -T -- "$config_backup_tmp" "$config_backup_dir"'
          )
          published_tmp_reset = backup.index(
              'config_backup_tmp=""', atomic_publish
          )
          durable_sync = backup.index(
              'sync -f "$config_backup_dir/config.tar.gz"'
          )
          retention_start = backup.index("config_backup_retention=30")
          retention_delete = backup.index('rmdir -- "$backup_path"')
          success_log = backup.index('printf \'持久生产配置备份已创建：')
          assert (
              archive_creation
              < atomic_publish
              < published_tmp_reset
              < published_validation
              < durable_sync
              < retention_start
              < retention_delete
              < success_log
          )
          assert "^run-[0-9]+-[0-9]+-[0-9a-f]{40}$" in backup
          retention = backup[retention_start:retention_delete]
          retention_guard = (
              'if test "$backup_name" = "$config_backup_name" || \\\n'
              '                  test "$backup_name" = "$latest_backup_name" || \\\n'
              '                  test "$valid_backup_rank" -le "$config_backup_retention"; then'
          )
          assert retention_guard in retention
          assert "backup_member_count=" in retention
          assert "test \"$backup_member_count\" -ne 3" in retention
          assert (
              'validate_config_backup_payload "$backup_path" "$backup_name"'
              in retention
          )
          assert 'rm -rf --one-file-system -- "$backup_path"' not in backup
          assert 'rm -f -- "$backup_path/config.tar.gz"' in backup
          assert 'rmdir -- "$backup_path"' in backup
          lease_publish = preflight.index('mv -T -- "$lease_tmp" "$lease_dir"')
          assert lease_publish < backup_start
          staging = workflow[workflow.index("      - name: 创建私有暂存目录"):workflow.index("      - name: 上传发布包")]
          assert 'install -m 0600 /dev/null "$upload_dir/PRESERVE"' in staging
          assert 'sync -f "$upload_dir/PRESERVE"' in staging
          assert "sync -f /opt/hi-veblen/staging" in staging
          cleanup = workflow[workflow.index("      - name: 保留失败事务并提示共享恢复入口"):]
          assert "always()" in cleanup and " recover <txn_id>" in cleanup
          assert "rm -rf" not in cleanup
          assert "lease_dir/owner" not in cleanup
          print("production transaction ordering OK")
          PY

      - name: Validate D050 synthetic helper
        run: |
          python3 -m py_compile scripts/d050_prepare_synthetic.py
          python3 scripts/d050_prepare_synthetic.py --self-test

      - name: Validate D050 token rotation helper
        run: |
          python3 -m py_compile scripts/d050_rotate_synthetic_token.py
          python3 scripts/d050_rotate_synthetic_token.py --self-test

      - name: Test production config backup retention
        shell: bash
        run: |
          set -euo pipefail
          test_script="$RUNNER_TEMP/production-config-retention.sh"
          trap 'rm -f -- "$test_script"' EXIT
          PYTHONUTF8=1 python3 - "$test_script" <<'PY'
          from pathlib import Path
          import sys

          workflow = Path(".github/workflows/deploy.yml").read_text(encoding="utf-8")
          validator_start = workflow.index(
              "          validate_config_backup_payload() {"
          )
          validator_end = workflow.index(
              '          for path in "${required_config_paths[@]}"; do',
              validator_start,
          )
          start = workflow.index("          config_backup_retention=30")
          end = workflow.index(
              "          printf '持久生产配置备份已创建：", start
          )
          validator = "\n".join(
              line[10:]
              for line in workflow[validator_start:validator_end].splitlines()
          )
          retention = "\n".join(
              line[10:] for line in workflow[start:end].splitlines()
          )
          fixture = r'''set -euo pipefail
          fixture_root="$(mktemp -d)"
          trap 'rm -rf --one-file-system -- "$fixture_root"' EXIT
          config_backup_root="$fixture_root/backups"
          install -d -o root -g root -m 0700 "$config_backup_root"
          snapshot="$fixture_root/snapshot"
          install -d "$snapshot/opt/myagent" \
            "$snapshot/etc/systemd/system" \
            "$snapshot/etc/nginx/sites-available" \
            "$snapshot/etc/nginx/sites-enabled"
          printf 'test env\n' > "$snapshot/opt/myagent/.env"
          printf 'world unit\n' > "$snapshot/etc/systemd/system/myagent-world.service"
          printf 'gateway unit\n' > "$snapshot/etc/systemd/system/myagent-gateway.service"
          printf 'server config\n' > "$snapshot/etc/nginx/sites-available/lingxi.conf"
          ln -s ../sites-available/lingxi.conf \
            "$snapshot/etc/nginx/sites-enabled/lingxi.conf"
          tar --create --gzip --file "$fixture_root/valid-config.tar.gz" \
            --directory "$snapshot" -- \
            opt/myagent/.env \
            etc/systemd/system/myagent-world.service \
            etc/systemd/system/myagent-gateway.service \
            etc/nginx/sites-available \
            etc/nginx/sites-enabled
          write_metadata() {
            dir="$1"
            run_id="$2"
            revision="$3"
            ops_state="$4"
            printf '%s\n' \
              'schema=myagent-production-config-backup-v1' \
              'created_at_utc=2026-07-29T00:00:00Z' \
              "github_run_id=$run_id" \
              'github_run_attempt=1' \
              "portal_revision=$revision" \
              'apparmor_profile=absent' \
              "ops_env=$ops_state" \
              'path=opt/myagent/.env' \
              'path=etc/systemd/system/myagent-world.service' \
              'path=etc/systemd/system/myagent-gateway.service' \
              'path=etc/nginx/sites-available' \
              'path=etc/nginx/sites-enabled' \
              > "$dir/metadata.txt"
            if test "$ops_state" = present; then
              printf '%s\n' 'path=etc/lingxi-ops/ops.env' >> "$dir/metadata.txt"
            fi
          }
          finish_backup() {
            dir="$1"
            (cd "$dir" && sha256sum config.tar.gz metadata.txt > SHA256SUMS)
            chmod 0600 "$dir/config.tar.gz" "$dir/metadata.txt" "$dir/SHA256SUMS"
          }
          make_backup() {
            n="$1"
            sha="$(printf '%040x' "$n")"
            dir="$config_backup_root/run-$n-1-$sha"
            install -d -o root -g root -m 0700 "$dir"
            cp "$fixture_root/valid-config.tar.gz" "$dir/config.tar.gz"
            write_metadata "$dir" "$n" "$sha" absent
            finish_backup "$dir"
            touch -d "@$n" "$dir"
          }
          for n in $(seq 1 33); do
            make_backup "$n"
          done

          empty_sha="$(printf '%040x' 34)"
          empty="$config_backup_root/run-34-1-$empty_sha"
          install -d -o root -g root -m 0700 "$empty"
          tar --create --gzip --file "$empty/config.tar.gz" --files-from /dev/null
          write_metadata "$empty" 34 "$empty_sha" absent
          finish_backup "$empty"
          touch -d '@34' "$empty"

          mismatch_sha="$(printf '%040x' 35)"
          mismatch="$config_backup_root/run-35-1-$mismatch_sha"
          install -d -o root -g root -m 0700 "$mismatch"
          cp "$fixture_root/valid-config.tar.gz" "$mismatch/config.tar.gz"
          write_metadata "$mismatch" 35 "$mismatch_sha" present
          finish_backup "$mismatch"
          touch -d '@35' "$mismatch"

          extra_sha="$(printf '%040x' 36)"
          extra="$config_backup_root/run-36-1-$extra_sha"
          install -d -o root -g root -m 0700 "$extra"
          cp "$fixture_root/valid-config.tar.gz" "$extra/config.tar.gz"
          write_metadata "$extra" 36 "$extra_sha" absent
          finish_backup "$extra"
          printf 'manual recovery material\n' > "$extra/EXTRA"
          chmod 0600 "$extra/EXTRA"
          touch -d '@36' "$extra"

          traversal_sha="$(printf '%040x' 37)"
          traversal="$config_backup_root/run-37-1-$traversal_sha"
          symlink_sha="$(printf '%040x' 38)"
          symlink="$config_backup_root/run-38-1-$symlink_sha"
          install -d -o root -g root -m 0700 "$traversal" "$symlink"
          python3 - "$fixture_root/valid-config.tar.gz" \
            "$traversal/config.tar.gz" "$symlink/config.tar.gz" <<'MAKE_ARCHIVES'
          import copy
          import io
          import sys
          import tarfile

          source_path, traversal_path, symlink_path = sys.argv[1:]

          def rewrite(destination, *, bad_symlink=False, add_traversal=False):
              with tarfile.open(source_path, "r:gz") as source, tarfile.open(
                  destination, "w:gz"
              ) as target:
                  for original in source.getmembers():
                      member = copy.copy(original)
                      if bad_symlink and member.name == (
                          "etc/nginx/sites-enabled/lingxi.conf"
                      ):
                          member.linkname = "/opt/myagent/.env"
                      payload = source.extractfile(original) if original.isreg() else None
                      target.addfile(member, payload)
                  if add_traversal:
                      member = tarfile.TarInfo("etc/nginx/sites-available/..")
                      member.size = 1
                      target.addfile(member, io.BytesIO(b"x"))

          rewrite(traversal_path, add_traversal=True)
          rewrite(symlink_path, bad_symlink=True)
          MAKE_ARCHIVES
          write_metadata "$traversal" 37 "$traversal_sha" absent
          write_metadata "$symlink" 38 "$symlink_sha" absent
          finish_backup "$traversal"
          finish_backup "$symlink"
          touch -d '@37' "$traversal"
          touch -d '@38' "$symlink"

          digest_sha="$(printf '%040x' 39)"
          digest="$config_backup_root/run-39-1-$digest_sha"
          make_backup 39
          bad_digest="$(printf '%064d' 0)"
          test "$(sha256sum "$digest/config.tar.gz" | cut -d ' ' -f 1)" != \
            "$bad_digest"
          sed -i "1s/^[0-9a-f]\{64\}/$bad_digest/" "$digest/SHA256SUMS"
          chmod 0600 "$digest/SHA256SUMS"
          grep -Fqx "$bad_digest  config.tar.gz" "$digest/SHA256SUMS"
          touch -d '@39' "$digest"

          metadata_digest_sha="$(printf '%040x' 40)"
          metadata_digest="$config_backup_root/run-40-1-$metadata_digest_sha"
          make_backup 40
          sed -i "2s/^[0-9a-f]\{64\}/$bad_digest/" \
            "$metadata_digest/SHA256SUMS"
          chmod 0600 "$metadata_digest/SHA256SUMS"
          grep -Fqx "$bad_digest  metadata.txt" "$metadata_digest/SHA256SUMS"
          touch -d '@40' "$metadata_digest"

          current_sha="$(printf '%040x' 1)"
          latest_sha="$(printf '%040x' 33)"
          config_backup_dir="$config_backup_root/run-1-1-$current_sha"
          config_backup_name="${config_backup_dir##*/}"
          '''
          checks = r'''
          test -d "$config_backup_root/run-1-1-$current_sha"
          test -d "$config_backup_root/run-33-1-$latest_sha"
          test -d "$empty"
          test -d "$mismatch"
          test -f "$extra/EXTRA"
          test -d "$traversal"
          test -d "$symlink"
          test -d "$digest"
          test -d "$metadata_digest"
          test -d "$config_backup_root/run-4-1-$(printf '%040x' 4)"
          test ! -e "$config_backup_root/run-2-1-$(printf '%040x' 2)"
          test ! -e "$config_backup_root/run-3-1-$(printf '%040x' 3)"
          remaining="$(find "$config_backup_root" -mindepth 1 -maxdepth 1 \
            -type d -name 'run-*' | wc -l)"
          test "$remaining" -eq 38
          printf 'production config retention OK: %s directories\n' "$remaining"
          '''
          Path(sys.argv[1]).write_text(
              fixture + "\n" + validator + "\n" + retention + "\n" + checks,
              encoding="utf-8",
              newline="\n",
          )
          PY
          chmod 0700 "$test_script"
          sudo bash "$test_script"

      - name: Test release Nginx auth contract
        run: python3 scripts/validate_release_nginx.py --self-test

      - name: Test release health contracts
        run: python3 -B scripts/validate_release_health.py --self-test

      - name: Test real Linux release transactions
        run: |
          bash -n scripts/production-release-transaction.sh
          bash -n scripts/prune-production-releases.sh
          bash -n scripts/prune-production-staging.sh
          sudo -n env PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/test_release_transaction.py --require-posix

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Test portal contract
        run: npm run test -- src/views/__tests__/Home.test.ts

      - name: Build portal
        run: npm run build:skip-check
        env:
          VITE_LINGXI_URL: https://lingxi.hi-veblen.com/

      - name: Upload portal artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portal-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  admin-quality:
    name: Admin quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            src/admin/frontend/package-lock.json
            src/admin/backend/package-lock.json

      - name: Install admin dependencies
        run: |
          npm ci --prefix src/admin/frontend
          npm ci --prefix src/admin/backend

      - name: Check admin frontend
        run: |
          npm run type-check --prefix src/admin/frontend
          npm run test:run --prefix src/admin/frontend
          npm run build --prefix src/admin/frontend

      - name: Build admin backend
        shell: bash
        run: |
          npm run build --prefix src/admin/backend
          test -s src/admin/backend/dist/app.js
          test -z "$(find src/admin/backend/dist -type f -path '*__tests__*' -print -quit)"
          node -e "const c=require('./src/admin/backend/ecosystem.config.js'); const a=c.apps?.[0]; if (!a?.node_args?.includes('--env-file=.env') || c.deploy) process.exit(1)"
          node -e "const p=require('./src/admin/backend/package.json'); if (!p.scripts?.['db:init']?.includes('--env-file=.env')) process.exit(1)"
          grep -Fq 'node --env-file=.env dist/database/init.js' src/admin/deploy.sh
          if NODE_ENV=production JWT_SECRET=replace-with-a-secret \
            node -e "require('./src/admin/backend/dist/config/jwt.js')"; then
            echo '生产 JWT 占位值未被拒绝' >&2
            exit 1
          fi
          NODE_ENV=production JWT_SECRET=ci-only-7Fq2mN9xR4vK8pL3sT6wY1zC5dH0jB node \
            -e "require('./src/admin/backend/dist/config/jwt.js')"
          if NODE_ENV=production ADMIN_USERNAME=replace-with-admin \
            ADMIN_PASSWORD=replace-with-password node -e \
            "require('./src/admin/backend/dist/database/init.js').getInitialAdminCredentials()"; then
            echo '生产管理员占位凭据未被拒绝' >&2
            exit 1
          fi
          NODE_ENV=production ADMIN_USERNAME=ci-admin \
            ADMIN_PASSWORD=ci-only-8Gv3nR0yP5wM2tK7sX4dQ9hL node -e \
            "require('./src/admin/backend/dist/database/init.js').getInitialAdminCredentials()"

  portal-e2e:
    name: Portal E2E
    runs-on: ubuntu-latest
    needs: release-gate
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download portal artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: portal-dist
          path: dist

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run portal smoke
        run: npx playwright test e2e/art-museum-experience.spec.ts --project=chromium
        env:
          VITE_LINGXI_URL: https://lingxi.hi-veblen.com/

      - name: Upload failed test report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 3

  legacy-diagnostics:
    name: Legacy diagnostics (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/admin/backend/package-lock.json

      - name: Install diagnostic dependencies
        run: |
          npm ci
          npm ci --prefix src/admin/backend

      - name: Run inherited full-suite diagnostics
        shell: bash
        run: |
          set +e
          npx eslint . --ext .vue,.js,.jsx,.cjs,.mjs,.ts,.tsx,.cts,.mts
          lint_status=$?
          npm run test
          root_test_status=$?
          npm test --prefix src/admin/backend -- --runInBand
          backend_test_status=$?
          printf 'lint=%s root_tests=%s backend_tests=%s\n' \
            "$lint_status" "$root_test_status" "$backend_test_status"
          if test "$lint_status" -ne 0 || \
            test "$root_test_status" -ne 0 || \
            test "$backend_test_status" -ne 0; then
            echo "::warning::Legacy diagnostics remain non-blocking: lint=$lint_status root_tests=$root_test_status backend_tests=$backend_test_status"
          fi
