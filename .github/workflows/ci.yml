          assert 'test "$(cat "$lease_dir/owner" 2>/dev/null || true)" = "$lease_owner"' in staging
          assert 'install -m 0600 /dev/null "$upload_dir/PRESERVE"' in staging
          assert "$" + "{{" not in staging
          assert '! -path "$upload_dir/PRESERVE"' in main_remote
          assert '发布生命周期租约不属于本次运行' in main_remote
          preserve_remove = workflow.rfind(
