name: D050 生产浏览器与删除链验收

on:
  workflow_dispatch:
    inputs:
      target_persist_id:
        description: 本次唯一允许验收并删除的合成用户
        required: true
        default: auto
        type: string
      expected_head_sha:
        description: 必须与本次 workflow 实际检出的完整提交 SHA 一致
        required: true
        type: string
      expected_portal_revision:
        description: 本次已经部署并等待验收的 Portal 完整 revision
        required: true
        type: string
      expected_backend_revision:
        description: 本次已经部署并等待验收的 Lingxi 完整 revision
        required: true
        type: string
      review_phase:
        description: 留出审核或撤销后删号续做阶段
        required: true
        default: prepare_review
        type: string
      review_decision_b64:
        description: confirm_review 阶段必填的人工审核决定 Base64
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: hi-veblen-production
  cancel-in-progress: false

jobs:
  acceptance:
    name: 生产桌面移动全链
    if: >-
      github.repository == 'Timking123/hi-veblen' &&
      github.actor == 'Timking123' &&
      github.triggering_actor == 'Timking123'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    environment:
      name: production

    steps:
      - name: 检出验收脚本
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: 校验人工触发目标
        env:
          TARGET_PERSIST_ID: ${{ inputs.target_persist_id }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_PORTAL_REVISION: ${{ inputs.expected_portal_revision }}
          EXPECTED_BACKEND_REVISION: ${{ inputs.expected_backend_revision }}
          REVIEW_PHASE: ${{ inputs.review_phase }}
          REVIEW_DECISION_B64: ${{ inputs.review_decision_b64 }}
        run: |
          set -euo pipefail
          case "$TARGET_PERSIST_ID" in
            auto|p6_load_a) ;;
            *) echo "本次验收目标不是已批准的合成用户" >&2; exit 1 ;;
          esac
          printf '%s' "$EXPECTED_HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$EXPECTED_PORTAL_REVISION" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$EXPECTED_BACKEND_REVISION" | grep -Eq '^[0-9a-f]{40}$'
          case "$REVIEW_PHASE" in
            prepare_review) test -z "$REVIEW_DECISION_B64" ;;
            confirm_review) test -n "$REVIEW_DECISION_B64" ;;
            recover_delete) test -z "$REVIEW_DECISION_B64" ;;
            rotate_token) test -z "$REVIEW_DECISION_B64" ;;
            *) echo "留出审核阶段非法" >&2; exit 1 ;;
          esac
          test "$EXPECTED_HEAD_SHA" = "$GITHUB_SHA"
          test "$EXPECTED_PORTAL_REVISION" = "$EXPECTED_HEAD_SHA"
          locked_backend_revision="$(
            sed -n 's/^  LINGXI_SHA: \([0-9a-f]\{40\}\)$/\1/p' .github/workflows/deploy.yml
          )"
          test "$EXPECTED_BACKEND_REVISION" = "$locked_backend_revision"

      - name: 等待最终生产 revision
        env:
          EXPECTED_PORTAL_REVISION: ${{ inputs.expected_portal_revision }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$EXPECTED_PORTAL_REVISION" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "目标 Portal revision 格式无效" >&2
            exit 1
          fi
          deadline=$((SECONDS + 1500))
          while test "$SECONDS" -lt "$deadline"; do
            current="$(curl --connect-timeout 10 --max-time 30 \
              --fail --silent --show-error https://hi-veblen.com/release.txt || true)"
            if test "$current" = "$EXPECTED_PORTAL_REVISION"; then
              echo "目标生产 revision 已就绪"
              exit 0
            fi
            sleep 15
          done
          echo "等待目标生产 revision 超时" >&2
          exit 1

      - name: 设置 Node.js
        if: ${{ inputs.review_phase == 'prepare_review' || inputs.review_phase == 'confirm_review' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装浏览器依赖
        if: ${{ inputs.review_phase == 'prepare_review' || inputs.review_phase == 'confirm_review' }}
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: 配置受信 SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -eu
          case "$SERVER_HOST" in
            ''|*[!A-Za-z0-9.:-]*) echo "SERVER_HOST 格式无效" >&2; exit 1 ;;
          esac
          case "$SERVER_USER" in
            ''|*[!A-Za-z0-9._-]*) echo "SERVER_USER 格式无效" >&2; exit 1 ;;
          esac
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/hi-veblen-deploy"
          chmod 0600 "$HOME/.ssh/hi-veblen-deploy"
          printf '%s\n' \
            'hi-veblen-production ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM4IhOSWQcIioXavkJYcZ1WbE682kGvQF+rTAgnBRNif' \
            > "$HOME/.ssh/known_hosts"
          printf '%s\n' \
            'Host hi-veblen-production' \
            "  HostName $SERVER_HOST" \
            "  User $SERVER_USER" \
            '  HostKeyAlias hi-veblen-production' \
            '  IdentityFile ~/.ssh/hi-veblen-deploy' \
            '  IdentitiesOnly yes' \
            '  BatchMode yes' \
            '  StrictHostKeyChecking yes' \
            '  ConnectTimeout 10' \
            > "$HOME/.ssh/config"
          chmod 0600 "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"
          ssh hi-veblen-production true

      - name: 首次生产写前复核三处 backend revision
        env:
          EXPECTED_PORTAL_REVISION: ${{ inputs.expected_portal_revision }}
          EXPECTED_BACKEND_REVISION: ${{ inputs.expected_backend_revision }}
          REVIEW_PHASE: ${{ inputs.review_phase }}
        run: |
          set -euo pipefail
          portal_revision="$(curl --connect-timeout 10 --max-time 30 \
            --fail --silent --show-error https://hi-veblen.com/release.txt)"
          lingxi_revision="$(curl --connect-timeout 10 --max-time 30 \
            --fail --silent --show-error https://lingxi.hi-veblen.com/release.txt)"
          health_file="$(mktemp)"
          trap 'rm -f "$health_file"' EXIT
          health_ready=false
          public_backend_revision=-
          recovery_pending=false
          if curl --connect-timeout 10 --max-time 30 --fail --silent --show-error \
            https://lingxi.hi-veblen.com/api/health > "$health_file"; then
            public_backend_revision="$(python3 - "$health_file" "$EXPECTED_BACKEND_REVISION" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              health = json.load(source)
          expected = sys.argv[2]
          assert health.get("backend_revision") == expected
          assert health.get("persona_schema_phase") == "active"
          growth = health.get("persona_growth") or {}
          assert growth.get("phase") == "active" and growth.get("ready") is True
          heartbeat = ((health.get("host") or {}).get("heartbeat") or {})
          assert heartbeat.get("first_fire_ok") is True
          print(health["backend_revision"])
          PY
            )" || public_backend_revision=-
          fi
          if test "$public_backend_revision" = "$EXPECTED_BACKEND_REVISION"; then
            health_ready=true
          else
            test "$REVIEW_PHASE" = rotate_token
            recovery_pending="$(ssh hi-veblen-production 'bash -se --' \
              "$EXPECTED_BACKEND_REVISION" <<'REMOTE'
          set -euo pipefail
          expected_revision="$1"
          sudo python3 -P -B - "$expected_revision" <<'PY'
          import json
          import os
          from pathlib import Path
          import stat
          import sys

          root = Path("/var/backups/myagent-d050-token-rotation")
          receipt_path = root / "d050-token-rotation-receipt.json"
          root_stat = root.lstat()
          receipt_stat = receipt_path.lstat()
          assert stat.S_ISDIR(root_stat.st_mode) and not root.is_symlink()
          assert root_stat.st_uid == 0 and root_stat.st_mode & 0o077 == 0
          assert stat.S_ISREG(receipt_stat.st_mode) and not receipt_path.is_symlink()
          assert receipt_stat.st_uid == 0 and receipt_stat.st_mode & 0o077 == 0
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          assert receipt.get("schema_version") == "d050-token-rotation-v1"
          assert receipt.get("persist_id") == "p6_load_a"
          assert receipt.get("expected_revision") == sys.argv[1]
          assert receipt.get("state") == "rollback_pending"
          print("true")
          PY
          REMOTE
            )"
            test "$recovery_pending" = true
          fi
          server_backend_revision="$(ssh hi-veblen-production \
            'cat /opt/myagent/backend-current/release.txt')"
          test "$portal_revision" = "$EXPECTED_PORTAL_REVISION"
          test "$lingxi_revision" = "$EXPECTED_BACKEND_REVISION"
          test "$server_backend_revision" = "$EXPECTED_BACKEND_REVISION"
          python3 - "$portal_revision" "$lingxi_revision" \
            "$public_backend_revision" "$server_backend_revision" \
            "$health_ready" "$recovery_pending" <<'PY' \
            > d050-prewrite-revision-evidence.json
          import json
          import sys

          public_revision = None if sys.argv[3] == "-" else sys.argv[3]
          health_ready = sys.argv[5] == "true"
          recovery_pending = sys.argv[6] == "true"
          assert health_ready != recovery_pending
          print(json.dumps({
              "portal_revision": sys.argv[1],
              "lingxi_revision": sys.argv[2],
              "public_backend_revision": public_revision,
              "server_backend_revision": sys.argv[4],
              "health_ready": health_ready,
              "rollback_recovery_pending": recovery_pending,
              "BAD": 0,
          }, sort_keys=True))
          PY

      - name: 读取并掩码 p6_load_a 凭证
        id: read-credentials
        env:
          TARGET_PERSIST_ID: ${{ inputs.target_persist_id }}
          REVIEW_PHASE: ${{ inputs.review_phase }}
        run: |
          set -euo pipefail
          case "$TARGET_PERSIST_ID" in auto|p6_load_a) ;; *) exit 1 ;; esac
          mapfile -t values < <(
            ssh hi-veblen-production 'bash -se --' \
              "$TARGET_PERSIST_ID" "$REVIEW_PHASE" <<'REMOTE'
          set -eu
          target_persist_id="$1"
          review_phase="$2"
          case "$target_persist_id" in auto|p6_load_a) ;; *) exit 1 ;; esac
          case "$review_phase" in
            prepare_review|confirm_review|recover_delete|rotate_token) ;;
            *) exit 1 ;;
          esac
          python=/opt/myagent/backend-current/.venv/bin/python
          test -x "$python"
          cd /opt/myagent/backend-current
          "$python" - "$review_phase" <<'PY'
          import json
          import sys
          from pathlib import Path

          from dotenv import dotenv_values
          from brain.workspace.p6_config import (
              is_gateway_token_revoked,
              parse_user_token_map,
              token_hash,
          )

          values = dotenv_values("/opt/myagent/.env")
          mapping = parse_user_token_map(
              str(values.get("BRAIN_GATEWAY_USER_TOKENS") or "")
          )
          candidate = "p6_load_a"
          review_phase = sys.argv[1]
          token = str(mapping.get(candidate) or "")
          user_dir = Path("/opt/myagent/data/users") / candidate
          invalid_path = user_dir.is_symlink() or (user_dir.exists() and not user_dir.is_dir())
          revoked = bool(token) and is_gateway_token_revoked(
              "/opt/myagent/data", token_hash(token)
          )
          recovery = review_phase == "recover_delete"
          rotation = review_phase == "rotate_token"
          directory_absent = not user_dir.exists() and not user_dir.is_symlink()
          valid_state = (
              bool(token)
              and not invalid_path
              and (
                  (rotation and directory_absent)
                  or (recovery and revoked)
                  or (not rotation and not recovery and not revoked)
              )
          )
          if not valid_state:
              raise SystemExit(json.dumps({
                  "error": "p6_load_a 不满足安全准备条件",
                  "token_present": bool(token),
                  "directory_state": (
                      "invalid" if invalid_path else "present" if user_dir.is_dir() else "absent"
                  ),
                  "revoked": revoked,
                  "review_phase": review_phase,
              }, sort_keys=True))
          print(candidate)
          hide_token = recovery or rotation
          print("-" if hide_token else token)
          print(candidate)
          print("-" if hide_token else token)
          print(
              "delete_recovery"
              if recovery
              else "token_rotation_ready"
              if rotation and not revoked
              else "token_rotation"
              if rotation
              else "private_resumed"
          )
          print(token_hash(token))
          PY
          REMOTE
          )
          test "${#values[@]}" -eq 6
          primary_id="${values[0]}"
          primary_token="${values[1]}"
          delete_id="${values[2]}"
          delete_token="${values[3]}"
          acceptance_mode="${values[4]}"
          delete_token_hash="${values[5]}"
          case "$primary_id" in
            p6_load_a) ;;
            *) echo "登录验收用户不在合成白名单" >&2; exit 1 ;;
          esac
          case "$delete_id" in
            p6_load_a) ;;
            *) echo "删除验收用户不在合成白名单" >&2; exit 1 ;;
          esac
          case "$acceptance_mode" in
            private_resumed)
              test -n "$primary_token" && test "$primary_token" != -
              test -n "$delete_token" && test "$delete_token" != -
              ;;
            delete_recovery)
              test "$REVIEW_PHASE" = "recover_delete"
              test "$primary_token" = -
              test "$delete_token" = -
              primary_token=""
              delete_token=""
              ;;
            token_rotation|token_rotation_ready)
              test "$REVIEW_PHASE" = "rotate_token"
              test "$primary_token" = -
              test "$delete_token" = -
              primary_token=""
              delete_token=""
              ;;
            *) echo "合成用户验收模式非法" >&2; exit 1 ;;
          esac
          printf '%s' "$delete_token_hash" | grep -Eq '^sha256:[0-9a-f]{64}$'
          primary_token_b64="$(printf '%s' "$primary_token" | base64 -w0)"
          delete_token_b64="$(printf '%s' "$delete_token" | base64 -w0)"
          if test "$acceptance_mode" = "private_resumed"; then
            echo "::add-mask::$primary_token"
            echo "::add-mask::$delete_token"
            echo "::add-mask::$primary_token_b64"
            echo "::add-mask::$delete_token_b64"
          fi
          echo "::add-mask::$delete_token_hash"
          {
            printf 'D050_PRIMARY_ID=%s\n' "$primary_id"
            printf 'D050_PRIMARY_TOKEN_B64=%s\n' "$primary_token_b64"
            printf 'D050_DELETE_ID=%s\n' "$delete_id"
            printf 'D050_DELETE_TOKEN_B64=%s\n' "$delete_token_b64"
            printf 'D050_ACCEPTANCE_MODE=%s\n' "$acceptance_mode"
            printf 'D050_DELETE_TOKEN_HASH=%s\n' "$delete_token_hash"
          } >> "$GITHUB_ENV"
          echo "已选择合成验收用户：$primary_id；模式：$acceptance_mode；删除用户：$delete_id"

      - name: 在首次生产写前创建并验证备份
        env:
          EXPECTED_BACKEND_REVISION: ${{ inputs.expected_backend_revision }}
        run: |
          set -euo pipefail
          ssh hi-veblen-production 'bash -se --' "$EXPECTED_BACKEND_REVISION" \
            > d050-production-backup-evidence.json <<'REMOTE'
          set -euo pipefail
          expected_backend_revision="$1"
          before="$({
            sudo find /opt/myagent/backups -maxdepth 1 -type f \
              -name 'lingxi-backup-*.tar.gz' -printf '%f\n' 2>/dev/null || true
          } | sort | tail -n 1)"
          timeout 20m sudo systemctl start lingxi-backup.service
          test "$(sudo systemctl show lingxi-backup.service -p Result --value)" = "success"
          test "$(sudo systemctl show lingxi-backup.service -p ExecMainStatus --value)" = "0"
          latest="$(
            sudo find /opt/myagent/backups -maxdepth 1 -type f \
              -name 'lingxi-backup-*.tar.gz' -printf '%f\n' | sort | tail -n 1
          )"
          test -n "$latest"
          test "$latest" != "$before"
          verify_file="$(mktemp)"
          trap 'rm -f "$verify_file"' EXIT
          sudo /usr/bin/python3 /opt/myagent/ops/bin/backup_data.py \
            verify "/opt/myagent/backups/$latest" > "$verify_file"
          python3 - "$verify_file" "$latest" "$expected_backend_revision" <<'PY'
          import json
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              verified = json.load(source)
          archive_name = sys.argv[2]
          expected = sys.argv[3]
          assert re.fullmatch(r"lingxi-backup-[0-9TZ]+\.tar\.gz", archive_name)
          assert verified.get("ok") is True
          assert verified.get("release_sha") == expected
          print(json.dumps({
              "backup_created": True,
              "backup_verified": True,
              "archive_name": archive_name,
              "archive_sha256": verified.get("archive_sha256"),
              "archive_bytes": verified.get("archive_bytes"),
              "file_count": verified.get("file_count"),
              "release_sha": verified.get("release_sha"),
              "BAD": 0,
          }, sort_keys=True))
          PY
          REMOTE

      - name: 轮换撤销后的 p6_load_a 凭证
        if: ${{ inputs.review_phase == 'rotate_token' }}
        env:
          EXPECTED_BACKEND_REVISION: ${{ inputs.expected_backend_revision }}
          EXPECTED_CURRENT_HASH: ${{ env.D050_DELETE_TOKEN_HASH }}
        run: |
          set -euo pipefail
          printf '%s' "$EXPECTED_CURRENT_HASH" | grep -Eq '^sha256:[0-9a-f]{64}$'
          python3 - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(
              Path("d050-production-backup-evidence.json").read_text(encoding="utf-8")
          )
          assert evidence.get("backup_created") is True
          assert evidence.get("backup_verified") is True
          assert evidence.get("BAD") == 0
          PY
          remote_script=""
          public_health=""
          remove_remote_script() {
            ssh hi-veblen-production 'bash -se --' "$1" <<'REMOTE_CLEANUP'
          set -euo pipefail
          target="$1"
          [[ "$target" =~ ^/tmp/d050-rotate-token\.[A-Za-z0-9]{8}\.py$ ]]
          sudo rm -f -- "$target"
          REMOTE_CLEANUP
          }
          cleanup_rotation() {
            status=$?
            if test -n "$remote_script"; then
              remove_remote_script "$remote_script" >/dev/null 2>&1 || true
            fi
            if test -n "$public_health"; then rm -f -- "$public_health"; fi
            exit "$status"
          }
          trap cleanup_rotation EXIT
          remote_script="$(ssh hi-veblen-production \
            'mktemp /tmp/d050-rotate-token.XXXXXXXX.py')"
          [[ "$remote_script" =~ ^/tmp/d050-rotate-token\.[A-Za-z0-9]{8}\.py$ ]] || {
            echo "远端轮换脚本路径无效" >&2
            exit 1
          }
          scp scripts/d050_rotate_synthetic_token.py \
            "hi-veblen-production:$remote_script"
          script_sha="$(sha256sum scripts/d050_rotate_synthetic_token.py | awk '{print $1}')"
          ssh hi-veblen-production 'bash -se --' \
            "$remote_script" "$script_sha" "$EXPECTED_CURRENT_HASH" \
            "$EXPECTED_BACKEND_REVISION" \
            > d050-token-rotation-evidence.json <<'REMOTE'
          set -euo pipefail
          remote_script="$1"
          expected_script_sha="$2"
          expected_current_hash="$3"
          expected_backend_revision="$4"
          [[ "$remote_script" =~ ^/tmp/d050-rotate-token\.[A-Za-z0-9]{8}\.py$ ]]
          printf '%s' "$expected_script_sha" | grep -Eq '^[0-9a-f]{64}$'
          printf '%s' "$expected_current_hash" | grep -Eq '^sha256:[0-9a-f]{64}$'
          printf '%s' "$expected_backend_revision" | grep -Eq '^[0-9a-f]{40}$'

          exec 9>/run/hi-veblen-release.lock
          if ! flock -n 9; then
            echo "另一个服务器发布事务仍在运行，拒绝轮换凭证。" >&2
            exit 1
          fi
          maintenance_marker=/run/myagent-release-maintenance
          preserve_marker=/run/hi-veblen-release-preserve
          lease_dir=/run/hi-veblen-release-lease
          preserved_staging=""
          if test -d /opt/hi-veblen/staging; then
            preserved_staging="$(find /opt/hi-veblen/staging -mindepth 2 -maxdepth 2 \
              -name PRESERVE -print -quit)"
          fi
          if test -e "$maintenance_marker" || test -L "$maintenance_marker" || \
            test -e "$preserve_marker" || test -L "$preserve_marker" || \
            test -e "$lease_dir" || test -L "$lease_dir" || \
            test -n "$preserved_staging"; then
            echo "检测到发布保护现场，拒绝轮换凭证。" >&2
            exit 1
          fi
          for unit in myagent-world.service myagent-gateway.service; do
            test -z "$(systemctl show "$unit" -p DropInPaths --value)"
          done

          sudo chown root:root "$remote_script"
          sudo chmod 0600 "$remote_script"
          test "$(sudo sha256sum "$remote_script" | awk '{print $1}')" = \
            "$expected_script_sha"
          test "$(cat /opt/myagent/backend-current/release.txt)" = \
            "$expected_backend_revision"
          cd /opt/myagent/backend-current
          sudo env PYTHONPATH=/opt/myagent/backend-current \
            ./.venv/bin/python -P -B "$remote_script" \
            /opt/myagent/.env /opt/myagent/data \
            /var/backups/myagent-d050-token-rotation \
            "$expected_current_hash" "$expected_backend_revision" \
            http://127.0.0.1:8000
          REMOTE
          python3 - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(
              Path("d050-token-rotation-evidence.json").read_text(encoding="utf-8")
          )
          assert evidence.get("config_backup_created") is True
          assert evidence.get("gateway_active") is True
          assert evidence.get("world_pid_unchanged") is True
          assert evidence.get("session_verified") is True
          assert evidence.get("old_token_rejected") is True
          assert evidence.get("receipt_persisted") is True
          assert evidence.get("receipt_state") == "verified"
          assert evidence.get("locked_prewrite_revision_ok") is True
          assert 1 <= evidence.get("backup_retained_count", 0) <= 7
          assert evidence.get("BAD") == 0
          PY
          remove_remote_script "$remote_script"
          remote_script=""
          public_health="$(mktemp)"
          curl --connect-timeout 10 --max-time 30 --fail --silent --show-error \
            https://lingxi.hi-veblen.com/api/health > "$public_health"
          python3 scripts/validate_release_health.py current \
            "$EXPECTED_BACKEND_REVISION" active active < "$public_health" >/dev/null
          python3 - "$public_health" "$EXPECTED_BACKEND_REVISION" <<'PY' \
            > d050-token-rotation-public-evidence.json
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              health = json.load(source)
