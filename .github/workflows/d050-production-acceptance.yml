      - name: 提高活跃灰测额度
        if: ${{ inputs.review_phase == 'confirm_review' }}
        run: |
          set -euo pipefail
          ssh hi-veblen-production 'bash -se' > d050-gray-budget-evidence.json <<'REMOTE'
          set -euo pipefail
          python=/opt/myagent/backend-current/.venv/bin/python
          test -x "$python"
          cd /opt/myagent/backend-current
          sudo -u myagent "$python" - <<'PY'
          import json
          import time
          from pathlib import Path

          from dotenv import dotenv_values
          from brain.persona.growth_runtime import _user_change_lock_path
          from brain.workspace.p6_config import (
              is_gateway_token_revoked,
              load_user_config,
              parse_user_token_map,
              save_user_config,
              token_hash,
              update_user_config,
          )
          from brain.workspace.user_paths import ProcessFileLock, user_storage_paths

          data_dir = "/opt/myagent/data"
          limit = 100_000_000
          raw = dotenv_values("/opt/myagent/.env").get("BRAIN_GATEWAY_USER_TOKENS")
          mapping = parse_user_token_map(str(raw or ""))
          active_users = []
          skipped = invalid = 0

          for persist_id, token in sorted(mapping.items()):
              paths = user_storage_paths(data_dir, persist_id)
              user_dir = Path(paths.user_dir)
              config_path = user_dir / "user_config.json"
              if (
                  user_dir.is_symlink()
                  or (user_dir.exists() and not user_dir.is_dir())
                  or config_path.is_symlink()
              ):
                  invalid += 1
                  continue
              if not user_dir.is_dir() or is_gateway_token_revoked(data_dir, token_hash(token)):
                  skipped += 1
                  continue
              active_users.append(persist_id)

          locks = []
          originals = {}
          updated = []
          rollback_restored = rollback_failures = 0
          error_type = ""
          try:
              if invalid:
                  raise RuntimeError("invalid_gray_user_path")
              for persist_id in active_users:
                  lock = ProcessFileLock(_user_change_lock_path(data_dir, persist_id))
                  deadline = time.monotonic() + 30
                  while True:
                      try:
                          lock.acquire()
                          locks.append(lock)
                          break
                      except RuntimeError:
                          if time.monotonic() >= deadline:
                              raise TimeoutError("gray_user_lock_timeout")
                          time.sleep(0.05)
              for persist_id in active_users:
                  paths = user_storage_paths(data_dir, persist_id)
                  user_dir = Path(paths.user_dir)
                  config_path = user_dir / "user_config.json"
                  if (
                      not user_dir.is_dir()
                      or user_dir.is_symlink()
                      or config_path.is_symlink()
                      or is_gateway_token_revoked(data_dir, token_hash(mapping[persist_id]))
                  ):
                      raise RuntimeError("gray_user_state_changed_while_locking")
              originals = {
                  persist_id: load_user_config(data_dir, persist_id)
                  for persist_id in active_users
              }
              for persist_id in active_users:
                  updated.append(persist_id)
                  update_user_config(
                      data_dir,
                      persist_id,
                      {"budget": {"daily_token_limit": limit}},
                  )
                  configured = int(
                      (load_user_config(data_dir, persist_id).get("budget") or {}).get(
                          "daily_token_limit", 0
                      )
                  )
                  if configured != limit:
                      raise RuntimeError("gray_user_budget_verify_failed")
          except Exception as exc:
              error_type = type(exc).__name__
              for persist_id in reversed(updated):
                  try:
                      save_user_config(data_dir, persist_id, originals[persist_id])
                      rollback_restored += 1
                  except Exception:
                      rollback_failures += 1
          finally:
              for lock in reversed(locks):
                  lock.release()

          committed = len(updated) if not error_type else len(updated) - rollback_restored
          bad = invalid + rollback_failures + int(bool(error_type) and not invalid)

          evidence = {
              "active_gray_users": len(active_users),
              "attempted_updates": len(updated),
              "updated_gray_users": committed,
              "skipped_inactive_users": skipped,
              "daily_token_limit": limit,
              "rollback_restored": rollback_restored,
              "rollback_failures": rollback_failures,
              "error_type": error_type,
              "BAD": bad,
          }
          print(json.dumps(evidence, sort_keys=True))
          if bad or committed != len(active_users):
              raise SystemExit(1)
          PY
          REMOTE

