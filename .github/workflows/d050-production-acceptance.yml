name: D050 生产浏览器与删除链验收

on:
  workflow_dispatch:
    inputs:
      target_persist_id:
        description: 本次唯一允许验收并删除的合成用户
        required: true
        default: p6_load_b
        type: string
      expected_head_sha:
        description: 必须与本次 workflow 实际检出的完整提交 SHA 一致
        required: true
        type: string
      expected_portal_revision:
        description: 本次已经部署并等待验收的 Portal 完整 revision
        required: true
        type: string
      expected_backend_revision:
        description: 本次已经部署并等待验收的 Lingxi 完整 revision
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hi-veblen-production
  cancel-in-progress: false

jobs:
  audit-synthetic-recovery:
    name: 只读审计合成用户恢复现场
    if: >-
      inputs.target_persist_id == 'audit_p6_load_c' &&
      github.repository == 'Timking123/hi-veblen' &&
      github.actor == 'Timking123' &&
      github.triggering_actor == 'Timking123'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production

    steps:
      - name: 校验只读审计参数
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_PORTAL_REVISION: ${{ inputs.expected_portal_revision }}
          EXPECTED_BACKEND_REVISION: ${{ inputs.expected_backend_revision }}
        run: |
          set -euo pipefail
          printf '%s' "$EXPECTED_HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$EXPECTED_PORTAL_REVISION" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$EXPECTED_BACKEND_REVISION" | grep -Eq '^[0-9a-f]{40}$'
          test "$EXPECTED_HEAD_SHA" = "$GITHUB_SHA"

      - name: 配置只读审计 SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -eu
          case "$SERVER_HOST" in
            ''|*[!A-Za-z0-9.:-]*) echo "SERVER_HOST 格式无效" >&2; exit 1 ;;
          esac
          case "$SERVER_USER" in
            ''|*[!A-Za-z0-9._-]*) echo "SERVER_USER 格式无效" >&2; exit 1 ;;
          esac
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/hi-veblen-deploy"
          chmod 0600 "$HOME/.ssh/hi-veblen-deploy"
          printf '%s\n' \
            'hi-veblen-production ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM4IhOSWQcIioXavkJYcZ1WbE682kGvQF+rTAgnBRNif' \
            > "$HOME/.ssh/known_hosts"
          printf '%s\n' \
            'Host hi-veblen-production' \
            "  HostName $SERVER_HOST" \
            "  User $SERVER_USER" \
            '  HostKeyAlias hi-veblen-production' \
            '  IdentityFile ~/.ssh/hi-veblen-deploy' \
            '  IdentitiesOnly yes' \
            '  BatchMode yes' \
            '  StrictHostKeyChecking yes' \
            '  ConnectTimeout 10' \
            > "$HOME/.ssh/config"
          chmod 0600 "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"
          ssh hi-veblen-production true

      - name: 读取非敏感恢复状态
        env:
          EXPECTED_PORTAL_REVISION: ${{ inputs.expected_portal_revision }}
          EXPECTED_BACKEND_REVISION: ${{ inputs.expected_backend_revision }}
        run: |
          ssh hi-veblen-production 'bash -se --' \
            "$EXPECTED_PORTAL_REVISION" "$EXPECTED_BACKEND_REVISION" <<'REMOTE'
          set -eu
          test "$(cat /opt/hi-veblen/portal-current/release.txt)" = "$1"
          test "$(cat /opt/hi-veblen/lingxi-current/release.txt)" = "$2"
          test "$(cat /opt/myagent/backend-current/release.txt)" = "$2"
          cd /opt/myagent/backend-current
          exec .venv/bin/python -B - "$1" "$2" <<'PY'
          import json
          import subprocess
          import sys
          import time
          from pathlib import Path
          from urllib import request

          from dotenv import dotenv_values
          from brain.workspace.p6_config import (
              is_gateway_token_revoked,
              parse_user_token_map,
              token_hash,
          )

          data_dir = "/opt/myagent/data"
          ops_dir = Path("/opt/myagent/d050-recovery/p6-load-c")
          lease_path = ops_dir / "lease.json"
          cron_path = Path("/etc/cron.d/d050-p6-load-c")
          values = dict(dotenv_values("/opt/myagent/.env"))
          mapping = parse_user_token_map(
              str(values.get("BRAIN_GATEWAY_USER_TOKENS") or "")
          )

          def target_status(persist_id):
              token = str(mapping.get(persist_id) or "")
              user_dir = Path(data_dir) / "users" / persist_id
              return {
                  "mapping_exists": bool(token),
                  "token_revoked": bool(
                      token and is_gateway_token_revoked(data_dir, token_hash(token))
                  ),
                  "user_dir_exists": user_dir.is_dir(),
                  "user_dir_symlink": user_dir.is_symlink(),
              }

          lease = {}
          if lease_path.is_file() and not lease_path.is_symlink():
              lease = json.loads(lease_path.read_text(encoding="utf-8"))
          host_port = int(values.get("BRAIN_HOST_PORT") or 8765)
          with request.urlopen(
              f"http://127.0.0.1:{host_port}/host/health", timeout=30
          ) as response:
              health = json.loads(response.read().decode("utf-8"))
          host = health.get("host") or health
          heartbeat = host.get("heartbeat") or {}

          def systemctl(action, unit):
              return subprocess.run(
                  ["systemctl", action, "--quiet", unit], check=False
              ).returncode == 0

          def drop_ins(unit):
              return subprocess.run(
                  ["systemctl", "show", unit, "-p", "DropInPaths", "--value"],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.strip()

          print(json.dumps({
              "revisions": {
                  "portal": sys.argv[1],
                  "lingxi": sys.argv[2],
                  "backend": sys.argv[2],
              },
              "p6_load_b": target_status("p6_load_b"),
              "p6_load_c": target_status("p6_load_c"),
              "lease": {
                  "exists": lease_path.exists(),
                  "symlink": lease_path.is_symlink(),
                  "status": str(lease.get("status") or ""),
                  "owner_present": bool(lease.get("owner")),
                  "expired": bool(
                      lease and time.time() >= float(lease.get("expires_at_epoch") or 0)
                  ),
              },
              "artifacts": {
                  "ops_dir_exists": ops_dir.exists(),
                  "ops_dir_symlink": ops_dir.is_symlink(),
                  "setup_exists": (ops_dir / "setup.json").exists(),
                  "watchdog_exists": (ops_dir / "watchdog.py").exists(),
                  "cron_exists": cron_path.exists(),
                  "cron_symlink": cron_path.is_symlink(),
                  "release_lease_exists": Path(
                      "/run/hi-veblen-release-lease"
                  ).exists(),
                  "release_lease_symlink": Path(
                      "/run/hi-veblen-release-lease"
                  ).is_symlink(),
                  "maintenance_marker_exists": Path(
                      "/run/myagent-release-maintenance"
                  ).exists(),
                  "maintenance_marker_symlink": Path(
                      "/run/myagent-release-maintenance"
                  ).is_symlink(),
                  "preserve_marker_exists": Path(
                      "/run/hi-veblen-release-preserve"
                  ).exists(),
                  "preserve_marker_symlink": Path(
                      "/run/hi-veblen-release-preserve"
                  ).is_symlink(),
              },
              "services": {
                  "world_active": systemctl("is-active", "myagent-world.service"),
                  "world_enabled": systemctl("is-enabled", "myagent-world.service"),
                  "gateway_active": systemctl("is-active", "myagent-gateway.service"),
                  "gateway_enabled": systemctl("is-enabled", "myagent-gateway.service"),
                  "world_drop_ins_empty": not drop_ins("myagent-world.service"),
                  "gateway_drop_ins_empty": not drop_ins("myagent-gateway.service"),
              },
              "host": {
                  "ready": host.get("ready") is True,
                  "continuity_ok": host.get("continuity_ok") is True,
                  "audition_isolation_ok": host.get("audition_isolation_ok") is True,
                  "first_fire_completed": heartbeat.get("first_fire_completed") is True,
                  "first_fire_ok": heartbeat.get("first_fire_ok") is True,
                  "consecutive_failures": int(
                      heartbeat.get("consecutive_failures") or 0
                  ),
              },
          }, ensure_ascii=False, sort_keys=True))
          PY
          REMOTE

      - name: 清除只读审计 SSH 凭据
        if: ${{ always() }}
        run: rm -f -- "$HOME/.ssh/hi-veblen-deploy" "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"

  prepare-synthetic-user:
    name: 准备最终验收合成用户
    if: >-
      (inputs.target_persist_id == 'prepare_p6_load_c' ||
      inputs.target_persist_id == 'confirm_p6_load_c' ||
      inputs.target_persist_id == 'cleanup_p6_load_c') &&
      github.repository == 'Timking123/hi-veblen' &&
      github.actor == 'Timking123' &&
      github.triggering_actor == 'Timking123'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: production

    steps:
      - name: 检出合成用户准备脚本
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: 校验准备参数
        id: synthetic-operation-id
        env:
          TARGET_PERSIST_ID: ${{ inputs.target_persist_id }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_PORTAL_REVISION: ${{ inputs.expected_portal_revision }}
          EXPECTED_BACKEND_REVISION: ${{ inputs.expected_backend_revision }}
        run: |
          set -euo pipefail
          case "$TARGET_PERSIST_ID" in
            prepare_p6_load_c|confirm_p6_load_c|cleanup_p6_load_c) ;;
            *) echo "合成用户准备模式无效" >&2; exit 1 ;;
          esac
          printf '%s' "$EXPECTED_HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$EXPECTED_PORTAL_REVISION" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$EXPECTED_BACKEND_REVISION" | grep -Eq '^[0-9a-f]{40}$'
          test "$EXPECTED_HEAD_SHA" = "$GITHUB_SHA"
          operation_id="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_SHA"
          printf '%s' "$operation_id" | grep -Eq '^[0-9]+-[0-9]+-[0-9a-f]{40}$'
          echo "operation_id=$operation_id" >> "$GITHUB_OUTPUT"

      - name: 配置合成用户准备 SSH
        id: prepare-ssh
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -eu
          case "$SERVER_HOST" in
            ''|*[!A-Za-z0-9.:-]*) echo "SERVER_HOST 格式无效" >&2; exit 1 ;;
          esac
          case "$SERVER_USER" in
            ''|*[!A-Za-z0-9._-]*) echo "SERVER_USER 格式无效" >&2; exit 1 ;;
          esac
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/hi-veblen-deploy"
          chmod 0600 "$HOME/.ssh/hi-veblen-deploy"
          printf '%s\n' \
            'hi-veblen-production ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM4IhOSWQcIioXavkJYcZ1WbE682kGvQF+rTAgnBRNif' \
            > "$HOME/.ssh/known_hosts"
          printf '%s\n' \
            'Host hi-veblen-production' \
            "  HostName $SERVER_HOST" \
            "  User $SERVER_USER" \
            '  HostKeyAlias hi-veblen-production' \
            '  IdentityFile ~/.ssh/hi-veblen-deploy' \
            '  IdentitiesOnly yes' \
            '  BatchMode yes' \
            '  StrictHostKeyChecking yes' \
            '  ConnectTimeout 10' \
            > "$HOME/.ssh/config"
          chmod 0600 "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"
          ssh hi-veblen-production true

      - name: 运行合成用户出生准备或确认
        id: synthetic-operation
        env:
          TARGET_PERSIST_ID: ${{ inputs.target_persist_id }}
          EXPECTED_PORTAL_REVISION: ${{ inputs.expected_portal_revision }}
          EXPECTED_BACKEND_REVISION: ${{ inputs.expected_backend_revision }}
          OPERATION_ID: ${{ steps.synthetic-operation-id.outputs.operation_id }}
        run: |
          set -euo pipefail
          case "$TARGET_PERSIST_ID" in
            prepare_p6_load_c) mode=prepare ;;
            confirm_p6_load_c) mode=confirm ;;
            cleanup_p6_load_c) mode=cleanup ;;
          esac
          ssh hi-veblen-production 'bash -se --' \
            "$EXPECTED_PORTAL_REVISION" "$EXPECTED_BACKEND_REVISION" <<'REMOTE'
          set -eu
          test "$(cat /opt/hi-veblen/portal-current/release.txt)" = "$1"
          test "$(cat /opt/hi-veblen/lingxi-current/release.txt)" = "$2"
          test "$(cat /opt/myagent/backend-current/release.txt)" = "$2"
          REMOTE
          ssh hi-veblen-production \
            "cd /opt/myagent/backend-current && exec .venv/bin/python -B - $mode $OPERATION_ID" \
            < scripts/d050_prepare_synthetic.py
          if test "$mode" = "prepare"; then
            ssh hi-veblen-production \
              'cat /opt/myagent/d050-recovery/p6-load-c/setup.json' \
              > d050-synthetic-setup-audition.json
          fi

      - name: 清除合成用户准备 SSH 凭据
        id: clear-prepare-ssh
        if: ${{ always() }}
        run: rm -f -- "$HOME/.ssh/hi-veblen-deploy" "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"

      - name: 保存完整出生试镜证据
        id: upload-audition
        if: ${{ success() && inputs.target_persist_id == 'prepare_p6_load_c' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: d050-synthetic-setup-audition-${{ github.sha }}
          path: d050-synthetic-setup-audition.json
          if-no-files-found: error
          retention-days: 3

      - name: 失败或取消时按本次租约回滚
        if: >-
          ${{ always() && steps.prepare-ssh.outcome == 'success' &&
          (steps.synthetic-operation.outcome != 'success' ||
          (inputs.target_persist_id == 'prepare_p6_load_c' &&
          steps.upload-audition.outcome != 'success')) }}
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          OPERATION_ID: ${{ steps.synthetic-operation-id.outputs.operation_id }}
        run: |
          set -euo pipefail
          case "$SERVER_HOST" in
            ''|*[!A-Za-z0-9.:-]*) echo "SERVER_HOST 格式无效" >&2; exit 1 ;;
          esac
          case "$SERVER_USER" in
            ''|*[!A-Za-z0-9._-]*) echo "SERVER_USER 格式无效" >&2; exit 1 ;;
          esac
          printf '%s' "$OPERATION_ID" | grep -Eq '^[0-9]+-[0-9]+-[0-9a-f]{40}$'
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/hi-veblen-deploy"
          chmod 0600 "$HOME/.ssh/hi-veblen-deploy"
          printf '%s\n' \
            'hi-veblen-production ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM4IhOSWQcIioXavkJYcZ1WbE682kGvQF+rTAgnBRNif' \
            > "$HOME/.ssh/known_hosts"
          printf '%s\n' \
            'Host hi-veblen-production' \
            "  HostName $SERVER_HOST" \
            "  User $SERVER_USER" \
            '  HostKeyAlias hi-veblen-production' \
            '  IdentityFile ~/.ssh/hi-veblen-deploy' \
            '  IdentitiesOnly yes' \
            '  BatchMode yes' \
            '  StrictHostKeyChecking yes' \
            '  ConnectTimeout 10' \
            > "$HOME/.ssh/config"
          chmod 0600 "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"
          ssh hi-veblen-production \
            "cd /opt/myagent/backend-current && exec .venv/bin/python -B - cleanup $OPERATION_ID" \
            < scripts/d050_prepare_synthetic.py
          rm -f -- "$HOME/.ssh/hi-veblen-deploy" "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"

  recover-stuck-deletion:
    name: 恢复旧整用户删除现场
    if: >-
      inputs.target_persist_id == 'recover_p6_load_b' &&
      github.repository == 'Timking123/hi-veblen' &&
      github.actor == 'Timking123' &&
      github.triggering_actor == 'Timking123'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production

    steps:
      - name: 检出恢复脚本
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: 校验恢复参数
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_PORTAL_REVISION: ${{ inputs.expected_portal_revision }}
          EXPECTED_BACKEND_REVISION: ${{ inputs.expected_backend_revision }}
        run: |
          set -euo pipefail
          printf '%s' "$EXPECTED_HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$EXPECTED_PORTAL_REVISION" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$EXPECTED_BACKEND_REVISION" | grep -Eq '^[0-9a-f]{40}$'
          test "$EXPECTED_HEAD_SHA" = "$GITHUB_SHA"

      - name: 配置受信 SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -eu
          case "$SERVER_HOST" in
            ''|*[!A-Za-z0-9.:-]*) echo "SERVER_HOST 格式无效" >&2; exit 1 ;;
          esac
          case "$SERVER_USER" in
            ''|*[!A-Za-z0-9._-]*) echo "SERVER_USER 格式无效" >&2; exit 1 ;;
          esac
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/hi-veblen-deploy"
          chmod 0600 "$HOME/.ssh/hi-veblen-deploy"
          printf '%s\n' \
            'hi-veblen-production ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM4IhOSWQcIioXavkJYcZ1WbE682kGvQF+rTAgnBRNif' \
            > "$HOME/.ssh/known_hosts"
          printf '%s\n' \
            'Host hi-veblen-production' \
            "  HostName $SERVER_HOST" \
            "  User $SERVER_USER" \
            '  HostKeyAlias hi-veblen-production' \
            '  IdentityFile ~/.ssh/hi-veblen-deploy' \
            '  IdentitiesOnly yes' \
            '  BatchMode yes' \
            '  StrictHostKeyChecking yes' \
            '  ConnectTimeout 10' \
            > "$HOME/.ssh/config"
          chmod 0600 "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"
          ssh hi-veblen-production true

      - name: 验证替代用户、重启网关并幂等完成旧删除
        env:
          EXPECTED_PORTAL_REVISION: ${{ inputs.expected_portal_revision }}
          EXPECTED_BACKEND_REVISION: ${{ inputs.expected_backend_revision }}
        run: |
          set -euo pipefail
          ssh hi-veblen-production 'bash -se --' \
            "$EXPECTED_PORTAL_REVISION" "$EXPECTED_BACKEND_REVISION" <<'REMOTE'
          set -eu
          expected_portal_revision="$1"
          expected_backend_revision="$2"
          exec 9>/run/hi-veblen-release.lock
          flock -x -n 9
          for path in \
            /run/hi-veblen-release-lease \
            /run/myagent-release-maintenance \
            /run/hi-veblen-release-preserve; do
            test ! -e "$path"
            test ! -L "$path"
          done
          test "$(cat /opt/hi-veblen/portal-current/release.txt)" = "$expected_portal_revision"
          test "$(cat /opt/hi-veblen/lingxi-current/release.txt)" = "$expected_backend_revision"
          test "$(cat /opt/myagent/backend-current/release.txt)" = "$expected_backend_revision"
          python=/opt/myagent/backend-current/.venv/bin/python
          test -x "$python"
          cd /opt/myagent/backend-current
          "$python" -B - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path
          from urllib import request

          from dotenv import dotenv_values
          from brain.persona import DEFAULT_PERSONA_ID
          from brain.workspace.p6_config import (
              is_gateway_token_revoked,
              load_user_config,
              onboarding_status,
              parse_user_token_map,
              persona_growth_consent_status,
              token_hash,
          )
          from brain.workspace.user_paths import load_user_meta, user_storage_paths

          data_dir = "/opt/myagent/data"
          values = dotenv_values("/opt/myagent/.env")
          mapping = parse_user_token_map(
              values.get("BRAIN_GATEWAY_USER_TOKENS") or ""
          )

          def eligibility(candidate: str) -> dict[str, bool | str]:
              token = str(mapping.get(candidate) or "")
              user_dir = Path(data_dir) / "users" / candidate
              directory_present = user_dir.is_dir()
              config = load_user_config(data_dir, candidate) if directory_present else {}
              try:
                  meta = load_user_meta(user_storage_paths(data_dir, candidate))
              except Exception:
                  meta = {}
              role = config.get("role_choice") if isinstance(config, dict) else {}
              persona_id = str((role or {}).get("persona_id") or "")
              preset_role_id = str((role or {}).get("preset_role_id") or "")
              token_present = bool(token)
              token_active = token_present and not is_gateway_token_revoked(
                  data_dir, token_hash(token)
              )
              onboarding_completed = bool(onboarding_status(config)["completed"])
              binding_matches_meta = bool(persona_id) and meta.get("persona") == persona_id
              private_binding = (
                  (role or {}).get("mode") == "wizard"
                  and preset_role_id == DEFAULT_PERSONA_ID
                  and persona_id == (
                      "custom_"
                      + hashlib.sha256(candidate.encode("utf-8")).hexdigest()[:16]
                  )
              )
              growth_accepted = bool(persona_growth_consent_status(config)["accepted"])
              shared_pending = (
                  bool(persona_id)
                  and not persona_id.startswith("custom_")
                  and binding_matches_meta
                  and not growth_accepted
              )
              private_resumed = (
                  private_binding and binding_matches_meta and growth_accepted
              )
              acceptance_mode = (
                  "private_resumed"
                  if private_resumed
                  else "shared_pending"
                  if shared_pending
                  else ""
              )
              checks = {
                  "persist_id": candidate,
                  "token_present": token_present,
                  "directory_present": directory_present,
                  "token_active": token_active,
                  "onboarding_completed": onboarding_completed,
                  "binding_matches_meta": binding_matches_meta,
                  "private_binding": private_binding,
                  "growth_accepted": growth_accepted,
                  "shared_pending": shared_pending,
                  "private_resumed": private_resumed,
                  "acceptance_mode": acceptance_mode,
              }
              checks["eligible"] = all(
                  checks[key]
                  for key in (
                      "token_present",
                      "directory_present",
                      "token_active",
                      "onboarding_completed",
                      "binding_matches_meta",
                  )
              ) and bool(acceptance_mode)
              return checks

          candidates = [
              eligibility(candidate)
              for candidate in ("p6_load_c", "p6_load_a", "p6_e2e_current")
          ]
          selected = next(
              (item["persist_id"] for item in candidates if item["eligible"]), ""
          )
          print(json.dumps({
              "synthetic_eligibility": candidates,
              "selected_candidate": selected,
          }, ensure_ascii=False, sort_keys=True))
          if not selected:
              raise SystemExit("没有可用于最终验收的合格替代合成用户")

          target = "p6_load_b"
          target_token = str(mapping.get(target) or "")
          target_token_revoked = bool(target_token) and is_gateway_token_revoked(
              data_dir, token_hash(target_token)
          )
          target_dir = Path(data_dir) / "users" / target
          target_directory_present = target_dir.is_dir()
          print(json.dumps({
              "stuck_deletion_preflight": {
                  "persist_id": target,
                  "token_present": bool(target_token),
                  "token_revoked": target_token_revoked,
                  "directory_present": target_directory_present,
              }
          }, ensure_ascii=False, sort_keys=True))
          if not target_token_revoked or not target_directory_present:
              raise SystemExit("旧删除目标的凭证或目录状态与事故现场不一致")

          subprocess.run(
              ["systemctl", "restart", "myagent-gateway.service"],
              check=True,
              timeout=120,
          )
          for action in ("is-active", "is-enabled"):
              subprocess.run(
                  ["systemctl", action, "--quiet", "myagent-gateway.service"],
                  check=True,
                  timeout=30,
              )
          drop_ins = subprocess.run(
              [
                  "systemctl", "show", "myagent-gateway.service",
                  "-p", "DropInPaths", "--value",
              ],
              check=True,
              capture_output=True,
              text=True,
              timeout=30,
          ).stdout.strip()
          if drop_ins:
              raise SystemExit("gateway 服务存在临时 DropInPaths")

          host_token = str(
              values.get("BRAIN_HOST_TOKEN")
              or values.get("BRAIN_GATEWAY_TOKEN")
              or ""
          ).strip()
          if not host_token:
              raise SystemExit("宿主内部认证不可用")
          host_port = int(values.get("BRAIN_HOST_PORT") or 8765)
          with request.urlopen(
              f"http://127.0.0.1:{host_port}/host/health", timeout=30
          ) as response:
              host_health = json.loads(response.read().decode("utf-8"))
          host = host_health.get("host") or host_health
          if (
              host.get("ready") is not True
              or host.get("audition_isolation_ok") is not True
          ):
              raise SystemExit("旧删除恢复前宿主未就绪")
          body = json.dumps({"persist_id": target}).encode("utf-8")
          req = request.Request(
              f"http://127.0.0.1:{host_port}/host/purge_user",
              data=body,
              method="POST",
              headers={
                  "Authorization": f"Bearer {host_token}",
                  "Content-Type": "application/json",
              },
          )
          with request.urlopen(req, timeout=180) as response:
              status = response.status
              payload = json.loads(response.read().decode("utf-8"))
          directory_absent = not target_dir.exists() and not target_dir.is_symlink()
          print(json.dumps({
              "stuck_deletion_result": {
                  "http_status": status,
                  "ok": payload.get("ok") is True,
                  "directory_absent": directory_absent,
              }
          }, ensure_ascii=False, sort_keys=True))
          if status != 200 or payload.get("ok") is not True or not directory_absent:
              raise SystemExit("旧删除现场未能幂等收口")
          PY
          REMOTE

      - name: 等待连续性与心跳自然恢复
        env:
          EXPECTED_BACKEND_REVISION: ${{ inputs.expected_backend_revision }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 2100))
          while test "$SECONDS" -lt "$deadline"; do
            health="$(curl --connect-timeout 10 --max-time 30 \
              --fail --silent --show-error https://lingxi.hi-veblen.com/api/health || true)"
            if HEALTH="$health" EXPECTED_BACKEND_REVISION="$EXPECTED_BACKEND_REVISION" \
              python3 - <<'PY'
          import json
          import os

          try:
              payload = json.loads(os.environ.get("HEALTH") or "{}")
          except json.JSONDecodeError:
              raise SystemExit(1)
          host = payload.get("host") or {}
          heartbeat = host.get("heartbeat") or {}
          persona_import = payload.get("persona_import") or {}
          persona_growth = payload.get("persona_growth") or {}
          ready = all((
              payload.get("ok") is True,
              payload.get("backend_revision") == os.environ["EXPECTED_BACKEND_REVISION"],
              payload.get("persona_schema_phase") == "active",
              persona_import.get("provider_verified") is True,
              persona_import.get("ready") is True,
              persona_growth.get("phase") == "active",
              persona_growth.get("runtime_ready") is True,
              persona_growth.get("ready") is True,
              host.get("ready") is True,
              host.get("continuity_ok") is True,
              heartbeat.get("running") is True,
              heartbeat.get("consecutive_failures") == 0,
              heartbeat.get("in_flight") is False,
              heartbeat.get("in_flight_timed_out") is False,
          ))
          raise SystemExit(0 if ready else 1)
          PY
            then
              echo "旧生产连续性、成长 readiness 与心跳已恢复"
              exit 0
            fi
            echo "等待下一拍健康恢复"
            sleep 30
          done
          echo "等待旧生产健康恢复超时" >&2
          exit 1

      - name: 清除生产 SSH 凭据
        if: ${{ always() }}
        run: rm -f -- "$HOME/.ssh/hi-veblen-deploy" "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"

  acceptance:
    name: 生产桌面移动全链
    if: >-
      inputs.target_persist_id != 'recover_p6_load_b' &&
      inputs.target_persist_id != 'audit_p6_load_c' &&
      inputs.target_persist_id != 'prepare_p6_load_c' &&
      inputs.target_persist_id != 'confirm_p6_load_c' &&
      inputs.target_persist_id != 'cleanup_p6_load_c' &&
      github.repository == 'Timking123/hi-veblen' &&
      github.actor == 'Timking123' &&
      github.triggering_actor == 'Timking123'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production

    steps:
      - name: 检出验收脚本
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: 校验人工触发目标
        env:
          TARGET_PERSIST_ID: ${{ inputs.target_persist_id }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_PORTAL_REVISION: ${{ inputs.expected_portal_revision }}
          EXPECTED_BACKEND_REVISION: ${{ inputs.expected_backend_revision }}
        run: |
          set -euo pipefail
          test "$TARGET_PERSIST_ID" = "p6_load_b"
          printf '%s' "$EXPECTED_HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$EXPECTED_PORTAL_REVISION" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$EXPECTED_BACKEND_REVISION" | grep -Eq '^[0-9a-f]{40}$'
          test "$EXPECTED_HEAD_SHA" = "$GITHUB_SHA"
          test "$EXPECTED_PORTAL_REVISION" = "$EXPECTED_HEAD_SHA"
          locked_backend_revision="$(
            sed -n 's/^  LINGXI_SHA: \([0-9a-f]\{40\}\)$/\1/p' .github/workflows/deploy.yml
          )"
          test "$EXPECTED_BACKEND_REVISION" = "$locked_backend_revision"

      - name: 等待最终生产 revision
        env:
          EXPECTED_PORTAL_REVISION: ${{ inputs.expected_portal_revision }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$EXPECTED_PORTAL_REVISION" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "目标 Portal revision 格式无效" >&2
            exit 1
          fi
          deadline=$((SECONDS + 1500))
          while test "$SECONDS" -lt "$deadline"; do
            current="$(curl --connect-timeout 10 --max-time 30 \
              --fail --silent --show-error https://hi-veblen.com/release.txt || true)"
            if test "$current" = "$EXPECTED_PORTAL_REVISION"; then
              echo "目标生产 revision 已就绪"
              exit 0
            fi
            sleep 15
          done
          echo "等待目标生产 revision 超时" >&2
          exit 1

      - name: 设置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装浏览器依赖
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: 配置受信 SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -eu
          case "$SERVER_HOST" in
            ''|*[!A-Za-z0-9.:-]*) echo "SERVER_HOST 格式无效" >&2; exit 1 ;;
          esac
          case "$SERVER_USER" in
            ''|*[!A-Za-z0-9._-]*) echo "SERVER_USER 格式无效" >&2; exit 1 ;;
          esac
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/hi-veblen-deploy"
          chmod 0600 "$HOME/.ssh/hi-veblen-deploy"
          printf '%s\n' \
            'hi-veblen-production ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM4IhOSWQcIioXavkJYcZ1WbE682kGvQF+rTAgnBRNif' \
            > "$HOME/.ssh/known_hosts"
          printf '%s\n' \
            'Host hi-veblen-production' \
            "  HostName $SERVER_HOST" \
            "  User $SERVER_USER" \
            '  HostKeyAlias hi-veblen-production' \
            '  IdentityFile ~/.ssh/hi-veblen-deploy' \
            '  IdentitiesOnly yes' \
            '  BatchMode yes' \
            '  StrictHostKeyChecking yes' \
            '  ConnectTimeout 10' \
            > "$HOME/.ssh/config"
          chmod 0600 "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"
          ssh hi-veblen-production true

      - name: 读取并掩码合成用户凭证
        id: read-credentials
        env:
          TARGET_PERSIST_ID: ${{ inputs.target_persist_id }}
        run: |
          set -euo pipefail
          case "$TARGET_PERSIST_ID" in
            p6_load_b) ;;
            *) echo "本次验收目标不是已批准的合成用户" >&2; exit 1 ;;
          esac
          mapfile -t values < <(
            ssh hi-veblen-production 'bash -se --' "$TARGET_PERSIST_ID" <<'REMOTE'
          set -eu
          target_persist_id="$1"
          test "$target_persist_id" = "p6_load_b"
          python=/opt/myagent/backend-current/.venv/bin/python
          test -x "$python"
          cd /opt/myagent/backend-current
          TARGET_PERSIST_ID="$target_persist_id" "$python" - <<'PY'
          import json
          import hashlib
          import os
          from pathlib import Path

          from dotenv import dotenv_values
          from brain.persona import DEFAULT_PERSONA_ID
          from brain.workspace.p6_config import (
              is_gateway_token_revoked,
              load_user_config,
              onboarding_status,
              persona_growth_consent_status,
              token_hash,
          )
          from brain.workspace.user_paths import load_user_meta, user_storage_paths

          values = dotenv_values("/opt/myagent/.env")
          mapping = json.loads(values.get("BRAIN_GATEWAY_USER_TOKENS") or "{}")
          diagnostics = []
          candidate = os.environ["TARGET_PERSIST_ID"]
          if candidate != "p6_load_b":
              raise SystemExit("本次验收目标不是已批准的合成用户")
          token = str(mapping.get(candidate) or "")
          user_dir = Path("/opt/myagent/data/users") / candidate
          token_present = bool(token)
          directory_present = user_dir.is_dir()
          revoked = token_present and is_gateway_token_revoked(
              "/opt/myagent/data", token_hash(token)
          )
          config = (
              load_user_config("/opt/myagent/data", candidate)
              if directory_present
              else {}
          )
          try:
              meta = load_user_meta(user_storage_paths("/opt/myagent/data", candidate))
          except Exception:
              meta = {}
          role = config.get("role_choice") if isinstance(config, dict) else {}
          persona_id = str((role or {}).get("persona_id") or "")
          binding_matches_meta = bool(persona_id) and meta.get("persona") == persona_id
          preset_role_id = str((role or {}).get("preset_role_id") or "")
          growth = persona_growth_consent_status(config)
          onboarding = onboarding_status(config)
          onboarding_completed = bool(onboarding["completed"])
          resumed_private = (
              (role or {}).get("mode") == "wizard"
              and preset_role_id == DEFAULT_PERSONA_ID
              and binding_matches_meta
              and persona_id == (
                  "custom_" + hashlib.sha256(candidate.encode("utf-8")).hexdigest()[:16]
              )
          )
          growth_accepted = bool(growth["accepted"])
          diagnostics.append({
              "persist_id": candidate,
              "token_present": token_present,
              "directory_present": directory_present,
              "revoked": revoked,
              "onboarding_completed": onboarding_completed,
              "onboarding_status": onboarding["status"],
              "binding_matches_meta": binding_matches_meta,
              "resumed_private": resumed_private,
              "role_mode": str((role or {}).get("mode") or ""),
              "growth_accepted": growth_accepted,
          })
          if not all((token_present, directory_present, not revoked,
                      onboarding_completed, resumed_private, growth_accepted)):
              raise SystemExit(json.dumps({
                  "error": "指定合成用户不满足安全续跑条件",
                  "synthetic_eligibility": diagnostics,
              }, sort_keys=True))

          print(candidate)
          print(token)
          print(candidate)
          print(token)
          print("private_resumed")
          PY
          REMOTE
          )
          test "${#values[@]}" -eq 5
          primary_id="${values[0]}"
          primary_token="${values[1]}"
          delete_id="${values[2]}"
          delete_token="${values[3]}"
          acceptance_mode="${values[4]}"
          case "$primary_id" in
            p6_e2e_current|p6_load_a|p6_load_b|p6_load_c) ;;
            *) echo "登录验收用户不在合成白名单" >&2; exit 1 ;;
          esac
          test -n "$primary_token"
          case "$delete_id" in
            p6_e2e_current|p6_load_a|p6_load_b|p6_load_c) ;;
            *) echo "删除验收用户不在合成白名单" >&2; exit 1 ;;
          esac
          test -n "$delete_token"
          case "$acceptance_mode" in
            shared_pending|private_resumed) ;;
            *) echo "合成用户验收模式非法" >&2; exit 1 ;;
          esac
          primary_token_b64="$(printf '%s' "$primary_token" | base64 -w0)"
          delete_token_b64="$(printf '%s' "$delete_token" | base64 -w0)"
          echo "::add-mask::$primary_token"
          echo "::add-mask::$delete_token"
          echo "::add-mask::$primary_token_b64"
          echo "::add-mask::$delete_token_b64"
          {
            printf 'D050_PRIMARY_ID=%s\n' "$primary_id"
            printf 'D050_PRIMARY_TOKEN_B64=%s\n' "$primary_token_b64"
            printf 'D050_DELETE_ID=%s\n' "$delete_id"
            printf 'D050_DELETE_TOKEN_B64=%s\n' "$delete_token_b64"
            printf 'D050_ACCEPTANCE_MODE=%s\n' "$acceptance_mode"
          } >> "$GITHUB_ENV"
          echo "已选择合成验收用户：$primary_id；模式：$acceptance_mode；删除用户：$delete_id"

      - name: 在浏览器执行前清除生产 SSH 凭据
        if: ${{ always() }}
        run: rm -f "$HOME/.ssh/hi-veblen-deploy" "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"

      - name: 运行生产真实 Chromium 全链
        env:
          D050_BASE_URL: https://lingxi.hi-veblen.com
          D050_EXPECTED_PORTAL_REVISION: ${{ inputs.expected_portal_revision }}
          D050_EXPECTED_BACKEND_REVISION: ${{ inputs.expected_backend_revision }}
        run: npx playwright test e2e/d050-production-acceptance.spec.ts --config=e2e/d050-production-acceptance.config.ts

      - name: 清除 Runner 合成凭证
        if: ${{ always() }}
        run: |
          {
            printf 'D050_PRIMARY_TOKEN_B64=\n'
            printf 'D050_DELETE_TOKEN_B64=\n'
          } >> "$GITHUB_ENV"

      - name: 为后置复核重新配置受信 SSH
        id: post-ssh
        if: ${{ always() && steps.read-credentials.outcome == 'success' }}
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -eu
          case "$SERVER_HOST" in
            ''|*[!A-Za-z0-9.:-]*) echo "SERVER_HOST 格式无效" >&2; exit 1 ;;
          esac
          case "$SERVER_USER" in
            ''|*[!A-Za-z0-9._-]*) echo "SERVER_USER 格式无效" >&2; exit 1 ;;
          esac
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/hi-veblen-deploy"
          chmod 0600 "$HOME/.ssh/hi-veblen-deploy"
          printf '%s\n' \
            'hi-veblen-production ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM4IhOSWQcIioXavkJYcZ1WbE682kGvQF+rTAgnBRNif' \
            > "$HOME/.ssh/known_hosts"
          printf '%s\n' \
            'Host hi-veblen-production' \
            "  HostName $SERVER_HOST" \
            "  User $SERVER_USER" \
            '  HostKeyAlias hi-veblen-production' \
            '  IdentityFile ~/.ssh/hi-veblen-deploy' \
            '  IdentitiesOnly yes' \
            '  BatchMode yes' \
            '  StrictHostKeyChecking yes' \
            '  ConnectTimeout 10' \
            > "$HOME/.ssh/config"
          chmod 0600 "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"
          ssh hi-veblen-production true

      - name: 诊断持续成长锁
        if: ${{ failure() && steps.post-ssh.outcome == 'success' }}
        run: |
          set -euo pipefail
          ssh hi-veblen-production 'bash -se --' "$D050_PRIMARY_ID" \
            > d050-growth-lock-diagnostic.json <<'REMOTE'
          set -eu
          persist_id="$1"
          test "$persist_id" = "p6_load_b"
          python=/opt/myagent/backend-current/.venv/bin/python
          cd /opt/myagent/backend-current
          "$python" -B - "$persist_id" <<'PY'
          import fcntl
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          from brain.persona.growth_runtime import (
              GrowthRuntimeCoordinator,
              _user_change_lock_path,
          )
          from brain.workspace.user_paths import (
              runtime_persist_lock_path,
              user_storage_paths,
          )

          data_dir = "/opt/myagent/data"
          persist_id = sys.argv[1]
          paths = user_storage_paths(data_dir, persist_id)

          def process_summary(pid: int) -> dict:
              root = Path("/proc") / str(pid)
              if not root.is_dir():
                  return {"pid": pid, "exists": False}
              comm = (root / "comm").read_text(encoding="utf-8").strip()
              cgroup = (root / "cgroup").read_text(encoding="utf-8").splitlines()
              units = sorted({
                  match.group(0)
                  for line in cgroup
                  for match in [re.search(r"myagent-(?:world|gateway)\.service", line)]
                  if match is not None
              })
              return {"pid": pid, "exists": True, "comm": comm, "units": units}

          def lock_summary(path_value: str) -> dict:
              path = Path(path_value)
              summary = {"path": str(path), "exists": path.is_file()}
              if not path.is_file():
                  return summary
              stat = path.stat()
              content = path.read_text(encoding="utf-8", errors="replace")[:64].strip()
              holder = re.fullmatch(r"pid=(\\d+)", content)
              summary.update({
                  "mtime_ns": stat.st_mtime_ns,
                  "holder": process_summary(int(holder.group(1))) if holder else None,
              })
              with path.open("r", encoding="utf-8") as handle:
                  try:
                      fcntl.flock(handle.fileno(), fcntl.LOCK_EX | fcntl.LOCK_NB)
                  except BlockingIOError:
                      summary["held"] = True
                  else:
                      summary["held"] = False
                      fcntl.flock(handle.fileno(), fcntl.LOCK_UN)
              return summary

          def json_summary(path: Path, keys: tuple[str, ...]) -> dict:
              result = {"path": str(path), "exists": path.is_file()}
              if not path.is_file():
                  return result
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
                  result["fields"] = {
                      key: payload.get(key)
                      for key in keys
                      if key in payload and not isinstance(payload.get(key), (dict, list))
                  }
                  pending = payload.get("pending_candidate")
                  if isinstance(pending, dict):
                      result["pending_candidate"] = {
                          key: pending.get(key)
                          for key in ("status", "retry_reason", "next_retry_at")
                      }
              except Exception as exc:
                  result["error_type"] = type(exc).__name__
              return result

          service_pids = {}
          for unit in ("myagent-world.service", "myagent-gateway.service"):
              raw = subprocess.check_output(
                  ["systemctl", "show", unit, "-p", "MainPID", "--value"],
                  text=True,
              ).strip()
              service_pids[unit] = int(raw or "0")

          user_dir = Path(paths.user_dir)
          coordinator = GrowthRuntimeCoordinator(data_dir)
          result = {
              "persist_id": persist_id,
              "service_pids": service_pids,
              "locks": {
                  "gateway_user": lock_summary(
                      str(_user_change_lock_path(data_dir, persist_id))
                  ),
                  "runtime": lock_summary(
                      runtime_persist_lock_path(data_dir, persist_id)
                  ),
              },
              "growth_transaction": json_summary(
                  coordinator._journal_path(persist_id),
                  (
                      "schema_version", "status", "persist_id", "persona_id",
                      "revision_id", "created_at", "updated_at",
                  ),
              ),
              "growth_envelope": json_summary(
                  user_dir / "persona_calibration.json",
                  ("schema_version", "persona_id", "revision", "updated_at"),
              ),
          }
          print(json.dumps(result, ensure_ascii=False, sort_keys=True, indent=2))
          PY
          REMOTE

      - name: 复核整用户磁盘删除
        if: ${{ always() && steps.post-ssh.outcome == 'success' }}
        run: |
          set -euo pipefail
          if ! test -f d050-delete-confirmed.flag; then
            echo "浏览器链未确认 DELETE 成功，跳过磁盘删除复核"
            exit 0
          fi
          ssh hi-veblen-production 'bash -se --' "$D050_DELETE_ID" <<'REMOTE'
          set -eu
          persist_id="$1"
          case "$persist_id" in
            p6_e2e_current|p6_load_a|p6_load_b|p6_load_c) ;;
            *) echo "删除验收用户不在合成白名单" >&2; exit 1 ;;
          esac
          test ! -e "/opt/myagent/data/users/$persist_id"
          test ! -L "/opt/myagent/data/users/$persist_id"
          echo "整用户磁盘删除 OK"
          REMOTE

      - name: 清除后置生产 SSH 凭据
        if: ${{ always() }}
        run: rm -f "$HOME/.ssh/hi-veblen-deploy" "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"

      - name: 保存非敏感验收证据
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: d050-production-acceptance-${{ github.sha }}
          path: |
            d050-production-evidence.json
            d050-portal.png
            d050-desktop.png
            d050-mobile.png
            d050-delete-complete.png
            d050-delete-confirmed.flag
          if-no-files-found: error
          retention-days: 3
