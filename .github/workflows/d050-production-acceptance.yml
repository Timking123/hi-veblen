          test "$browser_confirmed" = 0 || test "$browser_confirmed" = 1
          test "$ready_verified" = 0 || test "$ready_verified" = 1
          python=/opt/myagent/backend-current/.venv/bin/python
          cd /opt/myagent/backend-current
          "$python" - "$persist_id" "$expected_token_hash" \
            "$browser_confirmed" "$ready_verified" <<'PY'
          import json
          from pathlib import Path
          import sys
          from urllib import parse, request

          from dotenv import dotenv_values
          from brain.workspace.p6_config import is_gateway_token_revoked

          data_dir = "/opt/myagent/data"
          persist_id, expected_hash = sys.argv[1:3]
          browser_confirmed = sys.argv[3] == "1"
          ready_verified = sys.argv[4] == "1"
          user_dir = Path(data_dir) / "users" / persist_id
          revoked = is_gateway_token_revoked(data_dir, expected_hash)
          continued_purge = False
          gateway_report = None

          if revoked:
              values = dotenv_values("/opt/myagent/.env")
              gateway_token = str(values.get("BRAIN_GATEWAY_TOKEN") or "").strip()
              if len(gateway_token) < 32:
                  raise SystemExit("生产网关续删凭证无效")
              req = request.Request(
                  "http://127.0.0.1:8000/api/users/" + parse.quote(persist_id),
                  headers={"Authorization": f"Bearer {gateway_token}"},
                  method="DELETE",
              )
              with request.urlopen(req, timeout=180) as response:
                  gateway_report = json.loads(response.read().decode("utf-8"))
              if not (
                  gateway_report.get("ok") is True
                  and gateway_report.get("deleted") is True
                  and gateway_report.get("audit_retained") is True
              ):
                  raise SystemExit("网关续删未成功")
              continued_purge = True

          directory_absent = not user_dir.exists() and not user_dir.is_symlink()
          revoked = is_gateway_token_revoked(data_dir, expected_hash)
          if browser_confirmed and not (revoked and directory_absent):
              raise SystemExit("浏览器已确认删除但服务端状态不闭合")
          if revoked and directory_absent:
              state = "continued_after_revoke" if continued_purge else "deleted"
          elif not revoked and user_dir.is_dir() and not user_dir.is_symlink():
              state = "retryable_ready" if ready_verified else "ready_cleanup_blocked"
          else:
              raise SystemExit("整用户删除进入未知状态")

          print(json.dumps({
              "persist_id": persist_id,
              "browser_confirmed": browser_confirmed,
              "ready_verified": ready_verified,
              "token_revoked": revoked,
              "directory_absent": directory_absent,
              "continued_purge": continued_purge,
              "gateway_deleted": (
                  gateway_report.get("deleted")
                  if isinstance(gateway_report, dict)
                  else None
              ),
              "gateway_audit_retained": (
                  gateway_report.get("audit_retained")
                  if isinstance(gateway_report, dict)
                  else None
              ),
              "state": state,
              "BAD": int(state == "ready_cleanup_blocked"),
          }, sort_keys=True))
          if state == "ready_cleanup_blocked":
              raise SystemExit(1)
          PY
          REMOTE

